      '<textarea class="field mono" id="bkData" style="min-height:80px;font-size:11px" spellcheck="false">'+esc(data)+'</textarea>'+
      '<div style="display:flex;gap:8px;margin-top:9px">'+
        '<button class="btn ghost sm" data-act="copyData" style="flex:1">Copiar</button>'+
        '<button class="btn ghost sm" data-act="restoreData" style="flex:1">Restaurar</button>'+
      '</div>'+
      '<p class="hint" id="bkMsg" style="margin-top:8px"></p>'+
    '</div>'+
    (S.demo?'<button class="btn ghost wide" data-act="clearDemo">Borrar los datos de ejemplo</button>':"")+
    '<button class="btn danger wide" data-act="wipe">Borrar todo y empezar de cero</button>'
  );
}

/* ══════════ acciones ══════════ */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;

  switch(a){
    case "tab":
      S.tab = el.dataset.tab; save(); render(); break;

    case "primary":
      if(S.tab==="foco") sheetConcentracion();
      else if(S.tab==="hoy") sheetAvisosLista();
      else if(S.tab==="habitos") sheetNuevoHabito();
      else if(S.tab==="tareas"){ const i=$("#taskInput"); if(i) i.focus(); }
      else if(S.tab==="gastos") sheetGasto();
      else if(S.tab==="notas") sheetNota(null);
      else if(S.tab==="cultura") sheetCulNuevo();
      else if(S.gymTab==="rutinas") openRoutine(null);
      else if(S.gymTab==="progreso") sheetGoal();
      else if(S.gym.active) sheetAddEx("session");
      else sheetStart();
      break;

    case "settings": sheetAjustes(); break;
    case "irA": S.tab = el.dataset.t; save(); render(); break;
    case "diarioSet": {
      const c = el.dataset.c, n = +el.dataset.n;
      const e = S.diario[today()] = S.diario[today()] || {};
      e[c] = (e[c] === n) ? 0 : n;          /* tocar otra vez lo desmarca */
      save(); render(); break;
    }
    case "xpVer": sheetXP(); break;
    case "diarioTodo": sheetDiario(); break;
    case "semAnt": semanaOff++; sheetSemana(); break;
    case "semSig": semanaOff = Math.max(0, semanaOff-1); sheetSemana(); break;
    case "semana": semanaOff = 0; sheetSemana(); break;

    /* ─── objetivos del año ─── */
    case "metas": sheetMetas(); break;
    case "metaSave": {
      const tipo = $("#mtT").value;
      const obj = parseFloat(($("#mtO").value||"").replace(/\./g,"").replace(",","."));
      if(!(obj > 0)){ $("#mtO").focus(); toast("Pon la cifra que quieres alcanzar."); break; }
      const anio = new Date().getFullYear();
      const hab = tipo === "habito" ? $("#mtH").value : "";
      if(tipo === "habito" && !hab){ toast("Primero crea el hábito."); break; }
      const ya = S.metas.filter(function(m){ return m.tipo === tipo && Number(m.anio) === anio && (m.habito||"") === hab; })[0];
      if(ya) ya.objetivo = obj;
      else S.metas.push({id:uid(), tipo:tipo, objetivo:obj, anio:anio, habito:hab});
      save(); render(); sheetMetas(); break;
    }
    case "metaDel":
      S.metas = S.metas.filter(x=>x.id!==id); save(); render(); sheetMetas(); break;

    /* ─── fechas ─── */
    case "fechas": sheetFechas(); break;
    case "fdTipo":
      Array.prototype.forEach.call($("#fdTipo").children, function(c){ c.setAttribute("aria-pressed", c === el); });
      break;
    case "fechaSave": {
      const nombre = $("#fdN").value.trim();
      const dia = parseInt($("#fdD").value, 10), mes = parseInt($("#fdM").value, 10);
      const anioF = parseInt($("#fdA").value, 10);
      if(!nombre){ $("#fdN").focus(); break; }
      const maxDia = [31,29,31,30,31,30,31,31,30,31,30,31][mes-1];
      if(!(dia >= 1 && dia <= maxDia)){ $("#fdD").focus(); toast("Ese día no existe en ese mes."); break; }
      const pulsado = $("#fdTipo").querySelector('[aria-pressed="true"]');
      S.fechas.push({id:uid(), nombre:nombre, tipo:pulsado ? pulsado.dataset.t : "cumple", dia:dia, mes:mes,
                     anio:(anioF > 1900 && anioF <= new Date().getFullYear()) ? anioF : 0});
      save(); render(); sheetFechas(); break;
    }
    case "fechaDel":
      S.fechas = S.fechas.filter(x=>x.id!==id); save(); render(); sheetFechas(); break;

    /* ─── cardio ─── */
    case "cardio": sheetCardio(); break;
    case "cdTipo":
      cardioSel = el.dataset.t;
      Array.prototype.forEach.call($("#cdTipos").children, function(c){ c.setAttribute("aria-pressed", c === el); });
      { const d = $("#cdDur"); if(d) d.dispatchEvent(new Event("input")); }
      break;
    case "cardioSave": {
      const seg = parseDur($("#cdDur").value);
      if(!(seg > 0)){ $("#cdDur").focus(); toast("Apunta cuánto duró."); break; }
      const km = parseFloat(($("#cdKm").value||"").replace(",","."));
      S.gym.cardio.push({id:uid(), date:$("#cdF").value || today(), tipo:cardioSel, seg:seg,
                         km:(km > 0 ? Math.round(km*100)/100 : 0), notas:$("#cdN").value.trim(), ts:Date.now()});
      save(); closeSheet(); render();
      toast("Cardio apuntado. +" + XP.cardio + " XP");
      break;
    }
    case "cardioVer": sheetCardioVer(id); break;
    case "cardioDel":
      S.gym.cardio = S.gym.cardio.filter(x=>x.id!==id); save(); closeSheet(); render(); break;
    case "irCompra": S.tab = "tareas"; S.list = "compra"; save(); render(); break;

    /* ─── Reloj del iPhone ─── */
    case "reloj": sheetReloj(); break;
    case "relojSw":
      S.reloj[el.dataset.k] = el.getAttribute("aria-pressed") !== "true";
      el.setAttribute("aria-pressed", S.reloj[el.dataset.k] ? "true" : "false");
      save();
      break;
    case "relojGuardar":
      S.reloj.atajoTemp = $("#rlT").value.trim();
      S.reloj.atajoAlarma = $("#rlA").value.trim();
      save(); closeSheet(); render();
      toast("Guardado.");
      break;
    case "relojProbarT":
      S.reloj.atajoTemp = $("#rlT").value.trim(); save();
      lanzarAtajo(S.reloj.atajoTemp, "10");
      break;
    case "relojProbarA": {
      S.reloj.atajoAlarma = $("#rlA").value.trim(); save();
      const d = new Date(Date.now() + 2*60000);
      lanzarAtajo(S.reloj.atajoAlarma, pad(d.getHours()) + ":" + pad(d.getMinutes()) + "|Prueba de Bitácora");
      break;
    }

    /* ─── pomodoro ─── */
    case "focoIr": focoArrancar(S.foco.fase); focoTic(); break;
    case "focoParar": focoParar(); break;
    case "focoSaltar": {
      const sig = focoSiguiente();
      if(S.foco.fase === "trabajo"){ S.foco.ciclo++; }
      S.foco.fase = sig; S.foco.corriendo = false; S.foco.fin = 0;
      clearAlarm(); stopKeepAlive();
      save(); render(); break;
    }
    case "focoCfg": {
      const c = S.foco.cfg;
      c.trabajo = Math.max(1, parseInt($("#fcT").value,10)||25);
      c.corto   = Math.max(1, parseInt($("#fcC").value,10)||5);
      c.largo   = Math.max(1, parseInt($("#fcL").value,10)||15);
      c.ciclos  = Math.max(1, parseInt($("#fcN").value,10)||4);
      save(); render(); toast("Ciclo guardado.");
      break;
    }
    case "focoConc": sheetConcentracion(); break;
    case "focoAtajo":
      S.foco.atajo = $("#fcA").value.trim();
      save(); closeSheet(); render();
      toast(S.foco.atajo ? "Atajo guardado." : "Atajo borrado.");
      break;
    case "focoLanzar":
      lanzarAtajo(S.foco.atajo);
      break;

    /* ─── recordatorios ─── */
    case "avisos": sheetAvisosLista(); break;
    case "avisoOn": {
      const a = S.avisos.filter(x=>x.id===id)[0]; if(!a) break;
      a.on = !a.on; save(); programarAvisos(); sheetAvisosLista(); break;
    }
    case "avisoDia":
      el.setAttribute("aria-pressed", el.getAttribute("aria-pressed")!=="true"); break;
    case "saveAviso": {
      const h = $("#avH").value.trim();
      if(minutosDe(h) < 0){ $("#avH").focus(); toast("La hora va en formato 19:00."); break; }
      const t = $("#avT").value.trim();
      if(!t){ $("#avT").focus(); break; }
      const dias = [];
      Array.prototype.forEach.call($("#avD").children, function(c){
        if(c.getAttribute("aria-pressed")==="true") dias.push(+c.dataset.d);
      });
      if(!dias.length){ toast("Elige al menos un día."); break; }
      S.avisos.push({id:uid(), hora:h, texto:t, dias:dias, on:true, visto:""});
      save(); programarAvisos(); sheetAvisosLista();
      /* Se crea tambien como alarma del Reloj, que si suena con la app cerrada. */
      if(relojAlarma()) lanzarAtajo(S.reloj.atajoAlarma, h + "|" + t);
      break;
    }
    case "avisoReloj": {
      const a = S.avisos.filter(x=>x.id===id)[0]; if(!a) break;
      lanzarAtajo(S.reloj.atajoAlarma, a.hora + "|" + a.texto);
      break;
    }
    case "delAviso":
      S.avisos = S.avisos.filter(x=>x.id!==id);
      save(); programarAvisos(); sheetAvisosLista(); break;
    case "pedirNotif":
      askNotif();
      setTimeout(function(){ sheetAvisosLista(); }, 600); break;
    case "closeSheet": closeSheet(); break;

    /* avisos */
    case "avisos": sheetAvisos(); break;

    /* ─── sincronización ─── */
    case "sync": sheetSync(); break;
    case "syncOn": {
      const url = $("#syUrl").value.trim(), tok = $("#syTok").value.trim();
      const say = t => { const m = $("#syMsg"); if(m) m.textContent = t; };
      if(!url || !tok){ say("Rellena la direcci\u00f3n y el token."); return; }
      say("Conectando\u2026");
      S.srv.url = url; S.srv.token = tok;
      srvFetch("/api/bitacora/meta").then(function(r){
        if(r.status===401){ say("El token no vale o ha caducado."); return; }
        if(!r.ok){ say("El servidor respondi\u00f3 "+r.status+"."); return; }
        return r.json().then(function(meta){
          S.sync.on = true;
          if(meta.rev === 0){
            /* Buzón vacío: este dispositivo siembra los datos. */
            S.sync.rev = 0; S.sync.at = null;
            persist();
            return syncSubir(true).then(function(){ say("Activada. Tus datos ya est\u00e1n en el servidor."); });
          }
          /* Ya hay datos de otro dispositivo: que decida el usuario. */
          S.sync.rev = 0; S.sync.at = null;
          persist();
          closeSheet();
          sheetConflicto(meta);
        });
      }).catch(function(){
        say("No he podido conectar. Revisa la direcci\u00f3n y que el servidor permita este dominio (CORS).");
      });
      break;
    }
    case "syncOff":
      S.sync.on = false; persist(); closeSheet(); render();
      toast("Sincronizaci\u00f3n desactivada. Los datos siguen aqu\u00ed.");
      break;
    case "syncYa": {
      const say = t => { const m = $("#syMsg"); if(m) m.textContent = t; };
      say("Sincronizando\u2026");
      syncAhora(false).then(function(r){
        if(r==="conflicto") return;
        say(r ? "Listo." : "No he podido hablar con el servidor.");
      });
      break;
    }
    case "cfQuedarme": {
      /* Escribimos sobre la revisión que hay ahora en el servidor: eso
         sustituye lo suyo por lo nuestro. */
      S.sync.rev = +el.dataset.rev || 0;
      S.sync.on = true;
      persist(); closeSheet();
      syncSubir(true).then(function(){ toast("Se ha subido lo de este dispositivo."); render(); });
      break;
    }
    case "cfTraer":
      S.sync.on = true;
      closeSheet();
      syncBajar(true).then(function(){ toast("Tra\u00eddos los datos del servidor."); });
      break;
    case "buscarAct":
      el.textContent = "Comprobando\u2026";
      buscarActualizacion(false).then(function(r){
        if(el) el.textContent = r ? "Buscar actualizaciones" : "Sin conexi\u00f3n";
      });
      break;
    case "testAlarm": {
      unlockAudio(); startKeepAlive(); scheduleAlarm(5); askNotif();
      pushScheduleRest(5);
      setTimeout(()=>{ buzz(); notify("Prueba de aviso","Así suena el fin del descanso"); }, 5000);
      setTimeout(stopKeepAlive, 10000);
      el.textContent = "Bloquea el móvil ya…";
      setTimeout(()=>{ el.textContent = "Probar la alarma en 5 segundos"; }, 7000);
      break;
    }
    case "pushOn": {
      const say = t=>{ const m = $("#pgMsg"); if(m) m.textContent = t; };
      pushEnable($("#pgUrl").value.trim(), $("#pgTok").value.trim(), say);
      break;
    }
    case "pushOff":
      S.push.on = false;
      save(); closeSheet(); render(); break;

    /* hábitos */
    case "toggleHabito":
    case "toggleHabit": {
      const h = S.habits.filter(x=>x.id===id)[0]; if(!h) break;
      if(h.days[today()]) delete h.days[today()]; else h.days[today()] = 1;
      save(); render(); break;
    }
    case "habitDetail": sheetHabito(id); break;
    case "editHabito": sheetEditarHabito(id); break;
    case "hModo":
      leerHabitoDOM();
      hDraft.modo = el.dataset.m;
      openSheet(hDraft.id?"Editar habito":"Nuevo habito",
        campposHabito(hDraft) + '<button class="btn wide" data-act="saveHabit">'+(hDraft.id?"Guardar":"Crear habito")+'</button>');
      break;
    case "caida": {
      const h = S.habits.filter(x=>x.id===id)[0]; if(!h) break;
      if(h.days[today()]){ delete h.days[today()]; save(); render(); break; }
      const tenia = streak(h);
      h.days[today()] = 1; save(); render();
      toast(tenia > 1 ? "Apuntado. Eran "+tenia+" días; mañana vuelves a empezar." : "Apuntado. Mañana vuelves a empezar.");
      break;
    }
    case "caidaFecha": {
      const h = S.habits.filter(x=>x.id===id)[0]; if(!h) break;
      const k = $("#cdF").value;
      if(!k || k > today()){ toast("Elige un día que ya haya pasado."); break; }
      if(h.desde && k < h.desde) h.desde = k;
      h.days[k] = 1; save(); render(); sheetHabito(h.id); break;
    }
    case "caidaDel": {
      const h = S.habits.filter(x=>x.id===id)[0]; if(!h) break;
      delete h.days[el.dataset.d]; save(); render(); sheetHabito(h.id); break;
    }
    case "hTipo":
      leerHabitoDOM();
      hDraft.tipo = el.dataset.t;
      openSheet(hDraft.id?"Editar habito":"Nuevo habito",
        campposHabito(hDraft) + '<button class="btn wide" data-act="saveHabit">'+(hDraft.id?"Guardar":"Crear habito")+'</button>');
      break;
    case "cantHabito": sheetCantidad(id); break;
    case "saveCantidad": {
      const h = S.habits.filter(x=>x.id===id)[0]; if(!h) break;
      const v = parseFloat(($("#hVal").value||"0").replace(",","."))||0;
      if(v>0) h.days[today()] = v; else delete h.days[today()];
      save(); closeSheet(); render(); break;
    }
    case "saveHabit": saveHabit(); break;
    case "delHabit":
      S.habits = S.habits.filter(x=>x.id!==id);
      save(); closeSheet(); render(); break;

    /* listas */
    case "setList": S.list = el.dataset.list; save(); render(); break;
    case "toggleTask": {
      const t = S.tasks.filter(x=>x.id===id)[0]; if(t) t.done = !t.done;
      save(); render(); break;
    }
    case "delTask": S.tasks = S.tasks.filter(x=>x.id!==id); save(); render(); break;
    case "taskOpen": sheetTarea(id); break;
    case "taskNewPrio": {
      taskPrio = +el.dataset.p;
      const inp = $("#taskInput"), txt = inp ? inp.value : "";
      render();
      const n = $("#taskInput"); if(n){ n.value = txt; }
      break;
    }
    case "taskPrio": {
      const t = S.tasks.filter(x=>x.id===id)[0]; if(!t) break;
      leerTareaDOM(t);
      t.prio = +el.dataset.p; save(); render(); sheetTarea(id); break;
    }
    case "subAdd": {
      const t = S.tasks.filter(x=>x.id===id)[0]; if(t) anadirPaso(t);
      break;
    }
    case "subToggle": {
      const t = S.tasks.filter(x=>x.id===id)[0]; if(!t) break;
      leerTareaDOM(t);
      const x = (t.subs||[]).filter(v=>v.id===el.dataset.s)[0]; if(!x) break;
      x.done = !x.done;
      const todos = t.subs.every(v=>v.done);
      if(todos && !t.done){ t.done = true; toast("Todos los pasos hechos: tarea completada."); }
      else if(!todos && t.done){ t.done = false; }
      save(); render(); sheetTarea(id); break;
    }
    case "subDel": {
      const t = S.tasks.filter(x=>x.id===id)[0]; if(!t) break;
      leerTareaDOM(t);
      t.subs = (t.subs||[]).filter(v=>v.id!==el.dataset.s);
      save(); render(); sheetTarea(id); break;
    }
    case "delTaskSheet":
      S.tasks = S.tasks.filter(x=>x.id!==id); save(); closeSheet(); render(); break;
    case "clearDone": S.tasks = S.tasks.filter(t=>!(t.done && t.list==="tareas")); save(); render(); break;

    /* ─── inventario y compra ─── */
    case "acabado": {
      const x = S.inv.filter(v=>v.id===id)[0]; if(!x) break;
      x.falta = true; save(); render();
      toast(x.name + ": a la lista de la compra.");
      break;
    }
    case "reponer": {
      const x = S.inv.filter(v=>v.id===id)[0]; if(!x) break;
      x.falta = false; save(); render(); break;
    }
    case "comprado": {
      const x = S.inv.filter(v=>v.id===id)[0]; if(!x) break;
      x.falta = false; save(); render();
      toast(x.name + ": de vuelta en casa.");
      break;
    }
    case "compraToda":
      S.inv.forEach(function(x){ x.falta = false; });
      save(); render(); toast("Compra hecha.");
      break;
    case "delInv":
      S.inv = S.inv.filter(v=>v.id!==id); save(); render(); break;

    /* gastos */
    case "pickCat":
      Array.prototype.forEach.call($("#eCats").children, c=>c.setAttribute("aria-pressed","false"));
      el.setAttribute("aria-pressed","true"); break;
    case "saveExp": saveExp(); break;
    case "delExp": S.expenses = S.expenses.filter(x=>x.id!==id); save(); render(); break;
    case "delIng": S.incomes = S.incomes.filter(x=>x.id!==id); save(); render(); break;
    case "movTipo": {
      const importe = $("#eAmt") ? $("#eAmt").value : "";
      movTipo = el.dataset.t;
      sheetGasto();
      if(importe) $("#eAmt").value = importe;
      break;
    }
    case "presupuesto": sheetPresupuesto(); break;
    case "savePresu": {
      S.budget.total = parseFloat(($("#bpT").value||"0").replace(",","."))||0;
      const cats = {};
      CATS.forEach(function(c,i){
        const el2 = $("#bpC"+i);
        const v = el2 ? (parseFloat((el2.value||"0").replace(",","."))||0) : 0;
        if(v > 0) cats[c] = v;
      });
      S.budget.cats = cats;
      save(); closeSheet(); render(); break;
    }
    case "fijos": sheetFijos(); break;
    case "saveFijo": {
      const a = parseFloat(($("#fA").value||"0").replace(",","."))||0;
      if(a <= 0){ $("#fA").focus(); break; }
      S.fixed.push({
        id:uid(), amount:a, cat:$("#fC").value, tipo:$("#fT").value,
        note:$("#fN").value.trim(),
        dia:Math.min(28, Math.max(1, parseInt($("#fD").value,10)||1))
      });
      aplicarFijos();
      save(); render(); sheetFijos(); break;
    }
    case "delFijo":
      /* Se quita el fijo, pero los gastos que ya genero se quedan: son gasto
         real que ocurrio. */
      S.fixed = S.fixed.filter(x=>x.id!==id);
      save(); render(); sheetFijos(); break;

    /* notas */
    case "openNote": sheetNota(id); break;
    case "notaTag": notaTag = el.dataset.t; render(); break;
    case "saveNote": saveNote(id); break;
    case "pinNote": {
      const n = S.notes.filter(x=>x.id===id)[0];
      if(n){ n.text = $("#nText").value.trim() || n.text; n.pinned = !n.pinned; }
      save(); closeSheet(); render(); break;
    }
    case "delNote": S.notes = S.notes.filter(x=>x.id!==id); save(); closeSheet(); render(); break;

    /* ─── cultura ─── */
    case "culTab": S.culTab = el.dataset.c; save(); render(); break;
    case "culOpen": sheetCulItem(id); break;
    case "culSave": {
      const t = $("#cuT").value.trim();
      if(!t){ $("#cuT").focus(); break; }
      const pg = $("#cuP");
      S.cultura.unshift({
        id:uid(), cat:S.culTab, title:t,
        by:$("#cuB").value.trim(),
        started: el.dataset.ya ? today() : null,
        done:null, score:null,
        page:0, pages: pg ? (parseInt(pg.value,10)||0) : 0
      });
      save(); closeSheet(); render();
      if(!el.dataset.ya) toast("Guardado en pendientes.");
      break;
    }
    case "culEmpezar": {
      const it = S.cultura.filter(x=>x.id===id)[0]; if(!it) break;
      it.started = today();
      save(); closeSheet(); render();
      toast(it.title + ": en curso.");
      break;
    }
    case "culEpiSave": {
      const it = S.cultura.filter(x=>x.id===id)[0]; if(!it) break;
      it.temporada = Math.max(0, parseInt($("#cuT2").value,10)||0);
      it.episodio  = Math.max(0, parseInt($("#cuE2").value,10)||0);
      save(); closeSheet(); render();
      toast(culEpi(it) ? ("Vas por " + culEpi(it) + ".") : "Guardado.");
      break;
    }
    case "culScore": {
      /* La nota se elige aquí y se guarda al momento: así vale tanto para
         puntuar al terminar como para cambiar la nota de algo ya terminado. */
      const it = S.cultura.filter(x=>x.id===$("#cuNota").dataset.id)[0];
      const n = +el.dataset.n;
      Array.prototype.forEach.call($("#cuNota").children, c=>c.setAttribute("aria-pressed","false"));
      el.setAttribute("aria-pressed","true");
      if(it){ it.score = n; save(); }
      break;
    }
    case "culPage": {
      const it = S.cultura.filter(x=>x.id===id)[0]; if(!it) break;
      it.page  = Math.max(0, parseInt($("#cuPg").value,10)||0);
      it.pages = Math.max(0, parseInt($("#cuPt").value,10)||0);
      if(it.pages && it.page>it.pages) it.page = it.pages;
      /* Registro de paginas: es lo que permite saber tu ritmo de ahora. */
      it.pageLog = (it.pageLog||[]).filter(function(x){ return x.date !== today(); });
      it.pageLog.push({date:today(), page:it.page});
      save(); closeSheet(); render();
      toast("Punto de libro en la página "+it.page+(it.pages?" · "+culPct(it)+"% leído":""));
      break;
    }
    case "culFinish": {
      const it = S.cultura.filter(x=>x.id===id)[0]; if(!it) break;
      it.done = today();
      if(it.pages>0) it.page = it.pages;
      save(); closeSheet(); render();
      toast(esc(it.title)+": terminado"+(it.score?" · "+it.score+"/10":". Puedes ponerle nota cuando quieras."));
      break;
    }
    case "culReopen": {
      const it = S.cultura.filter(x=>x.id===id)[0]; if(!it) break;
      it.done = null;
      save(); closeSheet(); render(); break;
    }
    case "citaAdd": {
      const it = S.cultura.filter(x=>x.id===id)[0]; if(!it) break;
      const t = $("#citaTxt").value.trim();
      if(!t){ $("#citaTxt").focus(); break; }
      const pg = $("#citaPag");
      it.citas = it.citas || [];
      it.citas.push({id:uid(), texto:t, pag: pg ? (parseInt(pg.value,10)||0) : 0, ts:Date.now()});
      save(); sheetCulItem(id); break;
    }
    case "citaDel": {
      const it = S.cultura.filter(x=>x.id===id)[0]; if(!it) break;
      it.citas = (it.citas||[]).filter(function(q){ return q.id !== el.dataset.q; });
      save(); sheetCulItem(id); break;
    }
    case "culDel":
      S.cultura = S.cultura.filter(x=>x.id!==id);
      save(); closeSheet(); render(); break;

    /* gym · navegación */
    case "gymTab": S.gymTab = el.dataset.gt; save(); render(); break;
    case "descargaIni":
      S.gym.deloadDesde = today(); save(); render();
      toast("Semana de descarga: los pesos bajan al "+Math.round(DESCARGA_FACTOR*100)+" %.");
      break;
    case "descargaFin":
      S.gym.deloadUltima = S.gym.deloadDesde || today();
      S.gym.deloadDesde = ""; save(); render();
      toast("Descarga terminada. Pesos normales.");
      break;

    /* gym · sesión */
    case "startSess": sheetStart(); break;
    case "pickName": $("#sName").value = el.dataset.name; break;
    case "doStart": {
      const nm = ($("#sName").value.trim()) || "Entrenamiento";
      S.gym.active = {id:uid(),name:nm,routine:null,date:today(),start:Date.now(),notes:"",entries:[]};
      save(); closeSheet(); render();
      setTimeout(()=>sheetAddEx("session"),150); break;
    }
    case "startRoutine": {
      const r = S.gym.routines.filter(x=>x.id===id)[0]; if(!r) break;
      S.gym.active = {
        id:uid(), name:r.name, routine:r.name, routineId:r.id, date:today(), start:Date.now(), notes:"",
        entries:r.exercises.map(e=>({ex:e.name, eq:e.eq||"", sets:planSets(e), target:routineTarget(e)}))
      };
      S.gymTab = "sesion"; save(); render(); break;
    }
    case "addEx": sheetAddEx("session"); break;
    case "pickEx": addExercise(el.dataset.ex); break;
    case "newEx": {
      const v = $("#exSearch").value.trim();
      if(v) addExercise(v); break;
    }
    /* ─── tabla de series ─── */
    case "stAdd": {
      const i = +el.dataset.i;
      leerFilas(i);
      const en = S.gym.active.entries[i];
      const last = hechas(en).filter(s=>!isWarm(s)).slice(-1)[0] || en.sets.filter(s=>!isWarm(s)).slice(-1)[0] || {};
      en.sets.push({
        todo:true,
        warmup:false,
        kg: last.kg || 0,
        tReps: last.tReps || "",
        tRest: last.tRest || (en.target ? en.target.rest : S.gym.restDefault)
      });
      save(); render(); break;
    }
    case "stTipo": {
      const i = +el.dataset.i, j = +el.dataset.j;
      const en = S.gym.active.entries[i], s = en.sets[j];
      leerFilas(i);
      s.warmup = !s.warmup;
      /* Al cambiar de tipo, el descanso pasa a ser el que toca. */
      if(en.target) s.tRest = s.warmup ? en.target.restWarm : en.target.rest;
      save(); render(); break;
    }
    case "stDel": {
      const i = +el.dataset.i, j = +el.dataset.j;
      leerFilas(i);
      S.gym.active.entries[i].sets.splice(j,1);
      save(); render(); break;
    }
    case "stMark": {
      const i = +el.dataset.i, j = +el.dataset.j;
      const en = S.gym.active.entries[i], s = en.sets[j];
      if(!isTodo(s)){                       /* deshacer una serie ya marcada */
        revertirSobrecarga(S.gym.active, en, j);
        s.todo = true; save(); stopRest(); break;
      }
      const kIn = $("#stK"+i+"_"+j), rIn = $("#stR"+i+"_"+j);
      const kg = parseFloat(((kIn?kIn.value:"")||"0").replace(",","."))||0;
      const reps = parseInt(rIn?rIn.value:"",10)||0;
      if(reps<=0){ if(rIn) rIn.focus(); break; }
      s.kg = kg; s.reps = reps; delete s.todo;
      aplicarSobrecarga(S.gym.active, en, s, j);
      save();
      const secs = Number(s.tRest) || (en.target ? (s.warmup?en.target.restWarm:en.target.rest) : S.gym.restDefault);
      /* Arrancar el descanso ANTES de dibujar, o la barra no llega a pintarse. */
      if(secs>0) startRest(secs, en.ex);
      render();
      break;
    }
    case "stopRest": stopRest(); break;
    case "finishSheet": leerFilas(); save(); sheetFinish(); break;
    case "endSess": {
      const s = S.gym.active; if(!s) break;
      const n = $("#sNotes"); if(n) s.notes = n.value.trim();
      s.end = Date.now();
      /* Las series que quedaron sin hacer no se guardan en el historial. */
      s.entries.forEach(en=>{ en.sets = hechas(en); });
      s.entries = s.entries.filter(en=>en.sets.length);
      if(s.entries.length) S.gym.sessions.push(s);
      S.gym.active = null; stopRest();
      save(); closeSheet(); render(); break;
    }
    case "dropSess":
      if(el.dataset.sure){ S.gym.active = null; stopRest(); save(); closeSheet(); render(); }
      else { el.dataset.sure = "1"; el.textContent = "Toca otra vez para descartar"; }
      break;
    case "sessDetail": sheetSessDetail(id); break;
    case "exHist": sheetHistEjercicio(el.dataset.ex); break;
    case "delSess":
      S.gym.sessions = S.gym.sessions.filter(x=>x.id!==id);
      save(); closeSheet(); render(); break;

    /* gym · rutinas */
    case "newRoutine": openRoutine(null); break;
    case "editRoutine": openRoutine(id); break;
    case "rtDia":
      el.setAttribute("aria-pressed", el.getAttribute("aria-pressed")!=="true"); break;
    case "rtAddEx": readRoutineDOM(); sheetAddEx("routine"); break;
    case "rtEditEx": readRoutineDOM(); sheetAddEx("routine", +el.dataset.i); break;
    case "rtDelEx":
      readRoutineDOM();
      rtDraft.exercises.splice(+el.dataset.i,1);
      renderRoutineSheet(); break;
    case "rtAddSet": {
      readRoutineDOM();
      const e = rtDraft.exercises[+el.dataset.i];
      const last = (e.sets||[]).filter(s=>!s.warmup).slice(-1)[0];
      e.sets = e.sets || [];
      e.sets.push(last ? {reps:last.reps, kg:last.kg} : {reps:"8-10", kg:0});
      renderRoutineSheet(); break;
    }
    case "rtDelSet": {
      readRoutineDOM();
      rtDraft.exercises[+el.dataset.i].sets.splice(+el.dataset.j,1);
      renderRoutineSheet(); break;
    }
    case "rtWarm": {
      readRoutineDOM();
      const s = rtDraft.exercises[+el.dataset.i].sets[+el.dataset.j];
      s.warmup = !s.warmup;
      renderRoutineSheet(); break;
    }
    case "rtSave": {
      readRoutineDOM();
      const nm = (rtDraft.name||"").trim();
      if(!nm){ $("#rtName").focus(); break; }
      rtDraft.exercises = rtDraft.exercises.filter(e=>(e.sets||[]).length);
      if(!rtDraft.exercises.length){ sheetAddEx("routine"); break; }
      if(rtDraft.id){
        const r = S.gym.routines.filter(x=>x.id===rtDraft.id)[0];
        if(r){ r.name = nm; r.dias = rtDraft.dias || []; r.exercises = rtDraft.exercises; }
      }else{
        S.gym.routines.push({id:uid(),name:nm,dias:rtDraft.dias||[],exercises:rtDraft.exercises});
      }
      rtDraft = null; save(); closeSheet(); render(); break;
    }
    case "rtDel":
      S.gym.routines = S.gym.routines.filter(x=>x.id!==id);
      rtDraft = null; save(); closeSheet(); render(); break;

    /* gym · objetivos, peso, perfil */
    case "newGoal": sheetGoal(); break;
    case "saveGoal": {
      const kg = parseFloat(($("#gKg").value||"0").replace(",","."))||0;
      S.gym.goals.push({id:uid(),exercise:$("#gEx").value,targetWeight:kg,note:$("#gNote").value.trim()});
      save(); closeSheet(); render(); break;
    }
    case "delGoal":
      S.gym.goals = S.gym.goals.filter(x=>x.id!==id);
      save(); render(); sheetGoal(); break;
    case "addWeight": sheetWeight(); break;
    case "medidas": sheetMedidas(); break;
    case "saveMedidas": {
      const reg = {date: $("#mdF").value || today()};
      let alguna = false;
      MEDIDAS.forEach(function(md){
        const v = parseFloat(($("#md_"+md.k).value||"").replace(",","."));
        if(v > 0){ reg[md.k] = v; alguna = true; }
      });
      if(!alguna){ toast("Apunta al menos una medida."); break; }
      S.gym.medidas = S.gym.medidas.filter(function(x){ return x.date !== reg.date; });
      S.gym.medidas.push(reg);
      save(); closeSheet(); render(); break;
    }
    case "delMedida":
      S.gym.medidas = S.gym.medidas.filter(function(x){ return x.date !== el.dataset.d; });
      save(); render(); sheetMedidas(); break;
    case "saveWeight": {
      const kg = parseFloat(($("#wKg").value||"0").replace(",","."))||0;
      if(kg<=0){ $("#wKg").focus(); break; }
      const d = $("#wDate").value||today();
      S.gym.weights = S.gym.weights.filter(x=>x.date!==d);
      S.gym.weights.push({date:d,kg:kg});
      save(); closeSheet(); render(); break;
    }
    case "delWeight":
      S.gym.weights = S.gym.weights.filter(x=>x.date!==el.dataset.d);
      save(); render(); sheetWeight(); break;
    case "editProfile": sheetProfile(); break;
    case "saveProfile": {
      S.gym.profile.heightCm = parseFloat(($("#pH").value||"0").replace(",","."))||null;
      S.gym.profile.age = parseInt($("#pA").value,10)||null;
      S.gym.restDefault = parseInt($("#pR").value,10)||90;
      S.gym.stepKg = parseFloat(($("#pS").value||"2.5").replace(",","."))||2.5;
      S.gym.deloadCada = Math.max(1, parseInt($("#pDl").value,10)||5);
      save(); closeSheet(); render(); break;
    }

    /* ajustes */
    case "setTheme":
      S.theme = el.dataset.theme; save(); applyTheme();
      Array.prototype.forEach.call(el.parentNode.children, c=>c.setAttribute("aria-pressed", c===el));
      break;
    case "copyData": {
      const ta = $("#bkData"); ta.select();
      const done = ()=>{ $("#bkMsg").textContent = "Copiado. Guárdalo en tus notas o en un correo."; };
      if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done,()=>{ try{document.execCommand("copy");done();}catch(err){ $("#bkMsg").textContent="Selecciona el texto y cópialo a mano."; } });
      else { try{document.execCommand("copy");done();}catch(err){} }
      break;
    }
    case "dlData": {
      /* Aquí sí se puede descargar: la app vive en su propio dominio, no dentro
         del visor de artifacts, que bloquea las descargas. */
      try{
        const blob = new Blob([JSON.stringify(estadoSinSecretos())], {type:"application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "bitacora-" + today() + ".json";
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        $("#bkMsg").textContent = "Guardado como bitacora-" + today() + ".json";
      }catch(err){
        $("#bkMsg").textContent = "No he podido descargarlo. Usa copiar y pegar.";
      }
      break;
    }
    case "upData": {
      const f = $("#bkFile");
      f.onchange = function(){
        const file = f.files && f.files[0];
        if(!file) return;
        const lector = new FileReader();
        lector.onload = function(){
          try{
            const n = JSON.parse(lector.result);
            if(!n || !n.habits) throw new Error("bad");
            S = conservarLocal(n); save(); closeSheet(); render();
            toast("Datos restaurados desde " + file.name);
          }catch(err){
            $("#bkMsg").textContent = "Ese archivo no es una copia de Bitácora.";
          }
        };
        lector.onerror = function(){ $("#bkMsg").textContent = "No he podido leer el archivo."; };
        lector.readAsText(file);
      };
      f.click();
      break;
    }
    case "restoreData": {
      try{
        const n = JSON.parse($("#bkData").value);
        if(!n || !n.habits) throw new Error("bad");
        S = conservarLocal(n); save(); closeSheet(); render();
      }catch(err){ $("#bkMsg").textContent = "Ese texto no es una copia válida. Pega el bloque completo."; }
      break;
    }
    case "clearDemo":
      S.demo = false;
      wipeContent();
      save(); closeSheet(); render(); break;
    case "wipe":
      if(el.dataset.sure){
        localStorage.removeItem(LS);
        S = seed(); S.demo = false; wipeContent();
        save(); closeSheet(); render();
      }else{ el.dataset.sure = "1"; el.textContent = "Toca otra vez para confirmar"; }
      break;
  }
});

/* ══════════ icono + meta para iOS ══════════ */
function iconDataURI(){
  try{
    const c = document.createElement("canvas"); c.width = c.height = 180;
    const x = c.getContext("2d");
    x.fillStyle = "#15181F"; x.fillRect(0,0,180,180);
    x.fillStyle = "#2F9E76";
    x.beginPath(); x.arc(90,90,52,0,Math.PI*2); x.fill();
    x.strokeStyle = "#15181F"; x.lineWidth = 13; x.lineCap = x.lineJoin = "round";
    x.beginPath(); x.moveTo(68,91); x.lineTo(84,107); x.lineTo(114,74); x.stroke();
    return c.toDataURL("image/png");
  }catch(e){ return ""; }
}
(function metaIOS(){
  const add = (tag,attrs)=>{ const e = document.createElement(tag);
    Object.keys(attrs).forEach(k=>e.setAttribute(k,attrs[k])); document.head.appendChild(e); };
  add("meta",{name:"viewport",content:"width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"});
  add("meta",{name:"apple-mobile-web-app-capable",content:"yes"});
  add("meta",{name:"mobile-web-app-capable",content:"yes"});
  add("meta",{name:"apple-mobile-web-app-status-bar-style",content:"default"});
  add("meta",{name:"apple-mobile-web-app-title",content:"Bitácora"});
  add("meta",{name:"theme-color",content:"#15181F"});
  /* Icono: si la app está hospedada con sus propios archivos usamos el PNG real,
     que iOS respeta mejor para la pantalla de inicio. Si no existe (por ejemplo
     abierta como artifact), lo dibujamos al vuelo en un canvas. */
  fetch("assets/icon-180.png",{method:"HEAD"})
    .then(r=>{
      if(!r.ok) throw new Error("sin icono");
      add("link",{rel:"apple-touch-icon",sizes:"180x180",href:"assets/icon-180.png"});
      add("link",{rel:"icon",href:"assets/icon-192.png"});
    })
    .catch(()=>{
      const href = iconDataURI();
      if(href){ add("link",{rel:"apple-touch-icon",href:href}); add("link",{rel:"icon",href:href}); }
    });

  /* Si la app está hospedada con sus propios archivos (manifest + service worker),
     los usamos: eso da instalación completa y funcionamiento sin internet.
     Si no existen (por ejemplo publicada como artifact), no pasa nada. */
  try{
    fetch("manifest.webmanifest",{method:"HEAD"})
      .then(r=>{ if(r.ok) add("link",{rel:"manifest",href:"manifest.webmanifest"}); })
      .catch(()=>{});
    if("serviceWorker" in navigator && location.protocol!=="file:"){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        swReg = reg;
        buscarActualizacion(true);   /* al abrir, en silencio */
      }).catch(()=>{});

      /* Cuando el service worker nuevo toma el control, la pagina que ves sigue
         siendo la vieja: hay que recargarla. */
      let recargando = false;
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if(recargando) return;
        recargando = true;
        aplicarActualizacion();
      });
    }
  }catch(e){}
})();

/* Lo tecleado en una casilla se guarda al salir de ella, para que no se pierda
   al pulsar cualquier boton que redibuje la pantalla. */
view.addEventListener("change", function(e){
  if(e.target.id === "diaLinea"){
    const v = (e.target.value||"").trim();
    const d = S.diario[today()] = S.diario[today()] || {};
    if(v) d.linea = v; else delete d.linea;
    save();
    return;
  }
  if(e.target.id === "diaSueno"){
    const v = parseFloat((e.target.value||"").replace(",","."));
    const d = S.diario[today()] = S.diario[today()] || {};
    if(v > 0 && v < 24) d.sueno = v; else delete d.sueno;
    save();
    return;
  }
  const m = e.target.id && e.target.id.match(/^st[KR](\d+)_\d+$/);
  if(!m) return;
  leerFilas(+m[1]);
  save();
});

/* ══════════ actualizaciones ══════════
   Una PWA instalada en iOS no tiene boton de recargar ni "deslizar para
   actualizar": si no se hace esto a mano, se queda clavada en la version con la
   que la instalaste. Al abrirla y cada vez que vuelve a primer plano, se
   compara la version que corre con la publicada. */
let swReg = null, hayNueva = false;

function aplicarActualizacion(){
  if(!sheetWrap.hidden){ hayNueva = true; return; }   /* no cortar lo que este haciendo */
  location.reload();
}
function buscarActualizacion(silencioso){
  if(swReg){ try{ swReg.update(); }catch(e){} }
  return fetch("version.json?t="+Date.now(), {cache:"no-store"})
    .then(r=>r.ok ? r.json() : null)
    .then(j=>{
      if(!j) return null;
      if(j.build !== BUILD){
        toast("Hay una versi\u00f3n nueva. Actualizando\u2026");
        setTimeout(aplicarActualizacion, 1200);
        return "nueva";
      }
      if(!silencioso) toast("Ya tienes la \u00faltima versi\u00f3n (" + BUILD + ").");
      return "al dia";
    })
    .catch(()=>null);
}
document.addEventListener("visibilitychange", function(){
  if(!document.hidden){
    buscarActualizacion(true);
    syncAhora(true);            /* al volver, recoge lo del otro dispositivo */
    repasarAvisos();
    repasarFechas();
    programarAvisos();
    if(focoRevisar()) render();
    focoTic();
  }else{
    clearTimeout(syncT);
    syncSubir(true);            /* al irte, deja subido lo de aqu\u00ed */
  }
});

/* arranque */
focoRevisar();
render();
if(!S.xpNivel) { S.xpNivel = nivelDe(xpDetalle().total); persist(); }
focoTic();
repasarAvisos();
setTimeout(repasarFechas, 2600);   /* despues del aviso de recordatorios, sin pisarlo */
programarAvisos();
syncAhora(true);
})();
</script>
