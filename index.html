function restBar(){
  if(!rest) return "";
  const left = Math.max(0, rest.until-Date.now());
  return '<button class="rest" data-act="stopRest">'+
    '<span class="rest-top"><span class="rv" id="restVal">'+fmtClock(left)+'</span>'+
    '<span class="rl">descansando'+(rest.ex?" · "+esc(rest.ex):"")+'<br>toca para saltarlo</span></span>'+
    '<span class="bar"><i id="restBar" style="width:'+(left/(rest.total*1000)*100)+'%"></i></span>'+
  '</button>';
}
function tickRest(){
  if(!rest) return;
  const left = Math.max(0, rest.until-Date.now());
  const v = $("#restVal"), b = $("#restBar");
  if(v) v.textContent = fmtClock(left);
  if(b) b.style.width = (left/(rest.total*1000)*100)+"%";
  if(left<=0){
    const ex = rest.ex;
    rest = null; clearInterval(restInt); restInt = null;
    if(!relojTemp("gym")){
      buzz();
      notify("Descanso terminado", ex ? "Siguiente serie de "+ex : "A por la siguiente serie");
    }
    setTimeout(stopKeepAlive, 4000);
    render();
  }
}
function startRest(secs, exName){
  secs = Number(secs)||0;
  if(secs<=0) return;
  /* Con el Reloj del iPhone activado para el gimnasio, suena el del sistema y
     no el nuestro: dos alarmas a la vez solo molestan. */
  const nativo = relojTemp("gym");
  unlockAudio();
  if(!nativo){
    startKeepAlive();
    scheduleAlarm(secs);      /* suena aunque iOS congele el JavaScript */
  }
  askNotif();
  pushScheduleRest(secs);     /* aviso en pantalla si hay servidor configurado */
  rest = {until:Date.now()+secs*1000, total:secs, ex:exName||""};
  clearInterval(restInt);
  restInt = setInterval(tickRest, 250);
  if(nativo) lanzarAtajo(S.reloj.atajoTemp, String(secs));
}
function stopRest(){
  rest = null;
  clearInterval(restInt); restInt = null;
  clearAlarm(); stopKeepAlive(); pushCancelRest();
  render();
}

/* ══════════ experiencia y niveles ══════════
   La XP no se guarda: se calcula entera desde tus datos cada vez. Asi no se
   descuadra nunca, y lo que ya habias hecho antes de esta funcion cuenta desde
   el primer dia. */
const XP = {habito:10, entreno:50, cardio:30, bloque:20, terminado:40, diario:5, tarea:5};

function xpDetalle(desde, hasta){
  const dentro = function(k){ return (!desde || k >= desde) && (!hasta || k <= hasta); };
  let habitos = 0;
  S.habits.forEach(function(h){
    if(h.modo === "dejar"){
      if(!h.desde) return;
      const d = parseKey(h.desde), fin = today();
      for(let k = h.desde, i = 0; k <= fin && i < 4000; i++){
        if(dentro(k) && cumplido(h,k)) habitos++;
        d.setDate(d.getDate()+1); k = key(d);
      }
      return;
    }
    Object.keys(h.days).forEach(function(k){ if(dentro(k) && cumplido(h,k)) habitos++; });
  });
  const entrenos = S.gym.sessions.filter(function(x){ return dentro(x.date); }).length;
  const cardios = (S.gym.cardio||[]).filter(function(x){ return dentro(x.date); }).length;
  const hist = (S.foco && S.foco.hist) || {};
  let bloques = 0;
  Object.keys(hist).forEach(function(k){ if(dentro(k)) bloques += hist[k].bloques || 0; });
  const terminados = S.cultura.filter(function(x){ return x.done && dentro(x.done); }).length;
  const diarios = Object.keys(S.diario||{}).filter(function(k){
    const e = S.diario[k]; return dentro(k) && e && (e.animo || e.energia || e.sueno || e.linea);
  }).length;
  const tareas = desde || hasta ? 0 : S.tasks.filter(function(t){ return t.done; }).length;
  return {
    habitos:habitos, entrenos:entrenos, cardios:cardios, bloques:bloques,
    terminados:terminados, diarios:diarios, tareas:tareas,
    total: habitos*XP.habito + entrenos*XP.entreno + cardios*XP.cardio + bloques*XP.bloque +
           terminados*XP.terminado + diarios*XP.diario + tareas*XP.tarea
  };
}
/* Cada nivel cuesta un poco mas que el anterior: 50, 200, 450, 800... */
const xpParaNivel = n => 50 * (n-1) * (n-1);
function nivelDe(xp){
  let n = 1;
  while(xpParaNivel(n+1) <= xp) n++;
  return n;
}
const TITULOS = ["Novato","Aprendiz","Constante","Disciplinado","Metódico","Veterano","Imparable","Maestro","Leyenda"];
const tituloNivel = n => TITULOS[Math.min(TITULOS.length-1, Math.floor((n-1)/3))];

/* Si has subido de nivel desde la ultima vez, se celebra una sola vez. */
function revisarNivel(){
  const n = nivelDe(xpDetalle().total);
  if(S.xpNivel && n > S.xpNivel){
    toast("¡Nivel " + n + "! " + tituloNivel(n) + ".");
    buzz();
  }
  if(n !== S.xpNivel){ S.xpNivel = n; persist(); }
}

/* ══════════ cardio ══════════
   Aparte de la fuerza: no tiene series ni pesos, tiene distancia y tiempo. El
   ritmo se da en la unidad en que se piensa cada deporte. */
const CARDIO = [
  {id:"carrera",  n:"Carrera",  r:"km"},
  {id:"andar",    n:"Andar",    r:"km"},
  {id:"bici",     n:"Bici",     r:"kmh"},
  {id:"eliptica", n:"Elíptica", r:"kmh"},
  {id:"remo",     n:"Remo",     r:"500"},
  {id:"natacion", n:"Natación", r:"100"},
  {id:"otro",     n:"Otro",     r:"kmh"}
];
const cardioTipo = id => CARDIO.filter(function(c){ return c.id === id; })[0] || CARDIO[CARDIO.length-1];
const mmss = sg => { sg = Math.round(sg); return Math.floor(sg/60) + ":" + pad(sg%60); };
/* "45" son minutos; "45:30", minutos y segundos; "1:05:30", horas. */
function parseDur(t){
  const p = String(t||"").trim().replace(",", ".").split(":").map(function(x){ return parseFloat(x); });
  if(p.some(isNaN) || !p.length) return 0;
  if(p.length === 1) return Math.round(p[0]*60);
  if(p.length === 2) return Math.round(p[0]*60 + p[1]);
  return Math.round(p[0]*3600 + p[1]*60 + p[2]);
}
function durCardio(sg){
  if(sg >= 3600) return Math.floor(sg/3600) + " h " + pad(Math.floor(sg%3600/60));
  return (sg % 60) ? mmss(sg) : Math.round(sg/60) + " min";
}
/* Valor comparable del ritmo: segundos por unidad (menos es mejor) o km/h (mas es mejor). */
function ritmoNum(c){
  if(!(c.km > 0) || !(c.seg > 0)) return 0;
  const t = cardioTipo(c.tipo);
  if(t.r === "kmh") return c.km / (c.seg/3600);
  const por = t.r === "km" ? 1 : t.r === "500" ? 0.5 : 0.1;
  return c.seg / (c.km/por);
}
function ritmoCardioTxt(c){
  const v = ritmoNum(c); if(!v) return "";
  const t = cardioTipo(c.tipo);
  if(t.r === "kmh") return fmtKg(Math.round(v*10)/10) + " km/h";
  return mmss(v) + (t.r === "km" ? " /km" : t.r === "500" ? " /500 m" : " /100 m");
}
function mejorRitmo(a, b, tipo){
  if(!a) return b; if(!b) return a;
  const kmh = cardioTipo(tipo).r === "kmh";
  return kmh ? (ritmoNum(b) > ritmoNum(a) ? b : a) : (ritmoNum(b) < ritmoNum(a) ? b : a);
}
function cardioFila(c){
  const t = cardioTipo(c.tipo);
  const rt = ritmoCardioTxt(c);
  return '<button class="row" data-act="cardioVer" data-id="'+c.id+'"><div class="row-main">'+
    '<span class="row-title">'+t.n+(c.km>0?' · '+fmtKg(c.km)+' km':'')+'</span>'+
    '<span class="row-sub mono">'+relDate(c.date)+' · '+durCardio(c.seg)+(rt?' · '+rt:'')+'</span>'+
  '</div><span class="row-val">→</span></button>';
}

/* ══════════ objetivos del ano ══════════
   No se apunta nada dos veces: cada objetivo lee lo que ya registras en su
   modulo. Solo se guarda el tipo, la cifra y el ano. */
const enAno = (k, y) => !!k && k.slice(0,4) === String(y);
const METAS = {
  libros:   {n:"Libros leídos",        get:function(m){ return S.cultura.filter(function(x){ return x.cat==="libros" && enAno(x.done, m.anio); }).length; }},
  pelis:    {n:"Películas vistas",      get:function(m){ return S.cultura.filter(function(x){ return x.cat==="pelis"  && enAno(x.done, m.anio); }).length; }},
  series:   {n:"Series terminadas",      get:function(m){ return S.cultura.filter(function(x){ return x.cat==="series" && enAno(x.done, m.anio); }).length; }},
  juegos:   {n:"Juegos terminados",      get:function(m){ return S.cultura.filter(function(x){ return x.cat==="juegos" && enAno(x.done, m.anio); }).length; }},
  entrenos: {n:"Entrenamientos",         get:function(m){
    return S.gym.sessions.filter(function(x){ return enAno(x.date, m.anio); }).length +
           (S.gym.cardio||[]).filter(function(x){ return enAno(x.date, m.anio); }).length; }},
  cardioKm: {n:"Km de cardio", u:"km",   get:function(m){
    return Math.round((S.gym.cardio||[]).filter(function(x){ return enAno(x.date, m.anio); })
      .reduce(function(t,x){ return t + (Number(x.km)||0); }, 0) * 10) / 10; }},
  foco:     {n:"Horas de foco", u:"h",   get:function(m){
    const H = (S.foco && S.foco.hist) || {};
    let min = 0; Object.keys(H).forEach(function(k){ if(enAno(k, m.anio)) min += H[k].minutos || 0; });
    return Math.round(min/6)/10; }},
  ahorro:   {n:"Ahorro", u:"€", dinero:true, get:function(m){
    const ing = (S.incomes||[]).filter(function(x){ return enAno(x.date, m.anio); }).reduce(function(t,x){ return t+x.amount; }, 0);
    const gas = S.expenses.filter(function(x){ return enAno(x.date, m.anio); }).reduce(function(t,x){ return t+x.amount; }, 0);
    return Math.round(ing - gas); }},
  habito:   {n:"Días de un hábito",     get:function(m){
    const h = S.habits.filter(function(x){ return x.id === m.habito; })[0];
    if(!h) return 0;
    let n = 0;
    const d = new Date(m.anio, 0, 1), fin = today();
    for(let k = key(d); k.slice(0,4) === String(m.anio) && k <= fin; ){
      if(cumplido(h, k)) n++;
      d.setDate(d.getDate()+1); k = key(d);
    }
    return n; }}
};
function metaNombre(m){
  if(m.tipo === "habito"){
    const h = S.habits.filter(function(x){ return x.id === m.habito; })[0];
    return h ? "Días de «" + h.name + "»" : "Hábito borrado";
  }
  return (METAS[m.tipo] || {n:m.tipo}).n;
}
function metaCifra(m, v){
  const def = METAS[m.tipo] || {};
  if(def.dinero) return money0.format(v) + " €";
  return fmtKg(v) + (def.u ? " " + def.u : "");
}
/* Donde deberias ir a estas alturas del ano y a donde llegas si sigues igual. */
function metaEstado(m){
  const def = METAS[m.tipo];
  const v = def ? def.get(m) : 0, obj = Number(m.objetivo) || 0;
  const ahora = new Date(), y = Number(m.anio);
  const ini = new Date(y, 0, 1), fin = new Date(y+1, 0, 1);
  const frac = y < ahora.getFullYear() ? 1 : y > ahora.getFullYear() ? 0 : (ahora - ini) / (fin - ini);
  return {
    v:v, obj:obj, frac:frac,
    pct: obj > 0 ? Math.max(0, Math.min(100, v/obj*100)) : 0,
    esperado: obj * frac,
    proy: frac >= 0.03 ? v / frac : null,
    hecho: obj > 0 && v >= obj,
    cerrado: frac >= 1
  };
}
function metaTexto(m, e){
  if(e.hecho) return e.cerrado ? "conseguido" : "¡conseguido!";
  if(e.cerrado) return "te quedaste en el " + Math.round(e.pct) + " %";
  if(e.proy === null) return "el año acaba de empezar";
  const def = METAS[m.tipo] || {};
  const proy = (def.dinero || !def.u) ? Math.round(e.proy) : Math.round(e.proy*10)/10;   /* los recuentos, enteros */
  const delante = e.v >= e.esperado;
  return (delante ? "vas por delante" : "vas por detrás") + " · a este ritmo, " + metaCifra(m, proy);
}
function metaHtml(m){
  const e = metaEstado(m);
  return '<div class="meta'+(e.hecho?" ok":"")+'">'+
    '<div class="meta-cab"><span class="meta-n">'+esc(metaNombre(m))+'</span>'+
      '<span class="meta-v">'+metaCifra(m, e.v)+' <small>de '+metaCifra(m, e.obj)+'</small></span></div>'+
    '<span class="meta-bar"><i style="width:'+e.pct+'%"></i>'+
      (!e.cerrado && e.frac > 0 && !e.hecho ? '<b style="left:'+Math.min(100, e.frac*100)+'%" title="donde deberías ir"></b>' : '')+
    '</span>'+
    '<span class="meta-t'+(!e.hecho && !e.cerrado && e.proy !== null && e.v < e.esperado ? " detras" : "")+'">'+metaTexto(m, e)+'</span>'+
  '</div>';
}

/* ══════════ fechas importantes ══════════ */
const bisiesto = y => (y%4===0 && y%100!==0) || y%400===0;
function proximaFecha(f){
  const hoy = parseKey(today());
  const mk = function(y){
    let d = Number(f.dia);
    if(Number(f.mes) === 2 && d === 29 && !bisiesto(y)) d = 28;   /* el 29 de febrero, el 28 */
    return new Date(y, Number(f.mes)-1, d);
  };
  let d = mk(hoy.getFullYear());
  if(d < hoy) d = mk(hoy.getFullYear()+1);
  return {d:d, dias:Math.round((d - hoy)/86400000), anos: f.anio ? d.getFullYear() - Number(f.anio) : 0};
}
function fechaCuando(n){
  return n === 0 ? "hoy" : n === 1 ? "mañana" : "en " + n + " días";
}
function fechaDetalle(f, pr){
  if(!pr.anos) return f.tipo === "cumple" ? "cumpleaños" : "";
  return f.tipo === "cumple" ? "cumple " + pr.anos : pr.anos + (pr.anos === 1 ? " año" : " años");
}
const fechasOrden = () => S.fechas.map(function(f){ return {f:f, p:proximaFecha(f)}; })
  .sort(function(a,b){ return a.p.dias - b.p.dias; });
/* Una vez al dia, lo de hoy y lo de manana. */
function repasarFechas(){
  if(S.fechasAviso === today()) return;
  const cerca = fechasOrden().filter(function(x){ return x.p.dias <= 1; });
  S.fechasAviso = today(); persist();
  if(!cerca.length) return;
  toast(cerca.map(function(x){
    return (x.p.dias ? "Mañana" : "Hoy") + ": " + (x.f.tipo === "cumple" ? "cumpleaños de " : "") + x.f.nombre;
  }).join(" · "));
}

/* ══════════ recordatorios ══════════
   Lo honesto primero: con la app cerrada del todo, iOS no deja que una web
   avise. Asi que esto hace dos cosas que si funcionan:
     · mientras la app vive, programa el aviso a su hora;
     · al abrirla, te cuenta los que se te han pasado hoy.
   Para que suene con la app cerrada haria falta push desde un servidor, igual
   que el aviso de fin de descanso. */
const DIAS_CORTOS = ["L","M","X","J","V","S","D"];
const diaSemanaHoy = () => ((new Date().getDay()+6)%7)+1;   /* 1=lunes ... 7=domingo */

function avisoToca(a){
  return a.on && (a.dias||[]).indexOf(diaSemanaHoy()) >= 0;
}
function minutosDe(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm||""));
  if(!m) return -1;
  return (+m[1])*60 + (+m[2]);
}
function ahoraMinutos(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
/* Los que ya tocaban hoy y no se han mostrado. */
function avisosPasados(){
  const ahora = ahoraMinutos();
  return S.avisos.filter(function(a){
    return avisoToca(a) && a.visto !== today() && minutosDe(a.hora) >= 0 && minutosDe(a.hora) <= ahora;
  });
}
let avisoTs = [];
function programarAvisos(){
  avisoTs.forEach(clearTimeout);
  avisoTs = [];
  const ahora = ahoraMinutos();
  S.avisos.forEach(function(a){
    if(!avisoToca(a) || a.visto === today()) return;
    const m = minutosDe(a.hora);
    if(m < 0 || m <= ahora) return;
    const ms = (m - ahora) * 60000;
    if(ms > 6*3600*1000) return;              /* mas de 6 h: no merece la pena */
    avisoTs.push(setTimeout(function(){
      a.visto = today(); persist();
      buzz(); notify("Bitácora", a.texto);
      toast(a.texto);
    }, ms));
  });
}
/* Al abrir la app, lo que se te haya pasado. */
function repasarAvisos(){
  const p = avisosPasados();
  if(!p.length) return;
  p.forEach(function(a){ a.visto = today(); });
  persist();
  toast(p.length === 1 ? p[0].texto : p.map(function(a){ return a.texto; }).join(" · "));
}

/* ══════════ correlaciones ══════════
   Se cruzan dos grupos de dias y se mira si la diferencia es apreciable. Con
   pocos dias cualquier diferencia es ruido, asi que cada hallazgo exige un
   minimo de dias en cada grupo; si no, se dice que faltan datos en vez de
   inventar una conclusion. Y se habla de "cuando", nunca de "porque". */
const CORR_MIN = 4;       /* dias minimos en cada grupo */
const CORR_VENTANA = 60;  /* se miran los ultimos 60 dias */

function diasVentana(){
  const out = [];
  for(let i=0;i<CORR_VENTANA;i++) out.push(daysAgo(i));
  return out;
}
const media = a => a.length ? a.reduce(function(t,x){ return t+x; },0)/a.length : 0;
const entrenoEl = k => S.gym.sessions.some(function(x){ return x.date === k; }) ||
                       (S.gym.cardio||[]).some(function(x){ return x.date === k; });
function diaSiguiente(k){ const d = parseKey(k); d.setDate(d.getDate()+1); return key(d); }

function correlaciones(){
  const dias = diasVentana();
  const D = S.diario || {};
  const out = [];
  let faltan = 0;

  function comparar(grupoA, grupoB, valor, fmt){
    const a = grupoA.map(valor).filter(function(v){ return v > 0; });
    const b = grupoB.map(valor).filter(function(v){ return v > 0; });
    if(a.length < CORR_MIN || b.length < CORR_MIN){ faltan++; return null; }
    return {a:media(a), b:media(b), na:a.length, nb:b.length};
  }

  /* 1. entrenar y dormir: la noche siguiente a entrenar frente a la de descanso */
  const conEntreno = dias.filter(entrenoEl), sinEntreno = dias.filter(function(k){ return !entrenoEl(k); });
  let r = comparar(conEntreno, sinEntreno, function(k){ const e = D[diaSiguiente(k)]; return e ? e.sueno : 0; });
  if(r && Math.abs(r.a-r.b) >= 0.25){
    const min = Math.round(Math.abs(r.a-r.b)*60);
    out.push({t:"Las noches después de entrenar duermes <b>"+min+" minutos "+(r.a>r.b?"más":"menos")+"</b>.",
              d:fmtKg(Math.round(r.a*10)/10)+" h frente a "+fmtKg(Math.round(r.b*10)/10)+" h · "+r.na+" y "+r.nb+" noches"});
  }

  /* 2. entrenar y animo */
  r = comparar(conEntreno, sinEntreno, function(k){ const e = D[k]; return e ? e.animo : 0; });
  if(r && Math.abs(r.a-r.b) >= 0.4){
    out.push({t:"Los días que entrenas tu ánimo es <b>"+(r.a>r.b?"más alto":"más bajo")+"</b>.",
              d:fmtKg(Math.round(r.a*10)/10)+" frente a "+fmtKg(Math.round(r.b*10)/10)+" sobre 5 · "+r.na+" y "+r.nb+" días"});
  }

  /* 3. dormir y energia */
  const bienDormido = dias.filter(function(k){ return D[k] && D[k].sueno >= 7; });
  const malDormido  = dias.filter(function(k){ return D[k] && D[k].sueno > 0 && D[k].sueno < 7; });
  r = comparar(bienDormido, malDormido, function(k){ return D[k].energia || 0; });
  if(r && Math.abs(r.a-r.b) >= 0.4){
    out.push({t:"Cuando duermes 7 horas o más tienes <b>"+(r.a>r.b?"más":"menos")+" energía</b>.",
              d:fmtKg(Math.round(r.a*10)/10)+" frente a "+fmtKg(Math.round(r.b*10)/10)+" sobre 5 · "+r.na+" y "+r.nb+" días"});
  }

  /* 4. habitos y animo */
  const todos = dias.filter(function(k){ return S.habits.length && S.habits.every(function(h){ return !Number(h.semanal) ? cumplido(h,k) : true; }); });
  const noTodos = dias.filter(function(k){ return todos.indexOf(k) < 0; });
  r = comparar(todos, noTodos, function(k){ const e = D[k]; return e ? e.animo : 0; });
  if(r && Math.abs(r.a-r.b) >= 0.4){
    out.push({t:"Los días que cumples todos tus hábitos diarios, tu ánimo es <b>"+(r.a>r.b?"mejor":"peor")+"</b>.",
              d:fmtKg(Math.round(r.a*10)/10)+" frente a "+fmtKg(Math.round(r.b*10)/10)+" · "+r.na+" y "+r.nb+" días"});
  }

  /* 5. animo y gasto en ocio y compras */
  const gastoCap = function(k){
    return S.expenses.filter(function(e){ return e.date===k && (e.cat==="Ocio"||e.cat==="Compras") && !e.fijo; })
      .reduce(function(t,e){ return t+e.amount; }, 0);
  };
  const animoBajo = dias.filter(function(k){ return D[k] && D[k].animo && D[k].animo <= 2; });
  const animoAlto = dias.filter(function(k){ return D[k] && D[k].animo >= 4; });
  if(animoBajo.length >= CORR_MIN && animoAlto.length >= CORR_MIN){
    const a = media(animoBajo.map(gastoCap)), b = media(animoAlto.map(gastoCap));
    if(Math.max(a,b) > 3 && Math.abs(a-b) >= 5){
      out.push({t:"Con el ánimo bajo gastas <b>"+(a>b?"más":"menos")+"</b> en ocio y compras.",
                d:money.format(a)+" al día frente a "+money.format(b)+" · "+animoBajo.length+" y "+animoAlto.length+" días"});
    }
  }else faltan++;

  /* 6. dormir y trabajo concentrado */
  const H = (S.foco && S.foco.hist) || {};
  r = comparar(bienDormido, malDormido, function(k){ return H[k] ? H[k].minutos : 0; });
  if(r && Math.abs(r.a-r.b) >= 20){
    out.push({t:"Tras dormir bien trabajas <b>"+Math.round(Math.abs(r.a-r.b))+" minutos "+(r.a>r.b?"más":"menos")+"</b> en foco.",
              d:Math.round(r.a)+" min frente a "+Math.round(r.b)+" · "+r.na+" y "+r.nb+" días"});
  }

  return {hallazgos:out, sinDatos:faltan};
}


/* ══════════ revision semanal ══════════ */
let semanaOff = 0;          /* 0 = esta semana, 1 = la anterior... */

function rangoSemana(off){
  const lunes = lunesDe(new Date());
  lunes.setDate(lunes.getDate() - 7*off);
  const dias = [];
  for(let i=0;i<7;i++){ const d = new Date(lunes); d.setDate(lunes.getDate()+i); dias.push(key(d)); }
  return dias;
}
function datosSemana(off){
  const dias = rangoSemana(off), ini = dias[0], fin = dias[6];
  const dentro = function(k){ return k >= ini && k <= fin; };
  const ses = S.gym.sessions.filter(function(x){ return dentro(x.date); });
  const gastos = S.expenses.filter(function(e){ return dentro(e.date); });
  const ingresos = (S.incomes||[]).filter(function(e){ return dentro(e.date); });
  const H = (S.foco && S.foco.hist) || {};
  let minutos = 0; dias.forEach(function(k){ if(H[k]) minutos += H[k].minutos || 0; });
  const D = S.diario || {};
  const conDiario = dias.filter(function(k){ return D[k]; });
  const cumpl = S.habits.map(function(h){
    const hechos = dias.filter(function(k){ return cumplido(h,k); }).length;
    const meta = Number(h.semanal) || 7;
    return {h:h, hechos:hechos, meta:meta};
  });
  const porCat = {};
  gastos.forEach(function(e){ porCat[e.cat] = (porCat[e.cat]||0) + e.amount; });
  const topCat = Object.keys(porCat).sort(function(a,b){ return porCat[b]-porCat[a]; })[0];
  return {
    dias:dias, ini:ini, fin:fin,
    entrenos:ses.length, volumen:ses.reduce(function(t,x){ return t+volumeOf(x); },0),
    gasto:sum(gastos), ingreso:ingresos.reduce(function(t,x){ return t+x.amount; },0),
    topCat:topCat, topCatImporte:topCat ? porCat[topCat] : 0,
    minutos:minutos, habitos:cumpl,
    animo:media(conDiario.map(function(k){ return D[k].animo; }).filter(Boolean)),
    energia:media(conDiario.map(function(k){ return D[k].energia; }).filter(Boolean)),
    sueno:media(conDiario.map(function(k){ return D[k].sueno; }).filter(Boolean)),
    terminados:S.cultura.filter(function(x){ return x.done && dentro(x.done); }),
    xp:xpDetalle(ini, fin).total
  };
}

function flecha(ahora, antes, mejorSiSube){
  if(!antes && !ahora) return "";
  if(!antes) return '<span class="vs sube-bien">nuevo</span>';
  const pc = Math.round((ahora-antes)/antes*100);
  if(pc === 0) return '<span class="vs">igual</span>';
  const bien = mejorSiSube ? pc > 0 : pc < 0;
  return '<span class="vs '+(bien?"sube-bien":"sube-mal")+'">'+(pc>0?"+":"")+pc+"%</span>";
}

/* ══════════ pomodoro ══════════
   Se guarda el instante en que acaba el bloque, no lo que queda: asi la cuenta
   sigue bien tras una recarga o tras un rato con la pantalla apagada. El aviso
   va programado en el grafo de audio, igual que el descanso del gimnasio, para
   que suene con el movil bloqueado. */
const FASES = {
  trabajo:{nombre:"Trabajo",         corto:"trabajo"},
  corto:  {nombre:"Descanso corto",  corto:"descanso"},
  largo:  {nombre:"Descanso largo",  corto:"descanso largo"}
};
const focoMin = f => Number(S.foco.cfg[f === "trabajo" ? "trabajo" : (f === "largo" ? "largo" : "corto")]) || 1;
const focoRestante = () => Math.max(0, S.foco.fin - Date.now());
function focoTexto(ms){
  const t = Math.ceil(ms/1000);
  return Math.floor(t/60) + ":" + pad(t%60);
}
/* Que fase viene despues de la actual. */
function focoSiguiente(){
  const f = S.foco;
  if(f.fase !== "trabajo") return "trabajo";
  const ciclos = Number(f.cfg.ciclos) || 4;
  return ((f.ciclo + 1) % ciclos === 0) ? "largo" : "corto";
}
function focoArrancar(fase){
  const f = S.foco;
  f.fase = fase;
  f.fin = Date.now() + focoMin(fase)*60000;
  f.corriendo = true;
  const nativo = relojTemp("pomodoro");
  unlockAudio();
  if(!nativo){
    startKeepAlive();
    scheduleAlarm(Math.round((f.fin - Date.now())/1000));
  }
  askNotif();
  save(); render();
  /* El temporizador del Reloj suena aunque cierres Bitacora del todo. */
  if(nativo) lanzarAtajo(S.reloj.atajoTemp, String(focoMin(fase)*60));
}
function focoParar(){
  const f = S.foco;
  f.corriendo = false; f.fin = 0;
  clearAlarm(); stopKeepAlive();
  save(); render();
}
/* Cierra el bloque que ha terminado y pasa al siguiente, sin arrancarlo. */
function focoRevisar(){
  const f = S.foco;
  if(!f.corriendo || f.fin === 0 || focoRestante() > 0) return false;
  if(f.fase === "trabajo"){
    f.pomos++; f.minutos += focoMin("trabajo"); f.ciclo++;
    f.hist = f.hist || {};
    f.hist[today()] = {bloques:f.pomos, minutos:f.minutos};
  }
  const sig = focoSiguiente();
  f.corriendo = false; f.fin = 0;
  f.fase = sig;
  stopKeepAlive();
  save();
  if(!relojTemp("pomodoro")){
    buzz();
    notify("Bitácora", sig === "trabajo" ? "Descanso terminado. A trabajar." : "Bloque terminado. Descansa.");
  }
  return true;
}
let focoInt = null;
function focoTic(){
  clearInterval(focoInt);
  if(!S.foco.corriendo) return;
  focoInt = setInterval(function(){
    if(!S.foco.corriendo){ clearInterval(focoInt); return; }
    const el = $("#focoReloj");
    if(!el){ clearInterval(focoInt); return; }
    if(focoRestante() <= 0){ clearInterval(focoInt); focoRevisar(); render(); return; }
    el.textContent = focoTexto(focoRestante());
    const b = $("#focoBarra");
    if(b) b.style.width = (100 - focoRestante()/(focoMin(S.foco.fase)*600)) + "%";
  }, 250);
}

/* ─── hábitos ─── */
/* La portada: que tengo hoy, sin entrar en siete pestanas. */
function vHoy(){
  const hoy = new Date();
  const bloques = [];

  /* ─ habitos que faltan ─ */
  const habFaltan = S.habits.filter(function(h){ return h.modo !== "dejar" && !cumplido(h, today()); });
  bloques.push('<div class="hoy-bloque">'+
    '<div class="hoy-cab"><h2>Hábitos</h2>'+
      '<button data-act="irA" data-t="habitos">'+doneToday()+' de '+S.habits.length+' →</button></div>'+
    (habFaltan.length
      ? habFaltan.map(function(h){
          const cant = h.tipo === "cantidad";
          return '<div class="hoy-linea">'+
            '<button class="check" data-act="'+(cant?"cantHabito":"toggleHabito")+'" data-id="'+h.id+'" aria-label="Marcar">'+svg(I.check)+'</button>'+
            '<span class="t">'+esc(h.name)+'</span>'+
            '<span class="v">'+rachaTexto(h)+'</span>'+
          '</div>';
        }).join("")
      : '<span class="hoy-vacio">Todo hecho. Buen día.</span>')+
  '</div>');

  /* ─ tareas ─ */
  const pend = S.tasks.filter(function(t){ return !t.done && t.list === "tareas"; })
    .sort(function(a,b){ return ((a.prio||2)-(b.prio||2)) || (b.ts-a.ts); });
  bloques.push('<div class="hoy-bloque">'+
    '<div class="hoy-cab"><h2>Pendientes</h2>'+
      '<button data-act="irA" data-t="tareas">'+pend.length+' →</button></div>'+
    (pend.length
      ? pend.slice(0,5).map(function(t){
          return '<div class="hoy-linea">'+
            '<button class="check" data-act="toggleTask" data-id="'+t.id+'" aria-label="Marcar">'+svg(I.check)+'</button>'+
            '<span class="t">'+esc(t.text)+'</span>'+
            ((t.subs||[]).length ? '<span class="v">'+t.subs.filter(function(x){ return x.done; }).length+'/'+t.subs.length+'</span>' : '')+
            (t.prio === 1 ? '<span class="prio-tag p1">alta</span>' : '')+
          '</div>';
        }).join("") + (pend.length>5?'<span class="hoy-vacio">y '+(pend.length-5)+' más</span>':'')
      : '<span class="hoy-vacio">Nada pendiente.</span>')+
  '</div>');

  /* ─ la compra, si falta algo ─ */
  if(faltan().length){
    bloques.push('<div class="hoy-bloque">'+
      '<div class="hoy-cab"><h2>Compra</h2>'+
        '<button data-act="irCompra">'+faltan().length+' →</button></div>'+
      faltan().slice(0,5).map(function(x){
        return '<div class="hoy-linea">'+
          '<button class="check" data-act="comprado" data-id="'+x.id+'" aria-label="Marcar comprado">'+svg(I.check)+'</button>'+
          '<span class="t">'+esc(x.name)+'</span>'+
        '</div>';
      }).join("") +
      (faltan().length>5?'<span class="hoy-vacio">y '+(faltan().length-5)+' más</span>':'')+
    '</div>');
  }

  /* ─ fechas: arriba si caen en tres dias o menos ─ */
  const fOrden = fechasOrden();
  const fCerca = fOrden.filter(function(x){ return x.p.dias <= 14; });
  const fechasBloque = '<div class="hoy-bloque">'+
    '<div class="hoy-cab"><h2>Fechas</h2><button data-act="fechas">gestionar →</button></div>'+
    (fCerca.length
      ? fCerca.map(function(x){
          const det = fechaDetalle(x.f, x.p);
          return '<div class="hoy-linea'+(x.p.dias<=1?" pronto":"")+'"><span class="t">'+esc(x.f.nombre)+(det?' <small>· '+det+'</small>':'')+'</span>'+
            '<span class="v">'+fechaCuando(x.p.dias)+'</span></div>';
        }).join("")
      : fOrden.length
        ? '<span class="hoy-vacio">Nada en dos semanas. La próxima: '+esc(fOrden[0].f.nombre)+', el '+fOrden[0].p.d.getDate()+' de '+MESES[fOrden[0].p.d.getMonth()]+'.</span>'
        : '<span class="hoy-vacio">Añade cumpleaños y fechas que no quieras olvidar.</span>')+
  '</div>';
  const fechasArriba = fOrden.length && fOrden[0].p.dias <= 3;
  if(fechasArriba) bloques.push(fechasBloque);

  /* ─ gimnasio ─ */
  const act = S.gym.active;
  let gym;
  if(act){
    gym = '<div class="hoy-linea"><span class="t">Sesión en curso: <b>'+esc(act.name)+'</b></span>'+
          '<span class="v">'+fmtDur(Date.now()-act.start)+'</span></div>';
  }else if(rutinasDeHoy().length){
    /* Lo que manda es el calendario: si hoy es lunes, sale la rutina del lunes. */
    gym = rutinasDeHoy().map(function(r){
      const hecha = rutinaHechaHoy(r.name);
      return '<div class="hoy-linea"><span class="t">'+(hecha?'':'Hoy toca ')+'<b>'+esc(r.name)+'</b></span>'+
        '<span class="v">'+(hecha?'ya hecho hoy':textoDias(diasDesdeRutina(r.name)))+'</span></div>'+
        (hecha?'':'<button class="btn sm" data-act="startRoutine" data-id="'+r.id+'">Empezar '+esc(r.name)+'</button>');
    }).join("");
  }else if(S.gym.routines.length){
    /* Sin dias asignados, se propone la que llevas mas tiempo sin hacer. */
    const conDias = S.gym.routines.map(function(r){ return {r:r, d:diasDesdeRutina(r.name)}; });
    const peor = conDias.reduce(function(a,b){
      const av = a.d===null?9999:a.d, bv = b.d===null?9999:b.d;
      return bv > av ? b : a;
    }, conDias[0]);
    gym = '<div class="hoy-linea"><span class="t">Te toca <b>'+esc(peor.r.name)+'</b></span>'+
          '<span class="v">'+textoDias(peor.d)+'</span></div>'+
          '<button class="btn sm" data-act="startRoutine" data-id="'+peor.r.id+'">Empezar '+esc(peor.r.name)+'</button>';
  }else{
    gym = '<span class="hoy-vacio">Sin rutinas todavía.</span>';
  }
  const conCalendario = S.gym.routines.some(function(r){ return (r.dias||[]).length; });
  if(!act && conCalendario && !rutinasDeHoy().length){
    gym = '<span class="hoy-vacio">Hoy no toca entrenar. Día de descanso.</span>';
  }
  const cardioHoy = (S.gym.cardio||[]).filter(function(c){ return c.date === today(); });
  if(cardioHoy.length){
    /* Si hoy tocaba descanso de fuerza pero has hecho cardio, manda el cardio. */
    if(!act && conCalendario && !rutinasDeHoy().length) gym = '';
    gym += cardioHoy.map(function(c){
      return '<div class="hoy-linea"><span class="t">Cardio: <b>'+cardioTipo(c.tipo).n+'</b>'+(c.km>0?' '+fmtKg(c.km)+' km':'')+'</span>'+
        '<span class="v">'+durCardio(c.seg)+'</span></div>';
    }).join("");
  }
  bloques.push('<div class="hoy-bloque">'+
    '<div class="hoy-cab"><h2>Gimnasio</h2><button data-act="irA" data-t="gym">ver →</button></div>'+
    gym+'</div>');

  /* ─ dinero ─ */
  const hoyGasto = S.expenses.filter(function(e){ return e.date === today(); });
  const mes = monthExpenses(0), totalMes = sum(mes);
  const ingMesHoy = monthIncomes(0).reduce(function(t,e){ return t+e.amount; }, 0);
  const tope = Number(S.budget.total)||0;
  bloques.push('<div class="hoy-bloque">'+
    '<div class="hoy-cab"><h2>Dinero</h2><button data-act="irA" data-t="gastos">ver →</button></div>'+
    '<div class="hoy-linea"><span class="t">Hoy</span><span class="hoy-grande">'+money.format(sum(hoyGasto))+'</span></div>'+
    (tope > 0
      ? '<div class="hoy-linea"><span class="t">'+(totalMes<=tope?"Queda del mes":"Te has pasado")+'</span>'+
        '<span class="v">'+money.format(Math.abs(tope-totalMes))+' de '+money0.format(tope)+' €</span></div>'+
        '<span class="bar"><i style="width:'+Math.min(100,Math.round(totalMes/tope*100))+'%"></i></span>'
      : '<div class="hoy-linea"><span class="t">Este mes</span><span class="v">'+money.format(totalMes)+'</span></div>')+
    (ingMesHoy
      ? '<div class="hoy-linea"><span class="t">Saldo del mes</span>'+
        '<span class="v" style="color:var('+(ingMesHoy-totalMes>=0?"--good":"--bad")+')">'+(ingMesHoy-totalMes>=0?"+":"−")+money.format(Math.abs(ingMesHoy-totalMes))+'</span></div>'
      : '')+
  '</div>');

  /* ─ cultura en curso ─ */
  const curso = S.cultura.filter(culCurso);
  if(curso.length){
    bloques.push('<div class="hoy-bloque">'+
      '<div class="hoy-cab"><h2>Empezado</h2><button data-act="irA" data-t="cultura">ver →</button></div>'+
      curso.slice(0,4).map(function(it){
        const epi = culEpi(it);
        const det = it.pages>0 ? (culPct(it)+"%") : (epi || culCat(it.cat).label.toLowerCase());
        return '<button class="hoy-linea" data-act="culOpen" data-id="'+it.id+'" style="width:100%;text-align:left">'+
          '<span class="t">'+esc(it.title)+'</span><span class="v">'+esc(det)+'</span></button>';
      }).join("")+
    '</div>');
  }

  /* ─ pomodoro, si lo has usado hoy o esta corriendo ─ */
  if(S.foco.corriendo || S.foco.pomos){
    bloques.push('<div class="hoy-bloque">'+
      '<div class="hoy-cab"><h2>Foco</h2><button data-act="irA" data-t="foco">ver →</button></div>'+
      (S.foco.corriendo
        ? '<div class="hoy-linea"><span class="t">'+FASES[S.foco.fase].nombre+'</span>'+
          '<span class="v">'+focoTexto(focoRestante())+'</span></div>'
        : '')+
      '<div class="hoy-linea"><span class="t">Bloques hoy</span>'+
        '<span class="v">'+S.foco.pomos+' · '+Math.floor(S.foco.minutos/60)+'h '+pad(S.foco.minutos%60)+'</span></div>'+
    '</div>');
  }

  /* ─ objetivos del ano ─ */
  const anio = new Date().getFullYear();
  const metasAno = S.metas.filter(function(m){ return Number(m.anio) === anio; });
  bloques.push('<div class="hoy-bloque">'+
    '<div class="hoy-cab"><h2>Objetivos '+anio+'</h2><button data-act="metas">gestionar →</button></div>'+
    (metasAno.length
      ? metasAno.map(metaHtml).join("")
      : '<span class="hoy-vacio">Márcate objetivos para el año. Se rellenan solos con lo que ya apuntas.</span>')+
  '</div>');

  if(!fechasArriba) bloques.push(fechasBloque);

  /* ─ recordatorios de hoy que quedan ─ */
  const porVenir = S.avisos.filter(function(a){
    return avisoToca(a) && minutosDe(a.hora) > ahoraMinutos();
  }).sort(function(a,b){ return minutosDe(a.hora)-minutosDe(b.hora); });
  bloques.push('<div class="hoy-bloque">'+
    '<div class="hoy-cab"><h2>Recordatorios</h2><button data-act="avisos">gestionar →</button></div>'+
    (porVenir.length
      ? porVenir.map(function(a){
          return '<div class="hoy-linea"><span class="t">'+esc(a.texto)+'</span><span class="v">'+esc(a.hora)+'</span></div>';
        }).join("")
      : '<span class="hoy-vacio">Nada más por hoy.</span>')+
  '</div>');

  /* ─ nivel ─ */
  const xp = xpDetalle().total, nv = nivelDe(xp);
  const base = xpParaNivel(nv), sig = xpParaNivel(nv+1);
  const pctNv = Math.round((xp-base)/(sig-base)*100);
  const nivel = '<button class="nivel" data-act="xpVer">'+
    '<span class="nivel-n">'+nv+'</span>'+
    '<span class="nivel-t"><b>'+tituloNivel(nv)+'</b>'+
      '<span class="bar"><i style="width:'+pctNv+'%"></i></span>'+
      '<span class="nivel-x">'+money0.format(xp)+' XP · '+money0.format(sig-xp)+' para el nivel '+(nv+1)+'</span></span>'+
  '</button>';

  /* ─ diario: animo, energia, sueno ─ */
  const dh = S.diario[today()] || {};
  const escala = function(campo, etiqueta){
    return '<div class="dia-fila"><span class="dia-lbl">'+etiqueta+'</span><div class="dia-esc">'+
      [1,2,3,4,5].map(function(n){
        return '<button data-act="diarioSet" data-c="'+campo+'" data-n="'+n+'" aria-pressed="'+(dh[campo]===n)+'">'+n+'</button>';
      }).join("")+'</div></div>';
  };
  const diario = '<div class="hoy-bloque">'+
    '<div class="hoy-cab"><h2>¿Cómo estás?</h2>'+
      '<button data-act="semana">tu semana →</button></div>'+
    escala("animo","Ánimo")+
    escala("energia","Energía")+
    '<div class="dia-fila"><span class="dia-lbl">Dormiste</span>'+
      '<div class="dia-sueno"><input class="field mono" id="diaSueno" inputmode="decimal" value="'+(dh.sueno?fmtKg(dh.sueno):"")+'" placeholder="7,5">'+
      '<span>horas</span></div></div>'+
    '<textarea class="field dia-linea" id="diaLinea" rows="2" maxlength="280" placeholder="Una línea sobre hoy…">'+esc(dh.linea||"")+'</textarea>'+
  '</div>';

  const esDomingo = hoy.getDay() === 0;
  const semanaBtn = esDomingo
    ? '<button class="btn wide" data-act="semana">Es domingo: repasa tu semana</button>'
    : '';

  return demoBanner()+
    '<div class="hero">'+
      '<span class="eyebrow">'+esc(fullDate(hoy))+'</span>'+
      '<h1 class="title">Hoy</h1>'+
    '</div>'+
    nivel + semanaBtn + diario +
    bloques.join("");
}

  return demoBanner()+
    '<div class="hero">'+
      '<span class="eyebrow">'+FASES[f.fase].nombre+(f.fase==="trabajo"?" · bloque "+((f.ciclo % ciclos)+1)+" de "+ciclos:"")+'</span>'+

      '<div class="tile"><span class="tv">'+Math.floor(f.minutos/60)+'h '+pad(f.minutos%60)+'</span><span class="tl">de trabajo hoy</span></div>'+
    '</div>'+

    '</div>'+

      ? '<p class="hint">Al empezar un bloque se lanza el <b>temporizador del Reloj</b>: suena aunque cierres Bitácora.</p>'

function filaHabito(h){
  if(h.modo === "dejar"){
    const cayo = !!h.days[today()];
    return '<div class="row">'+
      '<span class="dejar-n'+(cayo?" cayo":"")+'" aria-hidden="true">'+streak(h)+'</span>'+
      '<button class="row-main" data-act="habitDetail" data-id="'+h.id+'">'+
        '<span class="row-title">'+esc(h.name)+'</span>'+
        '<span class="row-sub mono">'+rachaTexto(h)+'</span>'+
      '</button>'+
      '<button class="btn ghost sm" data-act="caida" data-id="'+h.id+'">'+(cayo?"deshacer":"he caído")+'</button>'+
    '</div>';
  }
  const on = cumplido(h, today());
  const cant = h.tipo === "cantidad";
  const v = valorDia(h, today());
  const pct = (cant && h.objetivo > 0) ? Math.min(100, Math.round(v/h.objetivo*100)) : 0;
  return '<div class="row">'+
    '<button class="check '+(on?"on":"")+'" data-act="'+(cant?"cantHabito":"toggleHabit")+'" data-id="'+h.id+'" '+
      'aria-label="Marcar '+esc(h.name)+'" aria-pressed="'+on+'">'+svg(I.check)+'</button>'+
    '<button class="row-main" data-act="habitDetail" data-id="'+h.id+'">'+
      '<span class="row-title">'+esc(h.name)+'</span>'+
      '<span class="row-sub mono">'+rachaTexto(h)+'</span>'+
      (cant && h.objetivo > 0
        ? '<span class="cul-prog"><span class="bar"><i style="width:'+pct+'%"></i></span>'+
          '<span class="pc">'+fmtKg(v)+(h.unidad?" "+esc(h.unidad):"")+' de '+fmtKg(h.objetivo)+'</span></span>'
        : '')+
    '</button>'+
  '</div>';
}
function heatGrid(cells){
  const dows = ["L","M","X","J","V","S","D"];
  return '<div class="heat">'+dows.map(d=>'<span class="dow">'+d+'</span>').join("")+cells+'</div>';
}
function heatAll(){
  const t = new Date(); const dow = (t.getDay()+6)%7;
  const start = new Date(t); start.setDate(start.getDate()-dow-28);
  let cells = "";
  const total = S.habits.length || 1;
  for(let i=0;i<35;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const k = key(d);
    const n = S.habits.filter(h=>cumplido(h,k)).length;
    const lvl = n===0?0:Math.min(4,Math.ceil(n/total*4));
    cells += '<i data-l="'+lvl+'"'+(k===today()?' data-today="1"':'')+' title="'+k+": "+n+'/'+S.habits.length+'"></i>';
  }
  return heatGrid(cells);
}
function heatOne(h){
  const t = new Date(); const dow = (t.getDay()+6)%7;
  const start = new Date(t); start.setDate(start.getDate()-dow-28);
  let cells = "";
  for(let i=0;i<35;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const k = key(d);
    cells += '<i data-l="'+(cumplido(h,k)?4:0)+'"'+(k===today()?' data-today="1"':'')+' title="'+k+'"></i>';
  }
  return heatGrid(cells);
}

/* ─── listas ─── */
const faltan = () => S.inv.filter(function(x){ return x.falta; });
const PRIO = {1:"Alta", 2:"Media", 3:"Baja"};
let taskPrio = 2;
function sheetTarea(id){
  const t = S.tasks.filter(x=>x.id===id)[0]; if(!t) return;
  const subs = t.subs || [];
  const hechos = subs.filter(function(x){ return x.done; }).length;
  openSheet("Tarea",
    '<textarea class="field" id="tkT" style="min-height:64px">'+esc(t.text)+'</textarea>'+
    '<div><span class="lbl-s">Prioridad</span><div class="seg">'+
      [1,2,3].map(function(p){
        return '<button data-act="taskPrio" data-id="'+t.id+'" data-p="'+p+'" aria-pressed="'+((t.prio||2)===p)+'">'+PRIO[p]+'</button>';
      }).join("")+
    '</div></div>'+
    '<div><span class="lbl-s">Pasos'+(subs.length?' · '+hechos+' de '+subs.length:'')+'</span>'+
      (subs.length
        ? '<span class="bar" style="margin:0 0 10px"><i style="width:'+Math.round(hechos/subs.length*100)+'%"></i></span>'+
          '<div class="stack">'+subs.map(function(x){
            return '<div class="row">'+
              '<button class="check '+(x.done?"on":"")+'" data-act="subToggle" data-id="'+t.id+'" data-s="'+x.id+'" aria-pressed="'+x.done+'" aria-label="Marcar paso">'+svg(I.check)+'</button>'+
              '<span class="row-title'+(x.done?" done":"")+'" style="flex:1;white-space:normal">'+esc(x.text)+'</span>'+
              '<button class="x" data-act="subDel" data-id="'+t.id+'" data-s="'+x.id+'" aria-label="Quitar paso">'+svg(I.x)+'</button>'+
            '</div>';
          }).join("")+'</div>'
        : '<p class="hint">Divide la tarea en pasos y verás cuánto llevas. Al marcar el último, la tarea se completa sola.</p>')+
      '<div style="display:flex;gap:8px;margin-top:9px">'+
        '<input class="field" id="subIn" placeholder="Añadir un paso…" autocomplete="off" enterkeyhint="done">'+
        '<button class="btn" type="button" data-act="subAdd" data-id="'+t.id+'" aria-label="Añadir paso" style="padding:12px 15px">'+svg(I.plus)+'</button>'+
      '</div>'+
    '</div>'+
    '<button class="btn danger wide" data-act="delTaskSheet" data-id="'+t.id+'">Eliminar tarea</button>',
    function(b){
      const tk = $("#tkT", b);
      tk.addEventListener("change", function(){ leerTareaDOM(t); save(); render(); });
      const si = $("#subIn", b);
      si.addEventListener("keydown", function(e){
        if(e.key === "Enter"){ e.preventDefault(); anadirPaso(t); }
      });
    });
}
function leerTareaDOM(t){
  const tk = $("#tkT");
  if(tk && tk.value.trim()) t.text = tk.value.trim();
}
function anadirPaso(t){
  leerTareaDOM(t);
  const si = $("#subIn"), v = si ? si.value.trim() : "";
  if(!v){ if(si) si.focus(); return; }
  t.subs = t.subs || [];
  t.subs.push({id:uid(), text:v, done:false});
  if(t.done) t.done = false;             /* un paso nuevo reabre la tarea */
  save(); render(); sheetTarea(t.id);
  const n = $("#subIn"); if(n) n.focus();
}

/* ─── gastos ─── */
let gastoCat = "";
function vGastos(){
  const mes = monthExpenses(0);
  const total = sum(mes);
  const d = new Date();

  const byCat = {};
  mes.forEach(e=>{ byCat[e.cat] = (byCat[e.cat]||0)+e.amount; });
  const cats = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  const maxCat = cats.length? byCat[cats[0]] : 1;
  const lim = S.budget.cats || {};
  /* Un numero suelto no dice nada; comparado con el mes pasado, si. */
  const mesAnt = monthExpenses(1);
  const antCat = {};
  mesAnt.forEach(function(e){ antCat[e.cat] = (antCat[e.cat]||0) + e.amount; });
  const nombreMesAnt = (function(){
    const x = new Date(); x.setDate(1); x.setMonth(x.getMonth()-1);
    return MESES[x.getMonth()];
  })();
  function variacion(c){
    const ant = antCat[c] || 0;
    if(!ant) return "";
    const pc = Math.round((byCat[c]-ant)/ant*100);
    if(pc === 0) return "igual";
    return (pc > 0 ? "+" : "") + pc + "%";
  }
  const catHtml = cats.length
    ? cats.map(function(c){
        const tope = Number(lim[c]) || 0;
        const pasado = tope > 0 && byCat[c] > tope;
        return '<div class="cat-row'+(pasado?" pasado":"")+'"><span class="lbl">'+esc(c)+'</span>'+
          '<span class="track"><i style="width:'+Math.max(3, tope>0
              ? Math.min(100, byCat[c]/tope*100)
              : byCat[c]/maxCat*100)+'%"></i></span>'+
          '<span class="amt">'+money0.format(byCat[c])+(tope>0 ? " / "+money0.format(tope) : "")+' €</span>'+
          (function(){
            const v = variacion(c);
            if(!v) return '';
            const sube = v.indexOf("+") === 0;
            return '<span class="vs '+(sube?"sube":(v==="igual"?"":"baja"))+'">'+v+'</span>';
          })()+
        '</div>';
      }).join("")
    : '<p class="hint">Sin gastos este mes.</p>';

  /* Saldo: sin ingresos no sabes si el mes cierra en positivo. */
  const ingMes = monthIncomes(0);
  const totalIng = ingMes.reduce(function(t,e){ return t+e.amount; }, 0);
  const saldo = totalIng - total;
  const saldoHtml = '<section><h2 class="sec">Saldo del mes</h2>'+
    '<div class="panel saldo '+(saldo>=0?"pos":"neg")+'">'+
      '<div class="saldo-fila"><span>Ingresos</span><b class="mono">'+money.format(totalIng)+'</b></div>'+
      '<div class="saldo-fila"><span>Gastos</span><b class="mono">−'+money.format(total)+'</b></div>'+
      '<div class="saldo-total"><span>'+(saldo>=0?"Te sobran":"Te faltan")+'</span>'+
        '<b>'+money.format(Math.abs(saldo))+'</b></div>'+
      (totalIng>0?'<p class="hint" style="margin-top:6px">Has gastado el <b>'+Math.round(total/totalIng*100)+' %</b> de lo que ha entrado este mes.</p>':
        '<p class="hint" style="margin-top:6px">Apunta tus ingresos para ver si el mes cierra en positivo.</p>')+
    '</div></section>';

  /* Presupuesto: lo que queda, y a que ritmo vas para lo que resta de mes. */
  const tope = Number(S.budget.total) || 0;
  let presu = "";
  if(tope > 0){
    const pct = Math.min(100, Math.round(total/tope*100));
    const resta = tope - total;
    const diasMes = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    const quedan = diasMes - d.getDate() + 1;
    const estado = total > tope ? "pasado" : (pct >= 80 ? "justo" : "");
    presu = '<section><h2 class="sec">Presupuesto del mes</h2>'+
      '<div class="panel presu '+estado+'">'+
        '<div class="presu-top">'+
          '<span class="big">'+money.format(Math.abs(resta))+'</span>'+
          '<span class="lbl">'+(resta >= 0 ? "te quedan de "+money0.format(tope)+" €" : "te has pasado de "+money0.format(tope)+" €")+'</span>'+
        '</div>'+
        '<span class="bar"><i style="width:'+pct+'%"></i></span>'+
        '<p class="hint" style="margin-top:9px">'+
          (resta >= 0
            ? "Quedan "+quedan+" dia"+(quedan===1?"":"s")+" de mes: "+money.format(resta/quedan)+" al dia para no pasarte."
            : "Llevas "+pct+"% del presupuesto con "+quedan+" dia"+(quedan===1?"":"s")+" por delante.")+
        '</p>'+
      '</div></section>';
  }

  const botones = '<div style="display:flex;gap:8px">'+
    '<button class="btn ghost sm" data-act="presupuesto" style="flex:1">Presupuesto</button>'+
    '<button class="btn ghost sm" data-act="fijos" style="flex:1">Gastos fijos'+(S.fixed.length?" ("+S.fixed.length+")":"")+'</button>'+
  '</div>';

  /* El total esconde las fugas: por eso se puede mirar una categoria sola. */
  if(gastoCat && CATS.indexOf(gastoCat) < 0) gastoCat = "";
  const months = [];
  for(let i=5;i>=0;i--){
    const md = new Date(); md.setDate(1); md.setMonth(md.getMonth()-i);
    const delMes = monthExpenses(i);
    const v = gastoCat
      ? sum(delMes.filter(function(e){ return e.cat === gastoCat; }))
      : sum(delMes);
    months.push({k:MESES_K[md.getMonth()], v:v, now:i===0});
  }
  const maxM = Math.max.apply(null,months.map(m=>m.v).concat([1]));
  const monthsHtml = '<div class="months">'+months.map(m=>
      '<div class="m" data-now="'+(m.now?1:0)+'">'+
        '<span class="v">'+money0.format(m.v)+'</span>'+
        '<span class="col" style="height:'+Math.max(3,m.v/maxM*78)+'%"></span>'+
        '<span class="k">'+m.k+'</span>'+
      '</div>').join("")+'</div>';

  const recientes = S.expenses.map(function(e){ return Object.assign({ing:false}, e); })
    .concat((S.incomes||[]).map(function(e){ return Object.assign({ing:true}, e); }))
    .sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);
  const listHtml = recientes.length
    ? '<div class="stack">'+recientes.map(e=>
        '<div class="row">'+
          '<div class="row-main"><span class="row-title">'+esc(e.note||e.cat)+'</span>'+
          '<span class="row-sub mono">'+esc(e.cat)+' · '+relDate(e.date)+(e.fijo?' · fijo':'')+'</span></div>'+
          '<span class="row-val'+(e.ing?' ing':'')+'">'+(e.ing?'+':'')+money.format(e.amount)+'</span>'+
          '<button class="x" data-act="'+(e.ing?'delIng':'delExp')+'" data-id="'+e.id+'" aria-label="Borrar">'+svg(I.x)+'</button>'+
        '</div>').join("")+'</div>'
    : '<div class="empty">Aún no has anotado ningún gasto.<br>Toca <b>+</b> arriba.</div>';

  return demoBanner()+
    '<div class="hero">'+
      '<span class="eyebrow">'+MESES[d.getMonth()]+' '+d.getFullYear()+' · '+mes.length+' gasto'+(mes.length===1?"":"s")+'</span>'+
      '<h1 class="title money">'+money.format(total)+'</h1>'+
    '</div>'+
    saldoHtml+
    presu+
    '<section><h2 class="sec">Por categoría'+(mesAnt.length?' · frente a '+nombreMesAnt:'')+'</h2><div class="panel">'+catHtml+'</div></section>'+
    '<section><h2 class="sec">Últimos 6 meses</h2><div class="panel">'+
      '<select class="field" id="gastoCatSel" style="margin-bottom:13px">'+
        '<option value=""'+(!gastoCat?" selected":"")+'>Todas las categorías</option>'+
        CATS.map(function(c){ return '<option value="'+esc(c)+'"'+(gastoCat===c?" selected":"")+'>'+esc(c)+'</option>'; }).join("")+
      '</select>'+
      monthsHtml+'</div></section>'+
    '<section><h2 class="sec">Movimientos</h2>'+listHtml+'</section>'+
    botones;
}

/* ─── notas ─── */
let notaQuery = "";
/* Las etiquetas salen del texto: cualquier #palabra. Asi no hay un gestor de
   etiquetas que mantener, y funcionan tambien en las notas que ya tenias. */
function tagsDe(texto){
  const vistos = {}, out = [];
  (String(texto||"").match(/#[A-Za-z0-9À-ſ_-]+/g) || []).forEach(function(t){
    const k = t.slice(1).toLowerCase();
    if(!vistos[k]){ vistos[k] = 1; out.push(k); }
  });
  return out;
}
let notaTag = "";

function noteCard(n){
  const lines = n.text.split("\n").filter(l=>l.trim());
  const t = lines[0] || "Nota vacía";
  const p = lines.slice(1).join(" ");
  const tg = tagsDe(n.text);
  return '<button class="note" data-act="openNote" data-id="'+n.id+'">'+
    '<span class="nt">'+(n.pinned?svg(I.pin):"")+esc(t.slice(0,60))+'</span>'+
    (p?'<span class="np">'+esc(p)+'</span>':"")+
    (tg.length?'<span class="ntags">'+tg.map(function(x){ return '<span class="ntag">#'+esc(x)+'</span>'; }).join("")+'</span>':"")+
    '<span class="nd">'+relDate(key(new Date(n.ts)))+'</span>'+
  '</button>';
}
function notesHtml(){
  const q = notaQuery.trim().toLowerCase();
  const list = S.notes
    .filter(n=>!q || n.text.toLowerCase().indexOf(q)>=0)
    .filter(n=>!notaTag || tagsDe(n.text).indexOf(notaTag)>=0)
    .sort((a,b)=>(b.pinned-a.pinned)||(b.ts-a.ts));
  if(!list.length) return '<div class="empty">'+(q?"Ninguna nota coincide con «"+esc(notaQuery)+"».":"No hay notas todavía.<br>Toca <b>+</b> para escribir una.")+'</div>';
  return '<div class="notes">'+list.map(noteCard).join("")+'</div>';
}
function vNotas(){
  return demoBanner()+
    '<div class="hero">'+
      '<span class="eyebrow">'+S.notes.length+' nota'+(S.notes.length===1?"":"s")+'</span>'+
      '<h1 class="title">Notas</h1>'+
    '</div>'+
    '<input class="field" id="noteSearch" type="search" placeholder="Buscar…" value="'+esc(notaQuery)+'" autocomplete="off">'+
    (function(){
      const cuenta = {};
      S.notes.forEach(function(n){ tagsDe(n.text).forEach(function(t){ cuenta[t] = (cuenta[t]||0)+1; }); });
      const todas = Object.keys(cuenta).sort(function(a,b){ return cuenta[b]-cuenta[a] || a.localeCompare(b); });
      if(notaTag && !cuenta[notaTag]) notaTag = "";
      if(!todas.length) return '<p class="hint">Escribe <b>#etiqueta</b> en cualquier nota para agruparlas.</p>';
      return '<div class="tags">'+
        '<button class="chip" data-act="notaTag" data-t="" aria-pressed="'+(!notaTag)+'">Todas</button>'+
        todas.map(function(t){
          return '<button class="chip" data-act="notaTag" data-t="'+esc(t)+'" aria-pressed="'+(notaTag===t)+'">#'+esc(t)+' '+cuenta[t]+'</button>';
        }).join("")+
      '</div>';
    })()+
    '<div id="notesList">'+notesHtml()+'</div>';
}

/* ─── gimnasio ─── */
function fmtDur(ms){
  const m = Math.floor(ms/60000);
  return m<60 ? m+" min" : Math.floor(m/60)+" h "+pad(m%60);
}
function setChip(s, isPR){
  if(isTodo(s)){
    const r = s.tReps || "—";
    return '<span class="set todo'+(isWarm(s)?" warm":"")+'">'+
      '<b>'+esc(r)+'</b>×'+(s.kg?s.kg+" kg":"pc")+(isWarm(s)?' <span style="font-size:9px">cal</span>':'')+'</span>';
  }
  return '<span class="set'+(isWarm(s)?" warm":(isPR?" pr":""))+'">'+
    '<b>'+s.reps+'</b>×'+(s.kg?s.kg+" kg":"pc")+(isWarm(s)?' <span style="font-size:9px">cal</span>':'')+'</span>';
}
/* Una fila por serie, editable en el sitio: peso, reps, tipo (calentamiento o
   trabajo) y el botón de cronómetro, que marca la serie como hecha y arranca el
   descanso. Tocarlo otra vez la desmarca. */
function setRow(s, i, j){
  const done = !isTodo(s);
  const kg = (s.kg===undefined || s.kg===null) ? "" : s.kg;
  const reps = s.reps || "";
  return '<div class="strow'+(done?" done":"")+'">'+
    '<span class="st-n">'+(j+1)+'</span>'+
    '<input class="field" id="stK'+i+'_'+j+'" inputmode="decimal" value="'+kg+'" placeholder="0" aria-label="Peso de la serie '+(j+1)+'">'+
    '<input class="field" id="stR'+i+'_'+j+'" inputmode="numeric" value="'+reps+'" placeholder="'+esc(s.tReps||"0")+'" aria-label="Repeticiones de la serie '+(j+1)+'">'+
    '<button class="st-tipo" data-t="'+(s.warmup?"C":"T")+'" data-act="stTipo" data-i="'+i+'" data-j="'+j+'" '+
      'title="'+(s.warmup?"Calentamiento":"Trabajo")+'" aria-label="Cambiar tipo de serie">'+(s.warmup?"C":"T")+'</button>'+
    '<button class="st-go" data-act="stMark" data-i="'+i+'" data-j="'+j+'" '+
      'aria-pressed="'+done+'" aria-label="'+(done?"Desmarcar serie":"Marcar hecha y descansar")+'">'+
      (done ? svg(I.check) : svg(I.timer))+'</button>'+
    '<button class="x" data-act="stDel" data-i="'+i+'" data-j="'+j+'" aria-label="Quitar serie">'+svg(I.x)+'</button>'+
  '</div>';
}
/* Guarda lo escrito en las casillas antes de volver a dibujar la pantalla,
   o se perderia al tocar cualquier boton de la fila. */
function leerFilas(i){
  const a = S.gym.active; if(!a) return;
  const idx = (i===undefined||i===null) ? a.entries.map((_,k)=>k) : [i];
  idx.forEach(k=>{
    const en = a.entries[k]; if(!en) return;
    en.sets.forEach((s,j)=>{
      const kIn = $("#stK"+k+"_"+j), rIn = $("#stR"+k+"_"+j);
      if(kIn){
        const v = parseFloat((kIn.value||"").replace(",","."));
        s.kg = isNaN(v) ? 0 : v;
      }
      if(rIn){
        const v = parseInt(rIn.value,10);
        if(!isNaN(v) && v>0) s.reps = v; else if(isTodo(s)) delete s.reps;
      }
    });
  });
}

function gymSesion(){
  const a = S.gym.active;
  if(a) return sessionHtml(a)+'<section><h2 class="sec">Historial</h2>'+historyHtml(6)+'</section>'+cardioHistorial();

  const rt = S.gym.routines.length
    ? '<section><h2 class="sec">Empezar con una rutina</h2><div class="stack">'+
        (function(){
          const conDias = S.gym.routines.map(function(r){
            return {r:r, d:diasDesdeRutina(r.name)};
          });
          /* La mas atrasada primero: es la que toca. */
          const peor = conDias.reduce(function(a,b){
            const av = a.d === null ? 9999 : a.d, bv = b.d === null ? 9999 : b.d;
            return bv > av ? b : a;
          }, conDias[0]);
          /* Si alguna rutina tiene hoy asignado, esa es la que toca; si no,
             se propone la mas atrasada. */
          const hoyToca = rutinasDeHoy();
          return conDias.map(function(x){
            const c = routineCount(x.r);
            const esDeHoy = hoyToca.some(function(r){ return r.id === x.r.id; });
            const toca = hoyToca.length
              ? esDeHoy
              : (peor && x.r.id === peor.r.id && (x.d === null || x.d >= 2));
            const dd = textoDiasSemana(x.r);
            return '<button class="row" data-act="startRoutine" data-id="'+x.r.id+'"><div class="row-main">'+
              '<span class="row-title">'+esc(x.r.name)+

              '<span class="row-sub mono">'+(dd?dd+' · ':'')+textoDias(x.d)+' · '+c.work+' series'+(c.warm?" + "+c.warm+" cal":"")+'</span>'+
            '</div><span class="row-val">→</span></button>';
          }).join("");
        })()+'</div></section>'
    : "";

  return '<div style="display:flex;gap:8px">'+
      '<button class="btn" data-act="startSess" style="flex:1.4">Entreno libre</button>'+

    cardioHistorial();
}

/* ══════════ cultura ══════════ */
const culPct = it => (it.pages>0) ? Math.max(0, Math.min(100, Math.round((it.page||0)/it.pages*100))) : 0;
/* Tres estados, y los marcan los campos que faltan: sin fecha de inicio esta
   pendiente; con fecha de fin, terminado. */
const culPend = it => !it.started && !it.done;
const culCurso = it => !!it.started && !it.done;
/* Ritmo de lectura. Si hay registro de paginas reciente se usa ese tramo, que
   refleja como lees AHORA; si no, la media desde que empezaste el libro. */
function ritmoLectura(it){
  if(it.cat !== "libros" || !culCurso(it) || !(it.pages > 0) || !(it.page > 0)) return null;
  let pagDia = 0;
  const hace21 = daysAgo(21);
  const log = (it.pageLog||[]).filter(function(x){ return x.date >= hace21; })
    .sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(log.length >= 2){
    const a = log[0], b = log[log.length-1];
    const dias = Math.round((parseKey(b.date) - parseKey(a.date)) / 86400000);
    if(dias >= 3 && b.page > a.page) pagDia = (b.page - a.page) / dias;
  }
  if(!pagDia){
    const dias = Math.max(1, Math.round((parseKey(today()) - parseKey(it.started)) / 86400000));
    pagDia = it.page / dias;
  }
  if(pagDia <= 0) return null;
  const quedan = Math.max(0, it.pages - it.page);
  const diasFin = Math.ceil(quedan / pagDia);
  const fin = new Date(); fin.setDate(fin.getDate() + diasFin);
  return {pagDia:pagDia, diasFin:diasFin, fin:fin};
}
function ritmoTexto(r){
  if(!r) return "";
  const pd = r.pagDia >= 10 ? Math.round(r.pagDia) : Math.round(r.pagDia*10)/10;
  return fmtKg(pd) + " pág/día · " +
    (r.diasFin <= 0 ? "lo acabas hoy" : "lo acabas el " + r.fin.getDate() + " " + MESES_K[r.fin.getMonth()]);
}

/* Las series marcan por donde van con temporada y episodio. */
function culEpi(it){
  if(it.cat !== "series") return "";
  const t = Number(it.temporada)||0, e = Number(it.episodio)||0;
  if(!t && !e) return "";
  return (t ? "T"+t : "") + (t && e ? " " : "") + (e ? "E"+e : "");
}
function culDias(it){
  if(!it.done) return "";
  const d = Math.round((parseKey(it.done)-parseKey(it.started))/86400000);
  if(d<=0) return "en el día";
  return "en "+d+" día"+(d===1?"":"s");
}
function culFila(it){
  const pct = culPct(it);
  const epi = culEpi(it);
  const sub = it.done
    ? ("terminado "+relDate(it.done)+(culDias(it)?" · "+culDias(it):""))
    : culPend(it)
      ? ("pendiente"+(it.by?" · "+it.by:""))
      : ("empezado "+relDate(it.started)+(epi?" · "+epi:"")+(it.by?" · "+it.by:""));
  return '<button class="row" data-act="culOpen" data-id="'+it.id+'">'+
    '<div class="row-main">'+
      '<span class="row-title">'+esc(it.title)+'</span>'+
      '<span class="row-sub mono">'+esc(sub)+'</span>'+
      (culCurso(it) && it.pages>0
        ? '<span class="cul-prog"><span class="bar"><i style="width:'+pct+'%"></i></span>'+
          '<span class="pc">'+pct+'%</span>'+
          '<span class="row-sub mono" style="grid-column:1/-1">página '+(it.page||0)+' de '+it.pages+
            (ritmoLectura(it) ? ' · '+ritmoTexto(ritmoLectura(it)) : '')+'</span></span>'
        : '')+
    '</div>'+
    (it.score ? '<span class="score">'+it.score+'<small>/10</small></span>' : '<span class="row-val">→</span>')+
  '</button>';
}
function vCultura(){
  const c = culCat(S.culTab);
  const items = S.cultura.filter(x=>x.cat===S.culTab);
  const pendientes = items.filter(culPend).sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  const curso = items.filter(culCurso).sort((a,b)=>b.started.localeCompare(a.started));
  const fin = items.filter(x=>x.done).sort((a,b)=>b.done.localeCompare(a.done));

  const notas = fin.filter(x=>x.score);
  const media = notas.length ? (notas.reduce((t,x)=>t+x.score,0)/notas.length) : 0;
  const esteAno = S.cultura.filter(x=>x.done && x.done.slice(0,4)===String(new Date().getFullYear())).length;

  /* Los terminados se agrupan por año: es la forma natural de mirar atrás. */
  let ultimoAno = null, finHtml = "";
  fin.forEach(it=>{
    const ano = it.done.slice(0,4);
    if(ano!==ultimoAno){
      if(ultimoAno!==null) finHtml += '</div>';
      finHtml += '<div class="cul-year">'+ano+'</div><div class="stack">';
      ultimoAno = ano;
    }
    finHtml += culFila(it);
  });
  if(ultimoAno!==null) finHtml += '</div>';

  return demoBanner()+
    '<div class="hero">'+
      '<span class="eyebrow">'+esteAno+' terminado'+(esteAno===1?"":"s")+' en '+new Date().getFullYear()+'</span>'+
      '<h1 class="title">Cultura</h1>'+
    '</div>'+
    '<div class="seg" role="group">'+
      CULTURA.map(x=>'<button data-act="culTab" data-c="'+x.id+'" aria-pressed="'+(S.culTab===x.id)+'">'+x.label+'</button>').join("")+
    '</div>'+
    '<section><h2 class="sec">'+c.verbo+' ahora</h2>'+
      (curso.length ? '<div class="stack">'+curso.map(culFila).join("")+'</div>'
        : '<div class="empty">Nada empezado.<br>Toca <b>+</b> para añadir un '+c.uno+'.</div>')+
    '</section>'+
    (pendientes.length
      ? '<section><h2 class="sec">Pendientes · '+pendientes.length+'</h2>'+
          '<div class="stack">'+pendientes.map(culFila).join("")+'</div></section>'
      : '')+
    '<section><h2 class="sec">Terminados'+(notas.length?' · nota media '+media.toFixed(1).replace(".",","):'')+'</h2>'+
      (fin.length ? finHtml : '<div class="empty">Todavía no has terminado ningún '+c.uno+'.</div>')+
    '</section>';
}

/* ══════════ render ══════════ */
let timer = null, lastTab = null;
function render(){
  /* Apuntar una serie vuelve a dibujar la pantalla entera: si además saltase
     al principio de la lista, sería inusable. Guardamos dónde estaba. */
  const keepScroll = (lastTab === S.tab+"/"+S.gymTab) ? view.scrollTop : 0;
  lastTab = S.tab+"/"+S.gymTab;

  applyTheme();
  app.dataset.mod = S.tab;
  const tab = TABS.filter(t=>t.id===S.tab)[0];
  topTitle.textContent = tab.top;

  $("#tabbar").innerHTML = TABS.map(t=>
    '<button data-act="tab" data-tab="'+t.id+'" aria-current="'+(t.id===S.tab)+'">'+svg(I[t.id])+'<span>'+t.label+'</span></button>'
  ).join("");

  view.innerHTML = S.tab==="foco" ? vFoco()
    : S.tab==="hoy" ? vHoy()
    : S.tab==="habitos" ? vHabitos()
    : S.tab==="tareas" ? vTareas()
    : S.tab==="gastos" ? vGastos()
    : S.tab==="notas"  ? vNotas()
    : S.tab==="cultura" ? vCultura()
    : vGym();
  view.scrollTop = keepScroll;

  const pb = $("#primaryBtn");
  pb.hidden = false;
  pb.setAttribute("aria-label", {foco:"Concentración",hoy:"Recordatorios",habitos:"Nuevo hábito",tareas:"Añadir",gastos:"Nuevo gasto",notas:"Nueva nota",gym:"Añadir ejercicio",cultura:"Añadir a la lista"}[S.tab]);

  const f = $("#taskForm");
  if(f) f.addEventListener("submit", e=>{
    e.preventDefault();
    const inp = $("#taskInput"), txt = inp.value.trim();
    if(!txt) return;
    if(S.list === "inv"){
      if(!S.inv.some(function(x){ return x.name.toLowerCase() === txt.toLowerCase(); }))
        S.inv.unshift({id:uid(), name:txt, falta:false});
    }else{
      S.tasks.unshift({id:uid(),text:txt,done:false,list:"tareas",ts:Date.now(),prio:taskPrio,subs:[]});
    }
    save(); render();
    const n = $("#taskInput"); if(n) n.focus();
  });

  const sr = $("#noteSearch");
  if(sr) sr.addEventListener("input", e=>{
    notaQuery = e.target.value;
    $("#notesList").innerHTML = notesHtml();
  });

  const gc = $("#gastoCatSel");
  if(gc) gc.addEventListener("change", function(e){ gastoCat = e.target.value; render(); });

  const ps = $("#progSel");
  if(ps) ps.addEventListener("change", e=>{
    progEx = e.target.value;
    $("#progBox").innerHTML = progChart(progEx);
  });

  clearInterval(timer);
  if(S.tab==="gym" && S.gym.active){
    timer = setInterval(()=>{
      const el = $("#sessTimer");
      if(el && S.gym.active) el.textContent = fmtDur(Date.now()-S.gym.active.start);
      else clearInterval(timer);
    },10000);
  }
}

/* ══════════ hojas concretas ══════════ */
function campposHabito(h){
  h = h || {tipo:"si", unidad:"", objetivo:0, semanal:0, name:"", modo:"hacer", desde:""};
  const cant = h.tipo === "cantidad";
  const dejar = h.modo === "dejar";
  const modo = '<div><span class="lbl-s">Qué quieres</span><div class="seg">'+
      '<button data-act="hModo" data-m="hacer" aria-pressed="'+(!dejar)+'">Hacerlo</button>'+
      '<button data-act="hModo" data-m="dejar" aria-pressed="'+dejar+'">Dejarlo</button>'+
    '</div></div>';
  const nombre = '<div><label class="lbl-s" for="hName">Nombre</label>'+
    '<input class="field" id="hName" value="'+esc(h.name||"")+'" placeholder="'+(dejar?"Ej: sin bollería":"Ej: 3 h de gamedev")+'" enterkeyhint="done"></div>';
  if(dejar){
    return modo + nombre +
      '<div><label class="lbl-s" for="hDesde">Llevas sin hacerlo desde</label>'+
      '<input class="field" id="hDesde" type="date" max="'+today()+'" value="'+(h.desde||today())+'"></div>'+
      '<p class="hint">Al revés que los demás: la racha cuenta los días <b>sin</b> hacerlo, y solo apuntas el día que caes. Cada día limpio cuenta como cumplido.</p>';
  }
  return modo + nombre +

    '<div><span class="lbl-s">Como se apunta</span><div class="seg">'+
      '<button data-act="hTipo" data-t="si" aria-pressed="'+(!cant)+'">Hecho o no</button>'+
      '<button data-act="hTipo" data-t="cantidad" aria-pressed="'+cant+'">Con cantidad</button>'+
    '</div></div>'+

    (cant
      ? '<div class="setform" style="grid-template-columns:1fr 1fr">'+
          '<div><label class="lbl-s" for="hObj">Objetivo al dia</label><input class="field mono" id="hObj" inputmode="decimal" value="'+(h.objetivo||"")+'" placeholder="2" style="text-align:center"></div>'+
          '<div><label class="lbl-s" for="hUni">Unidad</label><input class="field" id="hUni" value="'+esc(h.unidad||"")+'" placeholder="L, h, km" style="text-align:center"></div>'+
        '</div>'
      : '')+

    '<div><label class="lbl-s" for="hSem">Cada cuanto</label>'+
      '<select class="field" id="hSem">'+
        '<option value="0"'+(!h.semanal?" selected":"")+'>Todos los dias</option>'+
        [1,2,3,4,5,6].map(function(n){
          return '<option value="'+n+'"'+(Number(h.semanal)===n?" selected":"")+'>'+n+' dia'+(n===1?"":"s")+' por semana</option>';
        }).join("")+
      '</select>'+
      '<p class="hint" style="margin-top:7px">Con un objetivo semanal la racha se cuenta <b>en semanas</b>: se rompe cuando una semana acaba por debajo de la meta, no por descansar un dia. La semana en curso no la rompe hasta que termina.</p>'+
    '</div>';
}
function sheetNuevoHabito(){
  hDraft = {name:"", tipo:"si", unidad:"", objetivo:0, semanal:0, modo:"hacer", desde:""};
  openSheet("Nuevo habito",
    campposHabito(hDraft) + '<button class="btn wide" data-act="saveHabit">Crear habito</button>',
    b=>{ const i = $("#hName",b); if(i) i.focus(); });
}
let hDraft = null;
function leerHabitoDOM(){
  if(!hDraft) return;
  const n = $("#hName"); if(n) hDraft.name = n.value;
  const o = $("#hObj"); if(o) hDraft.objetivo = parseFloat((o.value||"0").replace(",","."))||0;
  const u = $("#hUni"); if(u) hDraft.unidad = u.value.trim();
  const sm = $("#hSem"); if(sm) hDraft.semanal = parseInt(sm.value,10)||0;
  const ds = $("#hDesde"); if(ds) hDraft.desde = ds.value || today();
}
function saveHabit(){
  leerHabitoDOM();
  const v = (hDraft.name||"").trim();
  if(!v){ const i=$("#hName"); if(i) i.focus(); return; }
  const dejar = hDraft.modo === "dejar";
  if(dejar){
    hDraft.tipo = "si"; hDraft.semanal = 0; hDraft.objetivo = 0; hDraft.unidad = "";
    if(!hDraft.desde || hDraft.desde > today()) hDraft.desde = today();
  }
  if(hDraft.id){
    const h = S.habits.filter(x=>x.id===hDraft.id)[0];
    if(h){
      /* Cambiar de modo invierte el significado de los dias apuntados: se empieza de cero. */
      if((h.modo||"hacer") !== hDraft.modo) h.days = {};
      h.name=v; h.tipo=hDraft.tipo; h.unidad=hDraft.unidad; h.objetivo=hDraft.objetivo; h.semanal=hDraft.semanal;
      h.modo = hDraft.modo; h.desde = dejar ? hDraft.desde : "";
    }
  }else{
    S.habits.push({id:uid(), name:v, days:{}, tipo:hDraft.tipo, unidad:hDraft.unidad, objetivo:hDraft.objetivo, semanal:hDraft.semanal,
                   modo:hDraft.modo, desde:dejar ? hDraft.desde : ""});
  }
  hDraft = null;
  save(); closeSheet(); render();
}
function sheetEditarHabito(id){
  const h = S.habits.filter(x=>x.id===id)[0]; if(!h) return;
  hDraft = {id:h.id, name:h.name, tipo:h.tipo||"si", unidad:h.unidad||"", objetivo:h.objetivo||0, semanal:h.semanal||0,
            modo:h.modo||"hacer", desde:h.desde||""};
  openSheet("Editar habito",
    campposHabito(hDraft) + '<button class="btn wide" data-act="saveHabit">Guardar</button>');
}

}
function sheetHabito(id){
  const h = S.habits.filter(x=>x.id===id)[0]; if(!h) return;
  if(h.modo === "dejar"){
    const caidas = Object.keys(h.days).sort().reverse();
    const limpios = h.desde ? Math.max(0, diasEntre(h.desde, today()) + 1) - caidas.filter(function(k){ return k >= h.desde; }).length : 0;
    openSheet(h.name,
      '<div class="panel">'+heatOne(h)+'</div>'+
      '<div><div class="kv"><span>Racha actual</span><b class="mono">'+rachaTexto(h)+'</b></div>'+
      '<div class="kv"><span>Mejor racha</span><b class="mono">'+mejorRachaDejar(h)+' días</b></div>'+
      '<div class="kv"><span>Días limpios desde '+relDate(h.desde)+'</span><b class="mono">'+limpios+'</b></div>'+
      '<div class="kv"><span>Caídas</span><b class="mono">'+caidas.length+'</b></div></div>'+
      '<div><span class="lbl-s">Apuntar una caída de otro día</span>'+
        '<div style="display:flex;gap:8px"><input class="field" id="cdF" type="date" min="'+(h.desde||"")+'" max="'+today()+'" value="'+daysAgo(1)+'">'+
        '<button class="btn ghost sm" data-act="caidaFecha" data-id="'+h.id+'">Apuntar</button></div></div>'+

function cardioProgreso(){
  const cs = S.gym.cardio || [];
  if(!cs.length) return '';
  const mes = today().slice(0,7);
  const delMes = cs.filter(function(c){ return c.date.slice(0,7) === mes; });

      const suyos = cs.filter(function(c){ return c.tipo === t.id; });

      const mejor = suyos.filter(ritmoNum).reduce(function(a,b){ return mejorRitmo(a, b, t.id); }, null);
      const larga = suyos.reduce(function(a,b){ return (Number(b.km)||0) > (Number(a.km)||0) ? b : a; }, suyos[0]);
      return '<div class="goal"><span class="gn">'+t.n+' <span style="color:var(--text-3);font-weight:400;font-size:12px">· '+suyos.length+' · '+fmtKg(Math.round(km*10)/10)+' km</span></span>'+

    }).join("")+'</div>'+
  '</section>';
}

function addExercise(name){
  if(S.gym.exercises.indexOf(name)<0) S.gym.exercises.push(name);
  if(exPickTo==="routine"){
    readRoutineDOM();
    if(exPickIdx !== null){
      /* Cambiar el ejercicio de una fila conserva sus series: normalmente lo
         que cambias es el movimiento, no el esquema de repeticiones. */
      const e = rtDraft.exercises[exPickIdx];
      e.name = name;
      e.eq = MATERIAL[name] || e.eq || "";
      exPickIdx = null;
    }else{
      rtDraft.exercises.push({
        name:name,
        eq:MATERIAL[name] || "",
        restSeconds:S.gym.restDefault,
        restWarmup:60,
        sets:[{reps:"8-10",kg:0},{reps:"8-10",kg:0},{reps:"8-10",kg:0}]
      });
    }
    save(); renderRoutineSheet();
    return;
  }
  if(!S.gym.active) return;
  /* Un ejercicio suelto arranca con tres series vacias listas para rellenar. */
  const rest = S.gym.restDefault;
  S.gym.active.entries.push({
    ex:name,
    sets:[0,1,2].map(function(){ return {todo:true, warmup:false, kg:0, tReps:"", tRest:rest}; })
  });
  save(); closeSheet(); render();
}

let rtDraft = null;
function openRoutine(id){
  const r = id ? S.gym.routines.filter(x=>x.id===id)[0] : null;
  rtDraft = r
    ? {id:r.id, name:r.name, dias:(r.dias||[]).slice(), exercises:r.exercises.map(e=>({
        name:e.name,
        eq:e.eq===undefined ? (MATERIAL[e.name]||"") : e.eq,
        restSeconds:e.restSeconds,
        restWarmup:e.restWarmup===undefined?60:e.restWarmup,
        sets:routineSets(e).map(s=>({reps:s.reps, kg:s.kg, warmup:!!s.warmup}))
      }))}
    : {id:null, name:"", dias:[], exercises:[]};
  renderRoutineSheet();
}
function readRoutineDOM(){
  if(!rtDraft) return;
  const n = $("#rtName"); if(n) rtDraft.name = n.value;
  const cd = $("#rtDias");
  if(cd){
    const dias = [];
    Array.prototype.forEach.call(cd.children, function(c){
      if(c.getAttribute("aria-pressed") === "true") dias.push(+c.dataset.d);
    });
    rtDraft.dias = dias;
  }
  rtDraft.exercises.forEach((e,i)=>{
    const d = $("#rtD"+i), w = $("#rtW"+i), q = $("#rtE"+i);
    if(d) e.restSeconds = Math.max(0, parseInt(d.value,10)||0);
    if(w) e.restWarmup  = Math.max(0, parseInt(w.value,10)||0);
    if(q) e.eq = q.value;
    (e.sets||[]).forEach((s,j)=>{
      const r = $("#rsR"+i+"_"+j), k = $("#rsK"+i+"_"+j);
      if(r) s.reps = repsRange(r.value).label || s.reps || "10";
      if(k) s.kg = parseFloat((k.value||"0").replace(",","."))||0;
    });
  });
}
function renderRoutineSheet(){
  const d = rtDraft;
  const rows = d.exercises.length
    ? d.exercises.map((e,i)=>{
        let n = 0;
        const sets = (e.sets||[]).map((s,j)=>{
          const w = !!s.warmup;
          if(!w) n++;
          return '<div class="rt-set">'+
            '<span class="rt-n'+(w?" cal":"")+'">'+(w?"C":n)+'</span>'+
            '<input class="field" id="rsK'+i+'_'+j+'" value="'+(s.kg||0)+'" inputmode="decimal" aria-label="Peso de la serie '+(j+1)+'">'+
            '<input class="field" id="rsR'+i+'_'+j+'" value="'+esc(repsRange(s.reps).label||"")+'" placeholder="6-8" aria-label="Repeticiones de la serie '+(j+1)+'">'+
            '<button class="chip mini" data-act="rtWarm" data-i="'+i+'" data-j="'+j+'" aria-pressed="'+w+'" title="Serie de calentamiento">cal</button>'+
            '<button class="x" data-act="rtDelSet" data-i="'+i+'" data-j="'+j+'" aria-label="Quitar serie">'+svg(I.x)+'</button>'+
          '</div>';
        }).join("");
        return '<div class="rt-row">'+
          '<div class="rt-head">'+
            '<button class="rt-name" data-act="rtEditEx" data-i="'+i+'">'+esc(e.name)+
              '<span>cambiar</span></button>'+
            '<button class="x" data-act="rtDelEx" data-i="'+i+'" aria-label="Quitar ejercicio">'+svg(I.x)+'</button></div>'+
          '<div class="rt-sub"><span>Material</span>'+
            '<select class="field" id="rtE'+i+'" style="width:auto;flex:1">'+
              '<option value=""'+(!e.eq?" selected":"")+'>Sin especificar</option>'+
              MATERIALES.map(function(m){
                return '<option value="'+esc(m)+'"'+(e.eq===m?" selected":"")+'>'+esc(m)+'</option>';
              }).join("")+
            '</select></div>'+
          '<div class="rt-sub"><span>Descanso</span>'+
            '<input class="field" id="rtW'+i+'" inputmode="numeric" value="'+(e.restWarmup===undefined?60:e.restWarmup)+'" aria-label="Descanso tras una serie de calentamiento">'+
            '<span>s cal</span>'+
            '<input class="field" id="rtD'+i+'" inputmode="numeric" value="'+(e.restSeconds||90)+'" aria-label="Descanso tras una serie de trabajo">'+
            '<span>s trabajo</span></div>'+
          (sets ? '<div class="rt-cols"><span></span><span>peso (kg)</span><span>reps</span><span></span><span></span></div>'+sets
                : '<p class="hint">Este ejercicio no tiene series.</p>')+
          '<button class="btn ghost sm" data-act="rtAddSet" data-i="'+i+'">+ serie</button>'+
        '</div>';
      }).join("")
    : '<p class="hint">Añade los ejercicios de esta rutina en el orden en que los haces. Luego podrás ajustar cada serie por separado: reps, kilos y cuáles son de calentamiento.</p>';

  openSheet(d.id?"Editar rutina":"Nueva rutina",
    '<div><label class="lbl-s" for="rtName">Nombre</label>'+
    '<input class="field" id="rtName" value="'+esc(d.name)+'" placeholder="Ej: Empuje"></div>'+
    '<div><span class="lbl-s">Qué días toca</span>'+
      '<div class="chips" id="rtDias">'+DIAS_CORTOS.map(function(nom,i){
        const dia = i+1;
        const on = Array.isArray(d.dias) && d.dias.indexOf(dia) >= 0;
        return '<button class="chip" data-act="rtDia" data-d="'+dia+'" aria-pressed="'+on+'">'+nom+'</button>';
      }).join("")+'</div>'+
      '<p class="hint" style="margin-top:7px">Los días que marques hacen que esta rutina aparezca en <b>Hoy</b> cuando toque. Sin ningún día marcado, se te propone la que lleves más tiempo sin hacer.</p>'+
    '</div>'+
    '<div>'+rows+'</div>'+
    '<button class="btn ghost wide" data-act="rtAddEx">+ Añadir ejercicio</button>'+
    '<button class="btn wide" data-act="rtSave">Guardar rutina</button>'+
    (d.id?'<button class="btn danger wide" data-act="rtDel" data-id="'+d.id+'">Eliminar rutina</button>':""),
    b=>{ if(!d.name){ const n = $("#rtName",b); if(n) n.focus(); } });
}
