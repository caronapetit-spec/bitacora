<meta charset="utf-8">
<title>Bitácora</title>
<meta name="description" content="Hábitos, tareas, gastos, notas y gimnasio en una sola app.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">

<style>
/* ───────── tokens ───────── */
:root{
  --bg:#E9EBF0;
  --surface:#FFFFFF;
  --surface-2:#F5F6FA;
  --surface-3:#ECEEF4;
  --line:#E0E3EC;
  --line-2:#CBD0DE;
  --text:#141722;
  --text-2:#575D70;
  --text-3:#8B91A3;
  --m-habitos:#2F9E76;
  --m-tareas:#5C6AC4;
  --m-gastos:#B5822A;
  --m-notas:#AF5486;
  --m-gym:#C9503B;
  --m-cultura:#2A8C9E;
  --m-foco:#B0553F;
  --good:#2F9E76;
  --bad:#C2403C;
  --shadow:0 1px 2px rgba(20,24,35,.05), 0 10px 30px rgba(20,24,35,.07);
  --r:15px;
  --accent:var(--m-habitos);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D12;
    --surface:#15181F;
    --surface-2:#1C2029;
    --surface-3:#232833;
    --line:#272C37;
    --line-2:#39404F;
    --text:#ECEEF4;
    --text-2:#A0A6B6;
    --text-3:#6B7385;
    --m-habitos:#4FCBA0;
    --m-tareas:#8E98EC;
    --m-gastos:#DDA857;
    --m-notas:#DB84B2;
    --m-gym:#EE8168;
    --m-cultura:#57C4D6;
    --m-foco:#E39177;
    --good:#4FCBA0;
    --bad:#EF7A74;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0D12;
  --surface:#15181F;
  --surface-2:#1C2029;
  --surface-3:#232833;
  --line:#272C37;
  --line-2:#39404F;
  --text:#ECEEF4;
  --text-2:#A0A6B6;
  --text-3:#6B7385;
  --m-habitos:#4FCBA0;
  --m-tareas:#8E98EC;
  --m-gastos:#DDA857;
  --m-notas:#DB84B2;
  --m-gym:#EE8168;
  --m-cultura:#57C4D6;
  --m-foco:#E39177;
  --good:#4FCBA0;
  --bad:#EF7A74;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
/* Sin esto, las reglas de abajo (.sheet-wrap{display:flex}) ganan al display:none
   por defecto del atributo hidden, y el panel modal se queda visible siempre. */
[hidden]{display:none !important}
img{max-width:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  display:grid;
  place-items:center;
  overscroll-behavior:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ───────── shell ───────── */
.app{
  width:min(100%,440px);
  height:100dvh;
  background:var(--surface);
  display:grid;
  grid-template-rows:auto 1fr auto;
  overflow:hidden;
  position:relative;
}
.app[data-mod="hoy"]{--accent:var(--m-habitos)}
.app[data-mod="habitos"]{--accent:var(--m-habitos)}
.app[data-mod="tareas"]{--accent:var(--m-tareas)}
.app[data-mod="gastos"]{--accent:var(--m-gastos)}
.app[data-mod="notas"]{--accent:var(--m-notas)}
.app[data-mod="gym"]{--accent:var(--m-gym)}
.app[data-mod="cultura"]{--accent:var(--m-cultura)}
.app[data-mod="foco"]{--accent:var(--m-foco)}
@media (min-width:520px) and (min-height:700px){
  .app{height:min(880px,94dvh);border-radius:26px;box-shadow:var(--shadow);border:1px solid var(--line)}
}

.topbar{
  display:grid;
  grid-template-columns:44px 1fr 44px;
  align-items:center;
  height:52px;
  padding:max(env(safe-area-inset-top),0px) 8px 0;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.topbar-title{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  text-align:center;
  color:var(--text-3);
}
.icon-btn{
  width:40px;height:40px;
  display:grid;place-items:center;
  border-radius:11px;
  color:var(--text-2);
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.accent{color:var(--accent)}
.icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.view{
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:18px 18px 28px;
  display:flex;
  flex-direction:column;
  gap:22px;
}
/* Los hijos de un flex de altura fija se encogen por defecto. Combinado con el
   overflow:hidden de .stack, eso recortaba filas de las listas en vez de dejar
   que la pantalla hiciera scroll. */
.view > *{flex:none}

.tabbar{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  border-top:1px solid var(--line);
  background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 7px;
  color:var(--text-3);
  font-size:8px;
  letter-spacing:-.02em;
  letter-spacing:.02em;
  transition:color .15s;
}
.tabbar svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}

/* ───────── type ───────── */
.eyebrow{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-3);
}
h1.title{
  font-family:"Fraunces",Georgia,serif;
  font-variation-settings:"SOFT" 0,"WONK" 1,"opsz" 60;
  font-weight:600;
  font-size:34px;
  line-height:1.05;
  margin:4px 0 0;
  letter-spacing:-.015em;
  text-wrap:balance;
}
h1.title.money{font-variant-numeric:tabular-nums;font-size:40px}
h2.sec{
  font-size:12px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);
  margin:0 0 10px;
}
.hero{display:flex;flex-direction:column}
.hero-foot{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.hero-foot .big{
  font-family:"Fraunces",Georgia,serif;
  font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--accent);
}
.hero-foot .slash{color:var(--text-3);font-size:18px}
.hero-foot .lbl{font-size:13px;color:var(--text-2)}

/* ───────── bits ───────── */
.bar{display:block;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.stack{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);padding:12px 14px;min-height:54px}
.row-main{flex:1;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.row-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-title.done{color:var(--text-3);text-decoration:line-through}
.row-sub{font-size:11.5px;color:var(--text-3)}
.row-val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:14px;font-weight:500}

.check{
  width:26px;height:26px;flex:none;
  border:1.8px solid var(--line-2);
  border-radius:50%;
  display:grid;place-items:center;
  color:transparent;
  transition:background .15s,border-color .15s,color .15s,transform .1s;
}
.check:active{transform:scale(.9)}
.check svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .check.on{color:#0B0D12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .check.on{color:#0B0D12}}

.x{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:8px;color:var(--text-3)}
.x:hover{color:var(--bad);background:var(--surface-2)}
.x svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:12px;
  background:var(--accent);color:#fff;
  font-weight:600;font-size:15px;
  transition:filter .15s,transform .1s;
}
:root[data-theme="dark"] .btn{color:#0B0D12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0B0D12}}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.06)}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:10px}
.btn svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.field{
  width:100%;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  outline:none;
  transition:border-color .15s;
}
.field:focus{border-color:var(--accent)}
.field::placeholder{color:var(--text-3)}
textarea.field{resize:vertical;min-height:120px;line-height:1.6}

.seg{display:grid;grid-auto-flow:column;gap:4px;background:var(--surface-3);border-radius:11px;padding:4px}
.seg button{
  padding:8px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text-2);
  transition:background .15s,color .15s;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(20,24,35,.08)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 13px;border-radius:99px;
  border:1px solid var(--line-2);
  font-size:13px;color:var(--text-2);
  transition:background .15s,color .15s,border-color .15s;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0B0D12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0B0D12}}

.empty{
  text-align:center;padding:34px 20px;
  color:var(--text-3);font-size:13.5px;
  border:1px dashed var(--line-2);border-radius:var(--r);
  line-height:1.6;
}

.banner{
  display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--accent) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--text-2);
}
.banner b{color:var(--text)}
.banner button{color:var(--accent);font-weight:600;font-size:12.5px;white-space:nowrap}

/* ───────── heatmap ───────── */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .dow{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-align:center;
  color:var(--text-3);padding-bottom:2px;
}
.heat i{
  aspect-ratio:1;border-radius:5px;
  background:var(--surface-3);
  display:block;
}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 28%,var(--surface-3))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--surface-3))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 78%,var(--surface-3))}
.heat i[data-l="4"]{background:var(--accent)}
.heat i[data-today="1"]{box-shadow:0 0 0 1.8px var(--text-3)}

/* ───────── charts ───────── */
.cat-row{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:10px;padding:5px 0}
.cat-row .lbl{font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row .track{height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.cat-row .track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cat-row .amt{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-2)}
.cat-row.pasado .track i{background:var(--bad)}
.row-val.ing{color:var(--good)}
.saldo .saldo-fila{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:var(--text-2)}
.saldo .saldo-total{
  display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-size:14px;
}
.saldo .saldo-total b{font-family:"Fraunces",Georgia,serif;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.saldo.pos .saldo-total b{color:var(--good)}
.saldo.neg .saldo-total b{color:var(--bad)}
.cat-row.pasado .amt{color:var(--bad);font-weight:600}
.cat-row{grid-template-columns:66px 1fr auto auto}
.cat-row .vs{
  font-family:"IBM Plex Mono",monospace;font-size:10px;
  color:var(--text-3);min-width:38px;text-align:right;
}
.cat-row .vs.sube{color:var(--bad)}
.cat-row .vs.baja{color:var(--good)}

.presu .presu-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.presu .big{
  font-family:"Fraunces",Georgia,serif;font-size:27px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--accent);
}
.presu .lbl{font-size:12.5px;color:var(--text-2)}
.presu .bar{margin-top:11px}
.presu.justo .big{color:var(--m-gastos)}
.presu.pasado{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.presu.pasado .big{color:var(--bad)}
.presu.pasado .bar i{background:var(--bad)}

.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:128px}
.months .m{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.months .v{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.months .col{width:100%;background:color-mix(in srgb,var(--accent) 30%,var(--surface-3));border-radius:5px 5px 2px 2px;min-height:3px}
.months .m[data-now="1"] .col{background:var(--accent)}
.months .m[data-now="1"] .v{color:var(--accent);font-weight:600}
.months .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--text-3);text-transform:uppercase}

/* ───────── notes ───────── */
.notes{display:flex;flex-direction:column;gap:9px}
.note{
  text-align:left;width:100%;
  background:var(--surface-2);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;display:flex;flex-direction:column;gap:4px;
  transition:border-color .15s;
}
.note:hover{border-color:var(--line-2)}
.note .nt{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px}
.note .nt svg{width:12px;height:12px;flex:none;fill:currentColor;stroke:none;color:var(--accent)}
.note .np{font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.note .nd{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-3);letter-spacing:.04em}

/* ───────── gym ───────── */
.sess{background:var(--surface-2);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:13px}
.sess-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sess-head .nm{font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600}
.sess-head .tm{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.ex{border-top:1px solid var(--line);padding-top:11px;display:flex;flex-direction:column;gap:8px}
.ex-name{font-weight:600;font-size:14px}
.sets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.set{
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;
  background:var(--surface-3);border-radius:8px;padding:5px 9px;color:var(--text-2);
}
.set b{color:var(--text);font-weight:600}
.set.pr{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.setform{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:center}
.setform .field{padding:9px 11px;text-align:center;font-family:"IBM Plex Mono",monospace}

.set.warm{background:transparent;border:1px dashed var(--line-2);color:var(--text-3)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(60px + env(safe-area-inset-top));
  z-index:60;max-width:min(90%,400px);
  background:var(--accent);color:#fff;
  padding:12px 17px;border-radius:13px;
  font-size:13px;font-weight:500;line-height:1.4;text-align:center;
  box-shadow:0 8px 28px rgba(10,12,18,.35);
  animation:baja .24s cubic-bezier(.22,1,.36,1);
}
@keyframes baja{from{transform:translate(-50%,-140%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
:root[data-theme="dark"] .toast{color:#0B0D12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{color:#0B0D12}}
.ex-up{
  font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  padding:2px 7px;border-radius:99px;letter-spacing:.02em;
}

/* ─── pomodoro ─── */
.foco{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 18px 18px;display:flex;flex-direction:column;gap:15px;align-items:center;
}
.foco.vivo{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.foco-reloj{
  font-family:"IBM Plex Mono",monospace;font-size:62px;font-weight:500;
  font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;
  color:var(--text-3);
}
.foco.vivo .foco-reloj{color:var(--accent)}
.foco .bar{width:100%}
.foco-btns{display:flex;gap:8px;width:100%}
.foco.descanso.vivo{background:color-mix(in srgb,var(--m-habitos) 8%,var(--surface-2))}

/* ─── revision semanal ─── */
.sem-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sem-nav .mono{font-size:11.5px;color:var(--text-2)}
.sem-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.sem-dia{display:flex;flex-direction:column;align-items:center;gap:4px}
.sem-b{width:100%;height:56px;background:var(--surface-3);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.sem-b i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0}
.sem-s{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--text-2)}
.sem-k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--text-3)}
.tile .tl .vs{font-family:"IBM Plex Mono",monospace;font-size:9.5px;margin-left:3px}
.vs.sube-bien{color:var(--good)}
.vs.sube-mal{color:var(--bad)}
.corr-t{font-size:14px;line-height:1.45}
.corr-t b{font-weight:600;color:var(--accent)}

/* ─── nivel ─── */
.nivel{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 15px;
}

  font-family:"Fraunces",Georgia,serif;font-size:30px;font-weight:700;line-height:1;
  color:var(--accent);min-width:38px;text-align:center;font-variant-numeric:tabular-nums;
}
.nivel-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

.nivel-t .bar{margin-top:3px}
.nivel-x{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-3)}

/* ─── diario ─── */
.dia-fila{display:flex;align-items:center;gap:10px}

.dia-esc{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;flex:1}

}

:root[data-theme="dark"] .dia-esc button[aria-pressed="true"]{color:#0B0D12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dia-esc button[aria-pressed="true"]{color:#0B0D12}}
.dia-sueno{display:flex;align-items:center;gap:8px;flex:1}
.dia-sueno .field{width:84px;padding:8px;text-align:center}

/* ─── linea del diario ─── */
textarea.field.dia-linea{min-height:0;height:auto;padding:10px 12px;font-size:14px;line-height:1.45;resize:none}
.diario-lista{display:flex;flex-direction:column;gap:8px}
.diario-e{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 12px}
.diario-cab{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--text-3)}
.diario-cab .mono{font-size:10px}
.diario-e p{margin:3px 0 0;font-family:"Fraunces",Georgia,serif;font-size:14.5px;line-height:1.45}

/* ─── objetivos del ano ─── */
.meta{display:flex;flex-direction:column;gap:5px;padding:3px 0}
.meta-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.meta-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta-v{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta-v small{color:var(--text-3);font-size:10.5px}
.meta-bar{position:relative;display:block;height:6px;border-radius:99px;background:var(--surface-3)}
.meta-bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}
.meta-bar b{position:absolute;top:-3px;width:2px;height:12px;margin-left:-1px;border-radius:2px;background:var(--text-2)}
.meta.ok .meta-bar i{background:var(--good)}
.meta-t{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-3)}
.meta-t.detras{color:var(--bad)}
.meta.ok .meta-t{color:var(--good)}
.metas-lista{display:flex;flex-direction:column;gap:11px}
.meta-fila{display:flex;align-items:center;gap:8px}
.meta-fila .meta{flex:1;min-width:0}

/* ─── fechas ─── */
.hoy-linea small{color:var(--text-3);font-size:12px}
.hoy-linea.pronto .v{color:var(--accent);font-weight:600}
.fd-grid{display:grid;grid-template-columns:70px 1fr 84px;gap:8px;margin-top:8px}
.fd-grid .field{text-align:center;padding:12px 8px}

/* ─── habitos para dejar ─── */
.dejar-n{
  min-width:30px;height:30px;padding:0 6px;flex:none;border-radius:99px;
  display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);
}
.dejar-n.cayo{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}

/* ─── tareas: prioridad y pasos ─── */
.prio-tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:1px 5px;flex:none}
.prio-tag.p1{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.prio-tag.p3{color:var(--text-3);background:var(--surface-3)}
.task-sub{display:flex;align-items:center;gap:8px}
.task-sub .bar{flex:1;margin-top:0;max-width:140px}
.task-sub .mono{font-size:10.5px;color:var(--text-3)}

.prio-new .seg button{padding:6px;font-size:12.5px}

/* ─── la ultima vez ─── */
.ultima{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:8px 10px}
.ultima-t{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-3);letter-spacing:.02em}
.ultima .set{font-size:11px;padding:3px 7px}

/* ─── citas ─── */
.citas{display:flex;flex-direction:column;gap:8px}
.cita{
  border-left:3px solid var(--accent);background:var(--surface-2);
  border-radius:0 10px 10px 0;padding:10px 12px 6px;
}
.cita p{margin:0;font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:14.5px;line-height:1.5}
.cita-pie{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.cita-pie .mono{font-size:10px;color:var(--text-3)}

/* ─── etiquetas en notas ─── */
.tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tags::-webkit-scrollbar{display:none}
.tags .chip{flex:none;font-size:12.5px}
.note .ntags{display:flex;gap:5px;flex-wrap:wrap}
.note .ntag{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--accent)}

/* ─── pantalla Hoy ─── */
.hoy-bloque{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;display:flex;flex-direction:column;gap:9px;
}
.hoy-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hoy-cab h2{
  margin:0;font-size:12px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-3);
}
.hoy-cab button{
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--accent);
  letter-spacing:.04em;white-space:nowrap;
}
.hoy-linea{display:flex;align-items:center;gap:10px;font-size:14px}
.hoy-linea .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hoy-linea .v{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.hoy-vacio{font-size:13px;color:var(--text-3)}
.hoy-grande{
  font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:600;
  font-variant-numeric:tabular-nums;
}

/* ─── cultura ─── */
.cul-prog{display:grid;grid-template-columns:1fr auto;gap:4px 9px;align-items:center;margin-top:6px}
.cul-prog .bar{margin-top:0;grid-column:1}
.cul-prog .pc{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.score{
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.score small{color:var(--text-3);font-weight:400;font-size:10px}
.chips.notas{gap:6px}
.chips.notas .chip{min-width:38px;text-align:center;padding:8px 0;font-family:"IBM Plex Mono",monospace}
.cul-year{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  color:var(--text-3);margin:14px 0 7px;
}
.cul-year:first-child{margin-top:0}

/* ─── tabla de series de la sesión ─── */
.strows{display:flex;flex-direction:column;gap:5px}
.sthead,.strow{display:grid;grid-template-columns:16px 1fr 1fr 28px 30px 24px;gap:4px;align-items:center}
.sthead span{font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);text-align:center}
.strow .field{padding:9px 3px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13.5px}
.strow .field::placeholder{color:var(--text-3);opacity:.55}
.st-n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--text-3);text-align:center;font-variant-numeric:tabular-nums}

.st-tipo{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  height:32px;border-radius:8px;border:1px solid var(--line-2);color:var(--text-3);
  display:grid;place-items:center;
}
.st-tipo[data-t="C"]{color:var(--m-gastos);border-color:color-mix(in srgb,var(--m-gastos) 45%,transparent);background:color-mix(in srgb,var(--m-gastos) 12%,transparent)}
.st-tipo[data-t="T"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

.st-go{
  height:32px;border-radius:8px;border:1px solid var(--line-2);
  display:grid;place-items:center;color:var(--text-3);
  transition:background .15s,color .15s,border-color .15s;
}
.st-go svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st-go:hover{border-color:var(--accent);color:var(--accent)}
.strow.done .st-go{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .strow.done .st-go{color:#0B0D12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .strow.done .st-go{color:#0B0D12}}
.strow.done .field{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--text);font-weight:600}
.strow.done .st-n{color:var(--accent);font-weight:600}
.strow .x{width:24px;height:24px}
.strow .x svg{width:12px;height:12px}

/* Serie planificada pero todavía no hecha: hueco a rellenar, no dato. */
.set.todo{background:transparent;border:1px dashed var(--line-2);color:var(--text-3);opacity:.75}
.set.todo b{color:var(--text-2);font-weight:500}
.set.todo.warm{border-style:dotted}
button.set{cursor:pointer;transition:border-color .15s,background .15s}
button.set:hover{border-color:var(--accent)}
/* El nombre y sus datos no caben en la misma linea en un movil estrecho:
   el nombre arriba, los objetivos debajo. */
.ex-head{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.ex-meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--text-3);letter-spacing:.03em}

.rest{
  display:grid;gap:7px;
  background:color-mix(in srgb,var(--accent) 12%,var(--surface-2));
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  border-radius:12px;padding:12px 14px;width:100%;text-align:left;
}
.rest-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rest-top .rv{font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.rest-top .rl{font-size:11.5px;color:var(--text-2)}
.rest .bar{margin-top:0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;display:flex;flex-direction:column;gap:1px}
.tile .tv{font-family:"Fraunces",Georgia,serif;font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .tl{font-size:11px;color:var(--text-3)}

.goal{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .gn{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .gv{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.goal .bar{grid-column:1/-1;margin-top:3px}
.goal.ok .gv{color:var(--accent);font-weight:600}

.ach{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach .an{flex:1;min-width:0}
.ach .at{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ach .av{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:4px;flex:none}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--surface-3);display:block}
.pips i[data-on="1"]{background:var(--accent)}

.prog{display:flex;align-items:flex-end;gap:5px;height:112px}
.prog .p{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%;min-width:0}
.prog .pv{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--text-3);font-variant-numeric:tabular-nums}
.prog .pc{width:100%;background:color-mix(in srgb,var(--accent) 30%,var(--surface-3));border-radius:4px 4px 2px 2px;min-height:3px}
.prog .p:last-child .pc{background:var(--accent)}
.prog .p:last-child .pv{color:var(--accent);font-weight:600}
.prog .pd{font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--text-3)}

.rt-row{display:flex;flex-direction:column;gap:7px;padding:11px 0;border-bottom:1px solid var(--line)}
.rm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rm-c{
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
}
.rm-n{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.rm-v{font-family:"Fraunces",Georgia,serif;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.rm-d{font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--text-3);text-align:center}
.rt-row:last-child{border-bottom:0}
.rt-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rt-head b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-sub{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);margin-bottom:4px}
.rt-name{
  flex:1;min-width:0;text-align:left;
  font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.rt-name > span{
  font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:400;
  color:var(--text-3);border:1px solid var(--line-2);border-radius:99px;
  padding:2px 7px;flex:none;text-transform:uppercase;letter-spacing:.05em;
}
.rt-name:hover > span{color:var(--accent);border-color:var(--accent)}
.eq-tag{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:500;
  color:var(--text-3);background:var(--surface-3);
  padding:2px 7px;border-radius:99px;white-space:nowrap;
}
.rt-sub .field{width:68px;padding:7px 4px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13px}

/* Una fila por serie: numero, reps, kilos, calentamiento y quitar. */
.rt-set,.rt-cols{display:grid;grid-template-columns:20px 1fr 1fr 38px 26px;gap:6px;align-items:center}
.rt-set{margin-bottom:6px}
.rt-set .field{padding:8px 4px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13px}
.rt-cols span{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);text-align:center}
.rt-n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--text-3);text-align:center;font-variant-numeric:tabular-nums}
.rt-n.cal{color:var(--accent);font-weight:600}
.chip.mini{padding:7px 0;font-size:10px;text-align:center;border-radius:8px;letter-spacing:.03em}
.rt-set .x{width:26px;height:26px}
.rt-set .x svg{width:13px;height:13px}

/* ───────── sheet ───────── */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
/* El panel cuelga fuera de .app, asi que no hereda el acento del modulo:
   se lo damos aparte o siempre saldria con el color de Habitos. */
.sheet-wrap[data-mod="hoy"]{--accent:var(--m-habitos)}
.sheet-wrap[data-mod="habitos"]{--accent:var(--m-habitos)}
.sheet-wrap[data-mod="tareas"]{--accent:var(--m-tareas)}
.sheet-wrap[data-mod="gastos"]{--accent:var(--m-gastos)}
.sheet-wrap[data-mod="notas"]{--accent:var(--m-notas)}
.sheet-wrap[data-mod="gym"]{--accent:var(--m-gym)}
.sheet-wrap[data-mod="cultura"]{--accent:var(--m-cultura)}
.sheet-wrap[data-mod="foco"]{--accent:var(--m-foco)}
.sheet-back{position:absolute;inset:0;background:rgba(10,12,18,.5);backdrop-filter:blur(3px);animation:fade .2s ease}
.sheet{
  position:relative;
  width:min(100%,440px);
  max-height:88dvh;
  background:var(--surface);
  border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;
  animation:up .26s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -10px 40px rgba(10,12,18,.25);
}

  .sheet-wrap{align-items:center}
  .sheet{border-radius:20px;max-height:min(760px,86dvh);animation:pop .22s cubic-bezier(.22,1,.36,1)}
}
.sheet-head{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
  padding:17px 18px 13px;border-bottom:1px solid var(--line);
}
.sheet-head h3{margin:0;font-family:"Fraunces",Georgia,serif;font-size:21px;font-weight:600}
.sheet-body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.lbl-s{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);display:block;margin-bottom:7px}
.picker{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px}
.picker button{background:var(--surface);padding:11px 14px;text-align:left;font-size:14px}
.picker button:hover{background:var(--surface-2)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--text-2)}
.hint{font-size:12.5px;color:var(--text-3);line-height:1.6}
.hint b{color:var(--text-2)}
.hint ol{margin:8px 0 0;padding-left:19px;display:flex;flex-direction:column;gap:5px}

@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

<div class="app" id="app" data-mod="habitos">

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(!raw) return seed();
    const s = JSON.parse(raw);
    if(!s || !s.habits) return seed();
    s.gym = s.gym || {};
    s.gym.exercises = s.gym.exercises || EJERCICIOS.slice();
    /* Se añaden al catálogo los ejercicios conocidos que falten. Solo suma:
       nunca quita los que hayas escrito tú. */
    Object.keys(MATERIAL).forEach(function(n){
      if(s.gym.exercises.indexOf(n) < 0) s.gym.exercises.push(n);
    });
    s.gym.sessions  = s.gym.sessions  || [];
    s.gym.routines  = s.gym.routines  || [];
    s.gym.goals     = s.gym.goals     || [];
    s.gym.weights   = s.gym.weights   || [];
    s.gym.medidas   = s.gym.medidas   || [];
    s.gym.cardio    = s.gym.cardio    || [];
    s.gym.profile   = s.gym.profile   || {};
    if(s.gym.active===undefined) s.gym.active = null;
    if(!s.gym.restDefault) s.gym.restDefault = 90;
    if(!s.gym.stepKg) s.gym.stepKg = 2.5;
    if(!s.gym.deloadCada) s.gym.deloadCada = 5;
    if(s.gym.deloadDesde === undefined) s.gym.deloadDesde = "";
    if(s.gym.deloadUltima === undefined) s.gym.deloadUltima = "";
    migrateRoutines(s.gym);
    s.gymTab = s.gymTab || "sesion";
    s.culTab = s.culTab || "libros";
    s.diario = s.diario || {};
    s.incomes = s.incomes || [];
    s.metas  = s.metas  || [];
    s.fechas = s.fechas || [];
    if(s.xpNivel === undefined) s.xpNivel = 0;
    s.reloj = s.reloj || {atajoTemp:"", atajoAlarma:"", pomodoro:true, recordatorios:true, gym:false};
    s.foco = s.foco || {cfg:{trabajo:25,corto:5,largo:15,ciclos:4}, fase:"trabajo", fin:0, corriendo:false, ciclo:0, dia:"", pomos:0, minutos:0, atajo:""};
    s.foco.cfg = s.foco.cfg || {trabajo:25,corto:5,largo:15,ciclos:4};
    /* El recuento del dia se reinicia solo al cambiar de dia. */
    /* Historico por dia: sin el, la revision semanal y las correlaciones no
       sabrian cuanto trabajaste mas alla de hoy. */
    s.foco.hist = s.foco.hist || {};
    if(s.foco.dia && s.foco.pomos && !s.foco.hist[s.foco.dia])
      s.foco.hist[s.foco.dia] = {bloques:s.foco.pomos, minutos:s.foco.minutos};
    if(s.foco.dia !== today()){ s.foco.dia = today(); s.foco.pomos = 0; s.foco.minutos = 0; }
    s.avisos = s.avisos || [];
    /* La lista de la compra antigua se convierte en inventario: lo que estaba
       apuntado era lo que faltaba, asi que entra como "falta". */
    if(!Array.isArray(s.inv)){
      s.inv = (s.tasks||[]).filter(function(t){ return t.list === "compras"; })
        .map(function(t){ return {id:t.id, name:t.text, falta:!t.done}; });
      s.tasks = (s.tasks||[]).filter(function(t){ return t.list !== "compras"; });
    }
    if(s.list === "compras") s.list = "compra";
    s.budget = s.budget || {total:0, cats:{}};
    s.budget.cats = s.budget.cats || {};
    s.fixed = s.fixed || [];
    s.cultura = s.cultura || [];
    /* La pestaña de IA se retiro: si quedaba una clave guardada, se borra.
       Un secreto almacenado para algo que ya no existe no pinta nada. */
    delete s.ia;
    /* La configuración del servidor pasó a ser una sola, compartida por los
       avisos y la sincronización: antes vivía duplicada dentro de push. */
    s.push = s.push || {on:false};
    s.srv  = s.srv  || {url:"", token:""};
    if(!s.srv.url && s.push.url){ s.srv.url = s.push.url; s.srv.token = s.push.token || ""; }
    delete s.push.url; delete s.push.token;
    s.sync = s.sync || {on:false, rev:0, at:null};
    s.changedAt = s.changedAt || new Date().toISOString();
    s.notes = s.notes || []; s.tasks = s.tasks || []; s.expenses = s.expenses || [];
    /* Las tareas de antes pasan a prioridad media y sin pasos. */
    s.tasks.forEach(function(t){
      if(t.prio === undefined) t.prio = 2;
      if(!Array.isArray(t.subs)) t.subs = [];
    });
    /* Los habitos de antes eran todos si/no diarios: se quedan igual. */
    (s.habits||[]).forEach(function(h){
      if(h.tipo === undefined)     h.tipo = "si";
      if(h.unidad === undefined)   h.unidad = "";
      if(h.objetivo === undefined) h.objetivo = 0;
      if(h.semanal === undefined)  h.semanal = 0;
      if(h.modo === undefined)     h.modo = "hacer";
    });
    return s;
  }catch(e){ return seed(); }
}

/* Los gastos fijos se apuntan solos el dia del mes que les toca. Se marcan con
   el id del fijo que los genero, para no duplicarlos si abres la app cinco
   veces el mismo dia. */
function aplicarFijos(){
  S.incomes = S.incomes || [];
  const hoy = new Date();
  const ym = hoy.getFullYear() + "-" + pad(hoy.getMonth()+1);
  let nuevos = 0;
  (S.fixed||[]).forEach(function(f){
    const dia = Math.min(Math.max(1, Number(f.dia)||1), 28);
    if(dia > hoy.getDate()) return;                 /* todavia no le toca */
    const ya = S.expenses.some(function(e){
      return e.fijo === f.id && e.date.slice(0,7) === ym;
    });
    const destino = f.tipo === "ingreso" ? S.incomes : S.expenses;
    const yaIng = f.tipo === "ingreso" && (S.incomes||[]).some(function(e){
      return e.fijo === f.id && e.date.slice(0,7) === ym;
    });
    if(ya || yaIng) return;
    destino.push({
      id:uid(), amount:Number(f.amount)||0, cat:f.cat || "Otros",
      note:f.note || (f.tipo === "ingreso" ? "Ingreso fijo" : "Gasto fijo"),
      date:ym + "-" + pad(dia), fijo:f.id
    });
    nuevos++;
  });
  return nuevos;
}

/* ══════════ cálculos ══════════ */
/* Un dia cuenta como cumplido segun el tipo de habito: los de cantidad piden
   llegar al objetivo; los de si/no, con marcarlos basta. */
function cumplido(h, k){
  /* Los habitos para dejar van al reves: el dia cuenta si NO has caido,
     desde que empezaste a dejarlo y hasta hoy. */
  if(h.modo === "dejar") return !!h.desde && k >= h.desde && k <= today() && !h.days[k];
  const v = h.days[k];
  if(!v) return false;
  if(h.tipo === "cantidad" && h.objetivo > 0) return Number(v) >= Number(h.objetivo);
  return true;
}
const valorDia = (h,k) => Number(h.days[k]) || 0;

/* Lunes de la semana a la que pertenece una fecha. */
function lunesDe(d){
  const x = new Date(d);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  x.setHours(0,0,0,0);
  return x;
}
/* Dias cumplidos en la semana que empieza en ese lunes. */
function diasSemana(h, lunes){
  let n = 0;
  for(let i=0;i<7;i++){
    const d = new Date(lunes); d.setDate(lunes.getDate()+i);
    if(cumplido(h, key(d))) n++;
  }
  return n;
}
/* Semana en curso: cuantos llevas y cuantos te piden. */
function semanaActual(h){
  return {hechos: diasSemana(h, lunesDe(new Date())), meta: Number(h.semanal) || 0};
}

/* Racha. Con meta semanal se cuenta en SEMANAS, y la semana en curso no la
   rompe hasta que acaba: si vas 3 de 5 y es miercoles, todavia no has fallado.
   Sin meta semanal, dias seguidos como siempre. */
const diasEntre = (a,b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
/* Dias limpios seguidos desde la ultima caida (o desde que empezaste). */
function rachaDejar(h){
  if(!h.desde || h.days[today()]) return 0;
  const ult = Object.keys(h.days).filter(function(k){ return k <= today(); }).sort().pop();
  let ini = h.desde;
  if(ult){ const sig = diaSiguiente(ult); if(sig > ini) ini = sig; }
  return Math.max(0, diasEntre(ini, today()) + 1);
}
function mejorRachaDejar(h){
  if(!h.desde) return 0;
  const caidas = Object.keys(h.days).filter(function(k){ return k >= h.desde && k <= today(); }).sort();
  let mejor = 0, ini = h.desde;
  caidas.forEach(function(c){
    mejor = Math.max(mejor, diasEntre(ini, c));
    ini = diaSiguiente(c);
  });
  if(!h.days[today()]) mejor = Math.max(mejor, diasEntre(ini, today()) + 1);
  return mejor;
}
function streak(h){
  if(h.modo === "dejar") return rachaDejar(h);
  if(Number(h.semanal) > 0){
    const meta = Number(h.semanal);
    let n = 0;
    let lunes = lunesDe(new Date());
    /* La semana en curso solo suma si ya has llegado a la meta. */
    if(diasSemana(h, lunes) >= meta) n++;
    lunes.setDate(lunes.getDate()-7);
    while(diasSemana(h, lunes) >= meta){
      n++;
      lunes = new Date(lunes); lunes.setDate(lunes.getDate()-7);
    }
    return n;
  }
  const d = new Date();
  if(!cumplido(h, key(d))) d.setDate(d.getDate()-1);
  let n = 0;
  while(cumplido(h, key(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
/* Texto de la racha, que cambia de unidad segun el tipo. */
function rachaTexto(h){
  const st = streak(h);
  if(h.modo === "dejar"){
    if(h.days[today()]) return "has caído hoy · mañana vuelves a empezar";
    return st === 1 ? "1 día sin caer" : st + " días sin caer";
  }
  if(Number(h.semanal) > 0){
    const sm = semanaActual(h);
    const base = sm.hechos + " de " + sm.meta + " esta semana";
    if(!st) return base;
    return base + " \u00b7 " + st + (st===1 ? " semana seguida" : " semanas seguidas");
  }
  if(!st) return "sin racha";
  return st===1 ? "1 d\u00eda seguido" : st + " d\u00edas seguidos";
}
function doneToday(){ return S.habits.filter(h=>cumplido(h, today())).length; }
function monthIncomes(off){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-(off||0));
  const y=d.getFullYear(), m=d.getMonth();
  return (S.incomes||[]).filter(e=>{ const x=parseKey(e.date); return x.getFullYear()===y && x.getMonth()===m; });
}
function monthExpenses(off){

  const y=d.getFullYear(), m=d.getMonth();

const sum = a=>a.reduce((t,e)=>t+e.amount,0);
/* ─── gimnasio: métricas ───
   Las series de calentamiento no cuentan para récords ni volumen,
   igual que en FitPals: son trabajo de aproximación, no rendimiento. */
const isWarm = s=>!!s.warmup;
/* Una serie "todo" está planificada por la rutina pero aún no hecha: se ve en
   pantalla como hueco a rellenar, y no cuenta para nada hasta que la registras. */
const isTodo = s=>!!s.todo;
const hechas = en=>(en.sets||[]).filter(s=>!isTodo(s));
function allSessions(){ return S.gym.sessions.concat(S.gym.active?[S.gym.active]:[]); }

/* Las repeticiones de una rutina admiten un número ("8") o un intervalo ("6-8"). */
function repsRange(v){
  const s = String(v==null?"":v).trim();
  const m = s.match(/^(\d+)\s*[-–a]\s*(\d+)$/);
  if(m){
    const a = +m[1], b = +m[2];
    const lo = Math.min(a,b), hi = Math.max(a,b);
    return {min:lo, max:hi, label:lo===hi ? String(lo) : lo+"-"+hi};
  }
  const n = parseInt(s,10);
  if(n>0) return {min:n, max:n, label:String(n)};
  return {min:0, max:0, label:""};
}

/* Cada ejercicio de una rutina guarda su lista de series, una a una, con sus
   propias reps y kilos. Las rutinas viejas guardaban solo "N series × R reps ×
   K kg" y se convierten a esa forma al abrirlas. */
function routineSets(e){
  if(Array.isArray(e.sets) && e.sets.length) return e.sets;
  const out = [];
  const r = repsRange(e.targetReps).label || "10";
  const kg = Number(e.targetWeight)||0;
  const w = Math.max(0, Number(e.warmupSets)||0);
  for(let i=0;i<w;i++) out.push({reps:r, kg: kg ? Math.round(kg*0.5/2.5)*2.5 : 0, warmup:true});
  const n = Math.max(1, Number(e.targetSets)||1);
  for(let i=0;i<n;i++) out.push({reps:r, kg:kg});
  return out;
}
function migrateRoutines(gym){
  (gym.routines||[]).forEach(r=>{
    (r.exercises||[]).forEach(e=>{
      if(!Array.isArray(e.sets) || !e.sets.length){
        e.sets = routineSets(e);
        delete e.targetSets; delete e.targetReps; delete e.targetWeight; delete e.warmupSets;
      }
      /* Sin dias asignados la rutina se comporta como hasta ahora. */
      if(!Array.isArray(r.dias)) r.dias = [];
      /* El calentamiento no necesita el mismo descanso que una serie pesada. */
      if(e.restWarmup===undefined) e.restWarmup = 60;
      /* El material se deduce del nombre cuando se conoce; si no, se deja sin
         poner en vez de inventarlo. */
      if(e.eq===undefined) e.eq = MATERIAL[e.name] || "";
    });
  });
}
const restOf = (e,warm)=> warm
  ? (Number(e.restWarmup)||60)
  : (Number(e.restSeconds)||90);
/* Rutinas asignadas al dia de la semana que se le pase (1=lunes ... 7=domingo).
   Una rutina sin dias asignados no sale nunca por aqui: se busca por atraso. */
function rutinasDelDia(dia){
  return S.gym.routines.filter(function(r){
    return Array.isArray(r.dias) && r.dias.indexOf(dia) >= 0;
  });
}
const rutinasDeHoy = () => rutinasDelDia(diaSemanaHoy());
/* Si ya la hiciste hoy, no tiene sentido decirte que te toca. */
function rutinaHechaHoy(nombre){
  return S.gym.sessions.some(function(x){ return x.routine === nombre && x.date === today(); });
}
const textoDiasSemana = r => (Array.isArray(r.dias) && r.dias.length)
  ? r.dias.slice().sort().map(function(d){ return DIAS_CORTOS[d-1]; }).join("")
  : "";

/* Dias desde la ultima vez que se hizo esa rutina. null si nunca. */
function diasDesdeRutina(nombre){
  const hechas = S.gym.sessions.filter(function(x){ return x.routine === nombre; });
  if(!hechas.length) return null;
  const ult = hechas.reduce(function(a,b){ return a.start > b.start ? a : b; });
  return Math.round((parseKey(today()) - parseKey(ult.date)) / 86400000);
}
function textoDias(n){
  if(n === null) return "sin hacer nunca";
  if(n <= 0) return "hoy";
  if(n === 1) return "ayer";
  return "hace " + n + " dias";
}
function routineCount(r){
  let work = 0, warm = 0;
  (r.exercises||[]).forEach(e=>routineSets(e).forEach(s=>{ if(s.warmup) warm++; else work++; }));
  return {work:work, warm:warm};
}

const fmtKg = v => String(Math.round(v*100)/100).replace(".", ",");

/* ─── descarga (deload) ───
   La sobrecarga sube sin freno hasta que te estancas o te lesionas. Cada N
   semanas toca una semana al 60 % del peso: los pesos de las rutinas bajan
   solos durante esa semana y vuelven solos al acabar. */
const DESCARGA_FACTOR = 0.6;

function descargaActiva(){
  const d = S.gym.deloadDesde;
  if(!d) return false;
  return Math.round((parseKey(today()) - parseKey(d)) / 86400000) < 7;
}
/* Semanas entrenando desde la ultima descarga (o desde el primer entreno). */
function semanasDesdeDescarga(){
  const ref = S.gym.deloadUltima
    || (S.gym.sessions.length
        ? S.gym.sessions.reduce(function(a,b){ return a.start < b.start ? a : b; }).date
        : "");
  if(!ref) return 0;
  return Math.floor(Math.round((parseKey(today()) - parseKey(ref)) / 86400000) / 7);
}
const tocaDescarga = () => !descargaActiva() && semanasDesdeDescarga() >= (Number(S.gym.deloadCada)||5);
/* Cierra la descarga cuando su semana ha pasado. */
function cerrarDescarga(){
  if(S.gym.deloadDesde && !descargaActiva()){
    S.gym.deloadUltima = S.gym.deloadDesde;
    S.gym.deloadDesde = "";
    return true;
  }
  return false;
}
const kgDescarga = kg => Math.round(kg * DESCARGA_FACTOR / 2.5) * 2.5;

/* ─── sobrecarga progresiva ───
   Progresion doble: mientras no llegues al tope del intervalo, repites peso; en
   cuanto lo clavas, subes. Aqui, al registrar una serie de trabajo con las reps
   del tope, sube el peso de las series que queden por hacer y lo deja escrito en
   la rutina, para que el proximo entreno arranque ya con el peso nuevo.

   Sube CADA vez que clavas el tope, sin limite por sesion: si lo consigues en
   varias series seguidas es que el peso de partida estaba corto, y la rutina debe
   reflejarlo entero. Cada subida se anota en la serie que la provoco, asi que
   desmarcarla la deshace y un toque accidental no cambia la rutina para siempre. */
function moverPesos(en, a, j, delta){
  let n = 0;
  en.sets.forEach((x,k)=>{
    if(k<=j || x.warmup || !isTodo(x)) return;
    x.kg = Math.max(0, Math.round((((Number(x.kg)||0) + delta))*100)/100);
    n++;
  });
  let enRutina = false;
  const rut = S.gym.routines.filter(x=>x.id===a.routineId || x.name===a.routine)[0];
  if(rut){
    const ex = (rut.exercises||[]).filter(x=>x.name===en.ex)[0];
    if(ex && Array.isArray(ex.sets)){
      ex.sets.forEach(x=>{
        if(x.warmup || !Number(x.kg)) return;   /* el calentamiento se queda donde esta */
        x.kg = Math.max(0, Math.round((((Number(x.kg)||0) + delta))*100)/100);
      });
      enRutina = true;
    }
  }
  if(en.target) en.target.kg = Math.max(0, Math.round(((Number(en.target.kg)||0) + delta)*100)/100);
  return {n:n, rutina:enRutina};
}

function aplicarSobrecarga(a, en, s, j){
  if(s.warmup) return;
  if(descargaActiva()) return;      /* en descarga no se sube nada */
  const r = repsRange(s.tReps);
  if(!r.max || !s.reps || s.reps < r.max) return;
  if(!Number(s.kg)) return;        /* peso corporal: no se sube solo */
  const paso = Number(S.gym.stepKg) || 2.5;
  const res = moverPesos(en, a, j, paso);
  s.bump = paso;                   /* anotado en la serie, para poder deshacerlo */
  en.bumped = Math.round((((en.bumped||0) + paso))*100)/100;
  toast(s.reps + " reps: tope del intervalo. Subes " + fmtKg(paso) + " kg" +
        (en.bumped > paso ? " (" + fmtKg(en.bumped) + " kg hoy)" : "") +
        (res.rutina ? ". Rutina actualizada." : "."));
}
function revertirSobrecarga(a, en, j){
  const s = en.sets[j];
  if(!s || !s.bump) return;
  moverPesos(en, a, j, -s.bump);
  en.bumped = Math.round((((en.bumped||0) - s.bump))*100)/100;
  if(en.bumped <= 0) delete en.bumped;
  delete s.bump;
}

/* Series que la rutina deja preparadas en pantalla, en su orden. */
function planSets(e){
  /* El peso viene ya puesto en la casilla; las reps se dejan vacias con el
     objetivo como pista, que es lo que de verdad varia serie a serie. */
  const baja = descargaActiva();
  return routineSets(e).map(s=>({
    plan:true, todo:true,
    warmup:!!s.warmup,
    kg:(baja && !s.warmup) ? kgDescarga(Number(s.kg)||0) : (Number(s.kg)||0),
    tReps:repsRange(s.reps).label,
    tRest:restOf(e, !!s.warmup)
  }));
}
function routineTarget(e){
  const list = routineSets(e);
  const work = list.filter(s=>!s.warmup);
  return {
    sets: work.length,
    warm: list.length-work.length,
    kg: work.length ? Number(work[0].kg)||0 : 0,
    reps: work.length ? work[work.length-1].reps : "",
    rest: Number(e.restSeconds)||90,
    restWarm: Number(e.restWarmup)||60
  };
}

function records(){
  const r = {};
  allSessions().forEach(s=>(s.entries||[]).forEach(en=>en.sets.forEach(st=>{
    if(isWarm(st) || isTodo(st)) return;
    if(!r[en.ex] || st.kg>r[en.ex].kg) r[en.ex] = {kg:st.kg, reps:st.reps};
  })));
  return r;
}
/* 1RM estimado por la formula de Epley: peso x (1 + reps/30). Sirve para
   comparar series de rangos distintos, que es lo que cuesta a ojo. */
function unRM(kg, reps){
  if(!kg || !reps) return 0;
  return Math.round(kg * (1 + reps/30) * 10) / 10;
}
function mejor1RM(ex){
  let mejor = 0;
  allSessions().forEach(function(s){
    (s.entries||[]).forEach(function(en){
      if(en.ex !== ex) return;
      en.sets.forEach(function(st){
        if(isWarm(st) || isTodo(st)) return;
        const v = unRM(st.kg, st.reps);
        if(v > mejor) mejor = v;
      });
    });
  });
  return mejor;
}
/* Mejor peso levantado para al menos N repeticiones. Tu record a 6 reps y el de
   12 son cosas distintas, y un unico record los mezcla. */
const RM_REPS = [1, 3, 5, 10];
function recordsPorReps(ex){
  const out = {};
  RM_REPS.forEach(function(n){ out[n] = null; });
  allSessions().forEach(function(s){
    (s.entries||[]).forEach(function(en){
      if(en.ex !== ex) return;
      en.sets.forEach(function(st){
        if(isWarm(st) || isTodo(st) || !st.kg || !st.reps) return;
        RM_REPS.forEach(function(n){
          if(st.reps >= n && (!out[n] || st.kg > out[n].kg))
            out[n] = {kg:st.kg, reps:st.reps, date:s.date};
        });
      });
    });
  });
  return out;
}

/* Todas las veces que hiciste un ejercicio, de lo mas reciente a lo mas viejo. */
function historialEjercicio(ex){
  const out = [];
  S.gym.sessions.slice().sort(function(a,b){ return b.start - a.start; }).forEach(function(s){
    (s.entries||[]).forEach(function(en){
      if(en.ex !== ex) return;
      const series = en.sets.filter(function(x){ return !isTodo(x); });
      if(series.length) out.push({fecha:s.date, sesion:s.name, sets:series});
    });
  });
  return out;
}
function volumeOf(s){
  let t = 0;
  (s.entries||[]).forEach(en=>en.sets.forEach(st=>{
    if(isWarm(st) || isTodo(st)) return;
    t += (st.kg||0)*(st.reps||0);
  }));
  return t;
}
function totalVolume(){ return S.gym.sessions.reduce((t,s)=>t+volumeOf(s),0); }
function loggedExercises(){
  const set = {};
  S.gym.sessions.forEach(s=>(s.entries||[]).forEach(en=>{ if(hechas(en).length) set[en.ex]=1; }));
  return Object.keys(set);
}
function mondayIndex(dateStr){
  const d = parseKey(dateStr);
  const off = (d.getDay()+6)%7;
  const mon = new Date(d); mon.setDate(d.getDate()-off);
  return Math.floor(mon.getTime()/(7*86400000));
}
function weekStreak(){
  const weeks = {};
  S.gym.sessions.forEach(s=>{ weeks[mondayIndex(s.date)] = 1; });
  const idx = Object.keys(weeks).map(Number).sort((a,b)=>a-b);
  let longest = 0, cur = 0, prev = null;
  idx.forEach(i=>{ cur = (prev!==null && i===prev+1) ? cur+1 : 1; if(cur>longest) longest = cur; prev = i; });
  return longest;
}
function goalsDone(){
  const prs = records();
  return S.gym.goals.filter(g=>prs[g.exercise] && prs[g.exercise].kg>=g.targetWeight).length;
}
function warmupSessions(){
  return S.gym.sessions.filter(s=>(s.entries||[]).some(en=>(en.sets||[]).some(isWarm))).length;
}

/* ══════════ Reloj del iPhone, via Atajos ══════════
   Lanza un atajo del usuario pasandole texto. iOS sale de Bitacora para abrir
   Atajos un instante: no hay forma de que vuelva sola a la app instalada (abrir
   su direccion iria a Safari, que es otra copia con otros datos). */
function lanzarAtajo(nombre, texto){
  if(!nombre) return false;
  const url = "shortcuts://run-shortcut?name=" + encodeURIComponent(nombre) +
    (texto !== undefined ? "&input=text&text=" + encodeURIComponent(texto) : "");
  persist();                              /* por si iOS descarga la pagina */
  setTimeout(function(){ location.href = url; }, 80);
  return true;
}
/* Si hay que usar el temporizador del sistema en este sitio. */
const relojTemp = donde => !!(S.reloj && S.reloj[donde] && S.reloj.atajoTemp);
const relojAlarma = () => !!(S.reloj && S.reloj.recordatorios && S.reloj.atajoAlarma);

/* ══════════ cronómetro de descanso ══════════ */
let rest = null, restInt = null, audioCtx = null, keepAlive = null, alarmNodes = [];
const fmtClock = ms=>{ const s = Math.ceil(ms/1000); return Math.floor(s/60)+":"+pad(s%60); };

function unlockAudio(){
  /* El navegador solo deja crear sonido a partir de un toque real del usuario,
     así que el contexto se crea al pulsar "Añadir serie", no antes. */
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!audioCtx && AC) audioCtx = new AC();
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  }catch(e){}
  return audioCtx;
}

/* Ruido a volumen inaudible, en bucle, mientras dura el descanso.
   iOS solo mantiene vivo el audio de una web si de verdad está sonando algo:
   este murmullo es lo que hace que el aviso suene con la pantalla apagada
   o con otra app delante. Se apaga al terminar el descanso. */
function startKeepAlive(){
  if(!audioCtx || keepAlive) return;
  try{
    const len = Math.floor(audioCtx.sampleRate);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * 0.00012;
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    src.connect(audioCtx.destination);
    src.start();
    keepAlive = src;
  }catch(e){}
}
function stopKeepAlive(){
  if(!keepAlive) return;
  try{ keepAlive.stop(); keepAlive.disconnect(); }catch(e){}
  keepAlive = null;
}

/* El aviso NO se lanza con un temporizador de JavaScript, porque iOS congela el
   JavaScript en segundo plano. Se programa dentro del propio grafo de audio, en
   un instante exacto: lo reproduce el hilo de audio del sistema, que sigue
   corriendo. Por eso suena aunque la app esté cerrada en segundo plano, y por eso
   el modo No molestar no lo silencia: para iOS esto es reproducción de audio,
   no una notificación. */
function scheduleAlarm(secs){
  const ac = audioCtx; if(!ac) return;
  clearAlarm();
  const t0 = ac.currentTime + secs;
  for(let r=0;r<8;r++){
    const at = t0 + r*0.42;
    try{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "square";
      o.frequency.value = (r%2) ? 1245 : 932;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(0.55, at+0.012);
      g.gain.setValueAtTime(0.55, at+0.17);
      g.gain.exponentialRampToValueAtTime(0.0001, at+0.31);
      o.connect(g); g.connect(ac.destination);
      o.start(at); o.stop(at+0.33);
      alarmNodes.push(o);
    }catch(e){}
  }
}
function clearAlarm(){
  alarmNodes.forEach(o=>{ try{ o.stop(); }catch(e){} try{ o.disconnect(); }catch(e){} });
  alarmNodes = [];
}
function beep(){ /* el aviso ya va programado en el grafo de audio */ }
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){} }
function notify(title, body){
  try{
    if(window.Notification && Notification.permission==="granted") new Notification(title,{body:body,tag:"rest"});
  }catch(e){}
}
function askNotif(){
  try{
    if(window.Notification && Notification.permission==="default") Notification.requestPermission();
  }catch(e){}
}

/* ══════════ push: aviso con la app cerrada ══════════
   Para que el iPhone avise con la app cerrada del todo, alguien de fuera tiene
   que empujar la notificación en el momento justo. Eso solo lo puede hacer un
   servidor. Usamos el backend de FitPals, que ya trae los endpoints hechos:
   /api/push/vapid-public-key, /api/push/subscribe, /api/push/schedule-rest y
   /api/push/cancel-rest.

   Bitácora nunca pide ni guarda tu contraseña: se pega el token de sesión que
   FitPals ya tiene guardado, y con eso se identifica ante tu propio servidor. */
const api = (base,path)=>String(base).replace(/\/+$/,"")+path;

function b64ToU8(b64){
  const padd = "=".repeat((4 - b64.length%4)%4);
  const s = (b64+padd).replace(/-/g,"+").replace(/_/g,"/");
  const raw = atob(s), out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}

async function pushEnable(url, token, say){
  try{
    if(!url || !token){ say("Rellena la dirección del servidor y el token."); return; }
    if(!("serviceWorker" in navigator) || !("PushManager" in window)){
      say("Este navegador no admite avisos en segundo plano. En iOS hace falta añadir la app a la pantalla de inicio primero."); return;
    }
    if(location.protocol!=="https:"){
      say("Hace falta HTTPS. Esto solo funciona en la versión publicada (GitHub Pages), no en la copia local."); return;
    }

    say("Pidiendo permiso de notificaciones…");
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ say("Permiso denegado. Se puede volver a activar en Ajustes del iPhone → Bitácora → Notificaciones."); return; }

    say("Leyendo la clave del servidor…");
    const kr = await fetch(api(url,"/api/push/vapid-public-key"));
    if(!kr.ok){ say("El servidor respondió "+kr.status+" al pedir la clave."); return; }
    const kj = await kr.json();
    const pub = kj.publicKey || kj.key || kj.vapidPublicKey;
    if(!pub){ say("El servidor no devolvió una clave válida."); return; }

    say("Registrando este dispositivo…");
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToU8(pub)});
    const j = sub.toJSON();

    const sr = await fetch(api(url,"/api/push/subscribe"),{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({endpoint:j.endpoint, keys:{p256dh:j.keys.p256dh, auth:j.keys.auth}})
    });
    if(!sr.ok){
      say(sr.status===401 ? "El token no vale o ha caducado. Copia uno nuevo de FitPals." : "El servidor rechazó el registro ("+sr.status+").");
      return;
    }

    S.srv.url = url; S.srv.token = token; S.push.on = true; save();
    say("Activado. El aviso te llegará también con la app cerrada.");
    setTimeout(()=>{ closeSheet(); render(); }, 1500);
  }catch(e){
    say("No pude conectar. Comprueba la dirección y que el servidor permita peticiones desde este dominio (CORS).");
  }
}

  }).catch(()=>{});

/* ══════════ sincronización entre dispositivos ══════════
   El servidor no entiende los datos: solo guarda el JSON entero y un número de
   revisión que sube en cada escritura. Con eso basta para saber si el otro
   dispositivo escribió mientras tanto.

   Cada dispositivo recuerda con qué revisión se sincronizó por última vez y con
   qué sello de cambio. De ahí salen los tres casos posibles:
     · el servidor sigue donde lo dejé y yo tengo cambios  → subo
     · el servidor avanzó y yo no he tocado nada           → bajo
     · los dos hemos cambiado                              → pregunto, no piso nada  */

function srvFetch(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({"Authorization":"Bearer "+S.srv.token}, opts.headers||{});
  opts.cache = "no-store";
  return fetch(api(S.srv.url, path), opts);
}

/* Lo que se sube son los datos, nunca la configuración del dispositivo: el
   token y la dirección del servidor se quedan en casa. */
function estadoSinSecretos(){
  const copia = JSON.parse(JSON.stringify(S));
  delete copia.srv; delete copia.sync; delete copia.push;
  return copia;
}
function estadoParaSubir(){ return JSON.stringify(estadoSinSecretos()); }

/* Al traer datos de fuera (del servidor o de un archivo), la configuracion de
   ESTE dispositivo se conserva: si no, restaurar una copia te dejaria sin
   claves ni servidor. */
function conservarLocal(n){
  n.srv  = S.srv;
  n.push = S.push;
  n.sync = S.sync;
  delete n.ia;
  return n;
}

let syncT = null, sincronizando = false;
function syncPendiente(){
  if(!S.sync || !S.sync.on) return;
  clearTimeout(syncT);
  syncT = setTimeout(function(){ syncSubir(true); }, 4000);
}
function syncCaducado(){
  S.sync.on = false; persist(); render();
  toast("La sesi\u00f3n del servidor ha caducado. Pega un token nuevo en Ajustes.");
}

async function syncSubir(silencioso){
  if(!S.sync.on || sincronizando) return null;
  sincronizando = true;
  try{
    const r = await srvFetch("/api/bitacora",{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({data:estadoParaSubir(), changedAt:S.changedAt, baseRev:S.sync.rev})
    });
    if(r.status===401){ syncCaducado(); return null; }
    if(r.status===409){
      const d = await r.json().catch(()=>null);
      const meta = (d && d.detail) ? d.detail : {};
      sheetConflicto(meta);
      return "conflicto";
    }
    if(!r.ok) return null;
    const j = await r.json();
    S.sync.rev = j.rev; S.sync.at = S.changedAt;
    persist();
    if(!silencioso) toast("Datos subidos al servidor.");
    return "subido";
  }catch(e){ return null; }
  finally{ sincronizando = false; }
}

async function syncBajar(silencioso){
  try{
    const r = await srvFetch("/api/bitacora");
    if(r.status===401){ syncCaducado(); return null; }
    if(!r.ok) return null;
    const j = await r.json();
    if(!j.data) return null;
    const n = JSON.parse(j.data);
    if(!n || !n.habits) return null;
    /* La configuración de este dispositivo no se toca. */
    conservarLocal(n);
    n.sync = {on:true, rev:j.rev, at:j.changedAt};
    n.changedAt = j.changedAt;
    S = n;
    persist(); render();
    if(!silencioso) toast("Datos tra\u00eddos del otro dispositivo.");
    return "bajado";
  }catch(e){ return null; }
}

async function syncAhora(silencioso){
  if(!S.sync.on || !S.srv.url || !S.srv.token) return null;
  try{
    const r = await srvFetch("/api/bitacora/meta");
    if(r.status===401){ syncCaducado(); return null; }
    if(!r.ok) return null;
    const meta = await r.json();
    const pendiente = S.changedAt !== S.sync.at;   /* cambios sin subir */

    if(meta.rev === S.sync.rev){
      if(pendiente) return await syncSubir(silencioso);
      if(!silencioso) toast("Todo al d\u00eda.");
      return "al dia";
    }
    if(!pendiente) return await syncBajar(silencioso);
    sheetConflicto(meta);
    return "conflicto";
  }catch(e){
    if(!silencioso) toast("No he podido hablar con el servidor.");
    return null;
  }
}

function sheetConflicto(meta){

  openSheet("Cambios en los dos sitios",
