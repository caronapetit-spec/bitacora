<meta charset="utf-8">
<title>Bitácora</title>
<meta name="description" content="Hábitos, tareas, gastos, notas y gimnasio en una sola app.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">

<style>
/* ───────── tokens ───────── */
:root{
  --bg:#E9EBF0;
  --surface:#FFFFFF;
  --surface-2:#F5F6FA;
  --surface-3:#ECEEF4;
  --line:#E0E3EC;
  --line-2:#CBD0DE;
  --text:#141722;
  --text-2:#575D70;
  --text-3:#8B91A3;
  --m-habitos:#2F9E76;
  --m-tareas:#5C6AC4;
  --m-gastos:#B5822A;
  --m-notas:#AF5486;
  --m-gym:#C9503B;
  --m-cultura:#2A8C9E;
  --m-ia:#8257CE;
  --bad:#C2403C;
  --shadow:0 1px 2px rgba(20,24,35,.05), 0 10px 30px rgba(20,24,35,.07);
  --r:15px;
  --accent:var(--m-habitos);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D12;
    --surface:#15181F;
    --surface-2:#1C2029;
    --surface-3:#232833;
    --line:#272C37;
    --line-2:#39404F;
    --text:#ECEEF4;
    --text-2:#A0A6B6;
    --text-3:#6B7385;
    --m-habitos:#4FCBA0;
    --m-tareas:#8E98EC;
    --m-gastos:#DDA857;
    --m-notas:#DB84B2;
    --m-gym:#EE8168;
    --m-cultura:#57C4D6;
    --m-ia:#B392F0;
    --bad:#EF7A74;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0D12;
  --surface:#15181F;
  --surface-2:#1C2029;
  --surface-3:#232833;
  --line:#272C37;
  --line-2:#39404F;
  --text:#ECEEF4;
  --text-2:#A0A6B6;
  --text-3:#6B7385;
  --m-habitos:#4FCBA0;
  --m-tareas:#8E98EC;
  --m-gastos:#DDA857;
  --m-notas:#DB84B2;
  --m-gym:#EE8168;
  --m-cultura:#57C4D6;
  --m-ia:#B392F0;
  --bad:#EF7A74;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
/* Sin esto, las reglas de abajo (.sheet-wrap{display:flex}) ganan al display:none
   por defecto del atributo hidden, y el panel modal se queda visible siempre. */
[hidden]{display:none !important}
img{max-width:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  display:grid;
  place-items:center;
  overscroll-behavior:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ───────── shell ───────── */
.app{
  width:min(100%,440px);
  height:100dvh;
  background:var(--surface);
  display:grid;
  grid-template-rows:auto 1fr auto;
  overflow:hidden;
  position:relative;
}
.app[data-mod="habitos"]{--accent:var(--m-habitos)}
.app[data-mod="tareas"]{--accent:var(--m-tareas)}
.app[data-mod="gastos"]{--accent:var(--m-gastos)}
.app[data-mod="notas"]{--accent:var(--m-notas)}
.app[data-mod="gym"]{--accent:var(--m-gym)}
.app[data-mod="cultura"]{--accent:var(--m-cultura)}
.app[data-mod="ia"]{--accent:var(--m-ia)}
@media (min-width:520px) and (min-height:700px){
  .app{height:min(880px,94dvh);border-radius:26px;box-shadow:var(--shadow);border:1px solid var(--line)}
}

.topbar{
  display:grid;
  grid-template-columns:44px 1fr 44px;
  align-items:center;
  height:52px;
  padding:max(env(safe-area-inset-top),0px) 8px 0;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.topbar-title{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  text-align:center;
  color:var(--text-3);
}
.icon-btn{
  width:40px;height:40px;
  display:grid;place-items:center;
  border-radius:11px;
  color:var(--text-2);
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.accent{color:var(--accent)}
.icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.view{
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:18px 18px 28px;
  display:flex;
  flex-direction:column;
  gap:22px;
}
/* Los hijos de un flex de altura fija se encogen por defecto. Combinado con el
   overflow:hidden de .stack, eso recortaba filas de las listas en vez de dejar
   que la pantalla hiciera scroll. */
.view > *{flex:none}

.tabbar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border-top:1px solid var(--line);
  background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 7px;
  color:var(--text-3);
  font-size:8.5px;
  letter-spacing:-.01em;
  letter-spacing:.02em;
  transition:color .15s;
}
.tabbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}

/* ───────── type ───────── */
.eyebrow{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-3);
}
h1.title{
  font-family:"Fraunces",Georgia,serif;
  font-variation-settings:"SOFT" 0,"WONK" 1,"opsz" 60;
  font-weight:600;
  font-size:34px;
  line-height:1.05;
  margin:4px 0 0;
  letter-spacing:-.015em;
  text-wrap:balance;
}
h1.title.money{font-variant-numeric:tabular-nums;font-size:40px}
h2.sec{
  font-size:12px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);
  margin:0 0 10px;
}
.hero{display:flex;flex-direction:column}
.hero-foot{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.hero-foot .big{
  font-family:"Fraunces",Georgia,serif;
  font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--accent);
}
.hero-foot .slash{color:var(--text-3);font-size:18px}
.hero-foot .lbl{font-size:13px;color:var(--text-2)}

/* ───────── bits ───────── */
.bar{display:block;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.stack{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);padding:12px 14px;min-height:54px}
.row-main{flex:1;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.row-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-title.done{color:var(--text-3);text-decoration:line-through}
.row-sub{font-size:11.5px;color:var(--text-3)}
.row-val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:14px;font-weight:500}

.check{
  width:26px;height:26px;flex:none;
  border:1.8px solid var(--line-2);
  border-radius:50%;
  display:grid;place-items:center;
  color:transparent;
  transition:background .15s,border-color .15s,color .15s,transform .1s;
}
.check:active{transform:scale(.9)}
.check svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .check.on{color:#0B0D12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .check.on{color:#0B0D12}}

.x{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:8px;color:var(--text-3)}
.x:hover{color:var(--bad);background:var(--surface-2)}
.x svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:12px;
  background:var(--accent);color:#fff;
  font-weight:600;font-size:15px;
  transition:filter .15s,transform .1s;
}
:root[data-theme="dark"] .btn{color:#0B0D12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0B0D12}}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.06)}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:10px}
.btn svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.field{
  width:100%;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  outline:none;
  transition:border-color .15s;
}
.field:focus{border-color:var(--accent)}
.field::placeholder{color:var(--text-3)}
textarea.field{resize:vertical;min-height:120px;line-height:1.6}

.seg{display:grid;grid-auto-flow:column;gap:4px;background:var(--surface-3);border-radius:11px;padding:4px}
.seg button{
  padding:8px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text-2);
  transition:background .15s,color .15s;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(20,24,35,.08)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 13px;border-radius:99px;
  border:1px solid var(--line-2);
  font-size:13px;color:var(--text-2);
  transition:background .15s,color .15s,border-color .15s;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0B0D12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0B0D12}}

.empty{
  text-align:center;padding:34px 20px;
  color:var(--text-3);font-size:13.5px;
  border:1px dashed var(--line-2);border-radius:var(--r);
  line-height:1.6;
}

.banner{
  display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--accent) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--text-2);
}
.banner b{color:var(--text)}
.banner button{color:var(--accent);font-weight:600;font-size:12.5px;white-space:nowrap}

/* ───────── heatmap ───────── */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .dow{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-align:center;
  color:var(--text-3);padding-bottom:2px;
}
.heat i{
  aspect-ratio:1;border-radius:5px;
  background:var(--surface-3);
  display:block;
}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 28%,var(--surface-3))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--surface-3))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 78%,var(--surface-3))}
.heat i[data-l="4"]{background:var(--accent)}
.heat i[data-today="1"]{box-shadow:0 0 0 1.8px var(--text-3)}

/* ───────── charts ───────── */
.cat-row{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:10px;padding:5px 0}
.cat-row .lbl{font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row .track{height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.cat-row .track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cat-row .amt{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-2)}

.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:128px}
.months .m{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.months .v{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.months .col{width:100%;background:color-mix(in srgb,var(--accent) 30%,var(--surface-3));border-radius:5px 5px 2px 2px;min-height:3px}
.months .m[data-now="1"] .col{background:var(--accent)}
.months .m[data-now="1"] .v{color:var(--accent);font-weight:600}
.months .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--text-3);text-transform:uppercase}

/* ───────── notes ───────── */
.notes{display:flex;flex-direction:column;gap:9px}
.note{
  text-align:left;width:100%;
  background:var(--surface-2);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;display:flex;flex-direction:column;gap:4px;
  transition:border-color .15s;
}
.note:hover{border-color:var(--line-2)}
.note .nt{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px}
.note .nt svg{width:12px;height:12px;flex:none;fill:currentColor;stroke:none;color:var(--accent)}
.note .np{font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.note .nd{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-3);letter-spacing:.04em}

/* ───────── gym ───────── */
.sess{background:var(--surface-2);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:13px}
.sess-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sess-head .nm{font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600}
.sess-head .tm{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.ex{border-top:1px solid var(--line);padding-top:11px;display:flex;flex-direction:column;gap:8px}
.ex-name{font-weight:600;font-size:14px}
.sets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.set{
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;
  background:var(--surface-3);border-radius:8px;padding:5px 9px;color:var(--text-2);
}
.set b{color:var(--text);font-weight:600}
.set.pr{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.setform{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:center}
.setform .field{padding:9px 11px;text-align:center;font-family:"IBM Plex Mono",monospace}

.set.warm{background:transparent;border:1px dashed var(--line-2);color:var(--text-3)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(60px + env(safe-area-inset-top));
  z-index:60;max-width:min(90%,400px);
  background:var(--accent);color:#fff;
  padding:12px 17px;border-radius:13px;
  font-size:13px;font-weight:500;line-height:1.4;text-align:center;
  box-shadow:0 8px 28px rgba(10,12,18,.35);
  animation:baja .24s cubic-bezier(.22,1,.36,1);
}
@keyframes baja{from{transform:translate(-50%,-140%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
:root[data-theme="dark"] .toast{color:#0B0D12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{color:#0B0D12}}
.ex-up{
  font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  padding:2px 7px;border-radius:99px;letter-spacing:.02em;
}

/* ─── chat con la IA ─── */
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;font-size:14.5px;line-height:1.55}
.msg.yo{
  align-self:flex-end;
  background:color-mix(in srgb,var(--accent) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:15px 15px 5px 15px;
  padding:11px 14px;white-space:pre-wrap;
}
.msg.claude{align-self:flex-start;max-width:100%}
.msg.claude p{margin:0 0 10px}
.msg.claude p:last-child{margin-bottom:0}
.msg.claude ul{margin:0 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.msg.claude strong{font-weight:600}
.msg.claude code{
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  background:var(--surface-3);padding:1px 5px;border-radius:5px;
}
.msg.claude pre{
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;overflow-x:auto;margin:0 0 10px;
}
.msg.claude pre code{background:none;padding:0;font-size:12px;line-height:1.5}
.msg-pie{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--text-3);
  margin-top:6px;letter-spacing:.03em;
}
.pensando{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--text-3);align-self:flex-start;
}
.pensando i{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  animation:latir 1.1s ease-in-out infinite;
}
.pensando i:nth-child(2){animation-delay:.15s}
.pensando i:nth-child(3){animation-delay:.3s}
@keyframes latir{0%,60%,100%{opacity:.25}30%{opacity:1}}
.chat-form{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;padding-top:4px;background:var(--surface)}
.chat-form textarea{min-height:44px;max-height:130px;resize:none;line-height:1.4}
.sug{display:flex;flex-direction:column;gap:7px}
.sug button{
  text-align:left;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;font-size:13.5px;color:var(--text-2);
}
.sug button:hover{border-color:var(--accent);color:var(--text)}

/* ─── cultura ─── */
.cul-prog{display:grid;grid-template-columns:1fr auto;gap:4px 9px;align-items:center;margin-top:6px}
.cul-prog .bar{margin-top:0;grid-column:1}
.cul-prog .pc{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.score{
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.score small{color:var(--text-3);font-weight:400;font-size:10px}
.chips.notas{gap:6px}
.chips.notas .chip{min-width:38px;text-align:center;padding:8px 0;font-family:"IBM Plex Mono",monospace}
.cul-year{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  color:var(--text-3);margin:14px 0 7px;
}
.cul-year:first-child{margin-top:0}

/* ─── tabla de series de la sesión ─── */
.strows{display:flex;flex-direction:column;gap:5px}
.sthead,.strow{display:grid;grid-template-columns:16px 1fr 1fr 28px 30px 24px;gap:4px;align-items:center}
.sthead span{font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);text-align:center}
.strow .field{padding:9px 3px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13.5px}
.strow .field::placeholder{color:var(--text-3);opacity:.55}
.st-n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--text-3);text-align:center;font-variant-numeric:tabular-nums}

.st-tipo{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  height:32px;border-radius:8px;border:1px solid var(--line-2);color:var(--text-3);
  display:grid;place-items:center;
}
.st-tipo[data-t="C"]{color:var(--m-gastos);border-color:color-mix(in srgb,var(--m-gastos) 45%,transparent);background:color-mix(in srgb,var(--m-gastos) 12%,transparent)}
.st-tipo[data-t="T"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

.st-go{
  height:32px;border-radius:8px;border:1px solid var(--line-2);
  display:grid;place-items:center;color:var(--text-3);
  transition:background .15s,color .15s,border-color .15s;
}
.st-go svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st-go:hover{border-color:var(--accent);color:var(--accent)}
.strow.done .st-go{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .strow.done .st-go{color:#0B0D12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .strow.done .st-go{color:#0B0D12}}
.strow.done .field{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--text);font-weight:600}
.strow.done .st-n{color:var(--accent);font-weight:600}
.strow .x{width:24px;height:24px}
.strow .x svg{width:12px;height:12px}

/* Serie planificada pero todavía no hecha: hueco a rellenar, no dato. */
.set.todo{background:transparent;border:1px dashed var(--line-2);color:var(--text-3);opacity:.75}
.set.todo b{color:var(--text-2);font-weight:500}
.set.todo.warm{border-style:dotted}
button.set{cursor:pointer;transition:border-color .15s,background .15s}
button.set:hover{border-color:var(--accent)}
/* El nombre y sus datos no caben en la misma linea en un movil estrecho:
   el nombre arriba, los objetivos debajo. */
.ex-head{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.ex-meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--text-3);letter-spacing:.03em}

.rest{
  display:grid;gap:7px;
  background:color-mix(in srgb,var(--accent) 12%,var(--surface-2));
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  border-radius:12px;padding:12px 14px;width:100%;text-align:left;
}
.rest-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rest-top .rv{font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.rest-top .rl{font-size:11.5px;color:var(--text-2)}
.rest .bar{margin-top:0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;display:flex;flex-direction:column;gap:1px}
.tile .tv{font-family:"Fraunces",Georgia,serif;font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .tl{font-size:11px;color:var(--text-3)}

.goal{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .gn{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .gv{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.goal .bar{grid-column:1/-1;margin-top:3px}
.goal.ok .gv{color:var(--accent);font-weight:600}

.ach{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach .an{flex:1;min-width:0}
.ach .at{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ach .av{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:4px;flex:none}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--surface-3);display:block}
.pips i[data-on="1"]{background:var(--accent)}

.prog{display:flex;align-items:flex-end;gap:5px;height:112px}
.prog .p{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%;min-width:0}
.prog .pv{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--text-3);font-variant-numeric:tabular-nums}
.prog .pc{width:100%;background:color-mix(in srgb,var(--accent) 30%,var(--surface-3));border-radius:4px 4px 2px 2px;min-height:3px}
.prog .p:last-child .pc{background:var(--accent)}
.prog .p:last-child .pv{color:var(--accent);font-weight:600}
.prog .pd{font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--text-3)}

.rt-row{display:flex;flex-direction:column;gap:7px;padding:11px 0;border-bottom:1px solid var(--line)}
.rt-row:last-child{border-bottom:0}
.rt-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rt-head b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-sub{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);margin-bottom:4px}
.rt-name{
  flex:1;min-width:0;text-align:left;
  font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.rt-name > span{
  font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:400;
  color:var(--text-3);border:1px solid var(--line-2);border-radius:99px;
  padding:2px 7px;flex:none;text-transform:uppercase;letter-spacing:.05em;
}
.rt-name:hover > span{color:var(--accent);border-color:var(--accent)}
.eq-tag{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:500;
  color:var(--text-3);background:var(--surface-3);
  padding:2px 7px;border-radius:99px;white-space:nowrap;
}
.rt-sub .field{width:68px;padding:7px 4px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13px}

/* Una fila por serie: numero, reps, kilos, calentamiento y quitar. */
.rt-set,.rt-cols{display:grid;grid-template-columns:20px 1fr 1fr 38px 26px;gap:6px;align-items:center}
.rt-set{margin-bottom:6px}
.rt-set .field{padding:8px 4px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13px}
.rt-cols span{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);text-align:center}
.rt-n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--text-3);text-align:center;font-variant-numeric:tabular-nums}
.rt-n.cal{color:var(--accent);font-weight:600}
.chip.mini{padding:7px 0;font-size:10px;text-align:center;border-radius:8px;letter-spacing:.03em}
.rt-set .x{width:26px;height:26px}
.rt-set .x svg{width:13px;height:13px}

/* ───────── sheet ───────── */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
/* El panel cuelga fuera de .app, asi que no hereda el acento del modulo:
   se lo damos aparte o siempre saldria con el color de Habitos. */
.sheet-wrap[data-mod="habitos"]{--accent:var(--m-habitos)}
.sheet-wrap[data-mod="tareas"]{--accent:var(--m-tareas)}
.sheet-wrap[data-mod="gastos"]{--accent:var(--m-gastos)}
.sheet-wrap[data-mod="notas"]{--accent:var(--m-notas)}
.sheet-wrap[data-mod="gym"]{--accent:var(--m-gym)}
.sheet-wrap[data-mod="cultura"]{--accent:var(--m-cultura)}
.sheet-wrap[data-mod="ia"]{--accent:var(--m-ia)}
.sheet-back{position:absolute;inset:0;background:rgba(10,12,18,.5);backdrop-filter:blur(3px);animation:fade .2s ease}
.sheet{
  position:relative;
  width:min(100%,440px);
  max-height:88dvh;
  background:var(--surface);
  border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;
  animation:up .26s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -10px 40px rgba(10,12,18,.25);
}
@media (min-width:520px) and (min-height:700px){
  .sheet-wrap{align-items:center}
  .sheet{border-radius:20px;max-height:min(760px,86dvh);animation:pop .22s cubic-bezier(.22,1,.36,1)}
}
.sheet-head{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
  padding:17px 18px 13px;border-bottom:1px solid var(--line);
}
.sheet-head h3{margin:0;font-family:"Fraunces",Georgia,serif;font-size:21px;font-weight:600}
.sheet-body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.lbl-s{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);display:block;margin-bottom:7px}
.picker{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px}
.picker button{background:var(--surface);padding:11px 14px;text-align:left;font-size:14px}
.picker button:hover{background:var(--surface-2)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--text-2)}
.hint{font-size:12.5px;color:var(--text-3);line-height:1.6}
.hint b{color:var(--text-2)}
.hint ol{margin:8px 0 0;padding-left:19px;display:flex;flex-direction:column;gap:5px}

@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

  if(k===today()) return "hoy";

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(!raw) return seed();
    const s = JSON.parse(raw);
    if(!s || !s.habits) return seed();
    s.gym = s.gym || {};
    s.gym.exercises = s.gym.exercises || EJERCICIOS.slice();
    /* Se añaden al catálogo los ejercicios conocidos que falten. Solo suma:
       nunca quita los que hayas escrito tú. */
    Object.keys(MATERIAL).forEach(function(n){
      if(s.gym.exercises.indexOf(n) < 0) s.gym.exercises.push(n);
    });
    s.gym.sessions  = s.gym.sessions  || [];
    s.gym.routines  = s.gym.routines  || [];
    s.gym.goals     = s.gym.goals     || [];
    s.gym.weights   = s.gym.weights   || [];
    s.gym.profile   = s.gym.profile   || {};
    if(s.gym.active===undefined) s.gym.active = null;
    if(!s.gym.restDefault) s.gym.restDefault = 90;
    if(!s.gym.stepKg) s.gym.stepKg = 2.5;
    migrateRoutines(s.gym);
    s.gymTab = s.gymTab || "sesion";
    s.culTab = s.culTab || "libros";
    s.cultura = s.cultura || [];
    s.ia = s.ia || {key:"", msgs:[], contexto:true, tokens:{in:0,out:0}};
    s.ia.msgs = s.ia.msgs || [];
    s.ia.tokens = s.ia.tokens || {in:0,out:0};
    /* La configuración del servidor pasó a ser una sola, compartida por los
       avisos y la sincronización: antes vivía duplicada dentro de push. */
    s.push = s.push || {on:false};
    s.srv  = s.srv  || {url:"", token:""};
    if(!s.srv.url && s.push.url){ s.srv.url = s.push.url; s.srv.token = s.push.token || ""; }
    delete s.push.url; delete s.push.token;
    s.sync = s.sync || {on:false, rev:0, at:null};
    s.changedAt = s.changedAt || new Date().toISOString();
    s.notes = s.notes || []; s.tasks = s.tasks || []; s.expenses = s.expenses || [];
    return s;
  }catch(e){ return seed(); }
}

function streak(h){

  if(!h.days[key(d)]) d.setDate(d.getDate()-1);
  let n = 0;
  while(h.days[key(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

const sum = a=>a.reduce((t,e)=>t+e.amount,0);
/* ─── gimnasio: métricas ───
   Las series de calentamiento no cuentan para récords ni volumen,
   igual que en FitPals: son trabajo de aproximación, no rendimiento. */
const isWarm = s=>!!s.warmup;
/* Una serie "todo" está planificada por la rutina pero aún no hecha: se ve en
   pantalla como hueco a rellenar, y no cuenta para nada hasta que la registras. */
const isTodo = s=>!!s.todo;
const hechas = en=>(en.sets||[]).filter(s=>!isTodo(s));
function allSessions(){ return S.gym.sessions.concat(S.gym.active?[S.gym.active]:[]); }

/* Las repeticiones de una rutina admiten un número ("8") o un intervalo ("6-8"). */
function repsRange(v){
  const s = String(v==null?"":v).trim();
  const m = s.match(/^(\d+)\s*[-–a]\s*(\d+)$/);
  if(m){
    const a = +m[1], b = +m[2];
    const lo = Math.min(a,b), hi = Math.max(a,b);
    return {min:lo, max:hi, label:lo===hi ? String(lo) : lo+"-"+hi};
  }
  const n = parseInt(s,10);
  if(n>0) return {min:n, max:n, label:String(n)};
  return {min:0, max:0, label:""};
}

/* Cada ejercicio de una rutina guarda su lista de series, una a una, con sus
   propias reps y kilos. Las rutinas viejas guardaban solo "N series × R reps ×
   K kg" y se convierten a esa forma al abrirlas. */
function routineSets(e){
  if(Array.isArray(e.sets) && e.sets.length) return e.sets;
  const out = [];
  const r = repsRange(e.targetReps).label || "10";
  const kg = Number(e.targetWeight)||0;
  const w = Math.max(0, Number(e.warmupSets)||0);
  for(let i=0;i<w;i++) out.push({reps:r, kg: kg ? Math.round(kg*0.5/2.5)*2.5 : 0, warmup:true});
  const n = Math.max(1, Number(e.targetSets)||1);
  for(let i=0;i<n;i++) out.push({reps:r, kg:kg});
  return out;
}
function migrateRoutines(gym){
  (gym.routines||[]).forEach(r=>{
    (r.exercises||[]).forEach(e=>{
      if(!Array.isArray(e.sets) || !e.sets.length){
        e.sets = routineSets(e);
        delete e.targetSets; delete e.targetReps; delete e.targetWeight; delete e.warmupSets;
      }
      /* El calentamiento no necesita el mismo descanso que una serie pesada. */
      if(e.restWarmup===undefined) e.restWarmup = 60;
      /* El material se deduce del nombre cuando se conoce; si no, se deja sin
         poner en vez de inventarlo. */
      if(e.eq===undefined) e.eq = MATERIAL[e.name] || "";
    });
  });
}
const restOf = (e,warm)=> warm
  ? (Number(e.restWarmup)||60)
  : (Number(e.restSeconds)||90);
function routineCount(r){
  let work = 0, warm = 0;
  (r.exercises||[]).forEach(e=>routineSets(e).forEach(s=>{ if(s.warmup) warm++; else work++; }));
  return {work:work, warm:warm};
}

const fmtKg = v => String(Math.round(v*100)/100).replace(".", ",");

/* ─── sobrecarga progresiva ───
   Progresion doble: mientras no llegues al tope del intervalo, repites peso; en
   cuanto lo clavas, subes. Aqui, al registrar una serie de trabajo con las reps
   del tope, sube el peso de las series que queden por hacer y lo deja escrito en
   la rutina, para que el proximo entreno arranque ya con el peso nuevo.

   Sube CADA vez que clavas el tope, sin limite por sesion: si lo consigues en
   varias series seguidas es que el peso de partida estaba corto, y la rutina debe
   reflejarlo entero. Cada subida se anota en la serie que la provoco, asi que
   desmarcarla la deshace y un toque accidental no cambia la rutina para siempre. */
function moverPesos(en, a, j, delta){
  let n = 0;
  en.sets.forEach((x,k)=>{
    if(k<=j || x.warmup || !isTodo(x)) return;
    x.kg = Math.max(0, Math.round((((Number(x.kg)||0) + delta))*100)/100);
    n++;
  });
  let enRutina = false;
  const rut = S.gym.routines.filter(x=>x.id===a.routineId || x.name===a.routine)[0];
  if(rut){
    const ex = (rut.exercises||[]).filter(x=>x.name===en.ex)[0];
    if(ex && Array.isArray(ex.sets)){
      ex.sets.forEach(x=>{
        if(x.warmup || !Number(x.kg)) return;   /* el calentamiento se queda donde esta */
        x.kg = Math.max(0, Math.round((((Number(x.kg)||0) + delta))*100)/100);
      });
      enRutina = true;
    }
  }
  if(en.target) en.target.kg = Math.max(0, Math.round(((Number(en.target.kg)||0) + delta)*100)/100);
  return {n:n, rutina:enRutina};
}

function aplicarSobrecarga(a, en, s, j){
  if(s.warmup) return;
  const r = repsRange(s.tReps);
  if(!r.max || !s.reps || s.reps < r.max) return;
  if(!Number(s.kg)) return;        /* peso corporal: no se sube solo */
  const paso = Number(S.gym.stepKg) || 2.5;
  const res = moverPesos(en, a, j, paso);
  s.bump = paso;                   /* anotado en la serie, para poder deshacerlo */
  en.bumped = Math.round((((en.bumped||0) + paso))*100)/100;
  toast(s.reps + " reps: tope del intervalo. Subes " + fmtKg(paso) + " kg" +
        (en.bumped > paso ? " (" + fmtKg(en.bumped) + " kg hoy)" : "") +
        (res.rutina ? ". Rutina actualizada." : "."));
}
function revertirSobrecarga(a, en, j){
  const s = en.sets[j];
  if(!s || !s.bump) return;
  moverPesos(en, a, j, -s.bump);
  en.bumped = Math.round((((en.bumped||0) - s.bump))*100)/100;
  if(en.bumped <= 0) delete en.bumped;
  delete s.bump;
}

/* Series que la rutina deja preparadas en pantalla, en su orden. */
function planSets(e){
  /* El peso viene ya puesto en la casilla; las reps se dejan vacias con el
     objetivo como pista, que es lo que de verdad varia serie a serie. */
  return routineSets(e).map(s=>({
    plan:true, todo:true,
    warmup:!!s.warmup,
    kg:Number(s.kg)||0,
    tReps:repsRange(s.reps).label,
    tRest:restOf(e, !!s.warmup)
  }));
}
function routineTarget(e){
  const list = routineSets(e);
  const work = list.filter(s=>!s.warmup);
  return {
    sets: work.length,
    warm: list.length-work.length,
    kg: work.length ? Number(work[0].kg)||0 : 0,
    reps: work.length ? work[work.length-1].reps : "",
    rest: Number(e.restSeconds)||90,
    restWarm: Number(e.restWarmup)||60
  };
}

function records(){
  const r = {};
  allSessions().forEach(s=>(s.entries||[]).forEach(en=>en.sets.forEach(st=>{
    if(isWarm(st) || isTodo(st)) return;
    if(!r[en.ex] || st.kg>r[en.ex].kg) r[en.ex] = {kg:st.kg, reps:st.reps};
  })));
  return r;
}
function volumeOf(s){
  let t = 0;
  (s.entries||[]).forEach(en=>en.sets.forEach(st=>{
    if(isWarm(st) || isTodo(st)) return;
    t += (st.kg||0)*(st.reps||0);
  }));
  return t;
}
function totalVolume(){ return S.gym.sessions.reduce((t,s)=>t+volumeOf(s),0); }
function loggedExercises(){
  const set = {};
  S.gym.sessions.forEach(s=>(s.entries||[]).forEach(en=>{ if(hechas(en).length) set[en.ex]=1; }));
  return Object.keys(set);
}
function mondayIndex(dateStr){
  const d = parseKey(dateStr);
  const off = (d.getDay()+6)%7;
  const mon = new Date(d); mon.setDate(d.getDate()-off);
  return Math.floor(mon.getTime()/(7*86400000));
}
function weekStreak(){
  const weeks = {};
  S.gym.sessions.forEach(s=>{ weeks[mondayIndex(s.date)] = 1; });
  const idx = Object.keys(weeks).map(Number).sort((a,b)=>a-b);
  let longest = 0, cur = 0, prev = null;
  idx.forEach(i=>{ cur = (prev!==null && i===prev+1) ? cur+1 : 1; if(cur>longest) longest = cur; prev = i; });
  return longest;
}
function goalsDone(){
  const prs = records();
  return S.gym.goals.filter(g=>prs[g.exercise] && prs[g.exercise].kg>=g.targetWeight).length;
}
function warmupSessions(){
  return S.gym.sessions.filter(s=>(s.entries||[]).some(en=>(en.sets||[]).some(isWarm))).length;
}

/* ══════════ cronómetro de descanso ══════════ */
let rest = null, restInt = null, audioCtx = null, keepAlive = null, alarmNodes = [];
const fmtClock = ms=>{ const s = Math.ceil(ms/1000); return Math.floor(s/60)+":"+pad(s%60); };

function unlockAudio(){
  /* El navegador solo deja crear sonido a partir de un toque real del usuario,
     así que el contexto se crea al pulsar "Añadir serie", no antes. */
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!audioCtx && AC) audioCtx = new AC();
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  }catch(e){}
  return audioCtx;
}

/* Ruido a volumen inaudible, en bucle, mientras dura el descanso.
   iOS solo mantiene vivo el audio de una web si de verdad está sonando algo:
   este murmullo es lo que hace que el aviso suene con la pantalla apagada
   o con otra app delante. Se apaga al terminar el descanso. */
function startKeepAlive(){
  if(!audioCtx || keepAlive) return;
  try{
    const len = Math.floor(audioCtx.sampleRate);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * 0.00012;
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    src.connect(audioCtx.destination);
    src.start();
    keepAlive = src;
  }catch(e){}
}
function stopKeepAlive(){
  if(!keepAlive) return;
  try{ keepAlive.stop(); keepAlive.disconnect(); }catch(e){}
  keepAlive = null;
}

/* El aviso NO se lanza con un temporizador de JavaScript, porque iOS congela el
   JavaScript en segundo plano. Se programa dentro del propio grafo de audio, en
   un instante exacto: lo reproduce el hilo de audio del sistema, que sigue
   corriendo. Por eso suena aunque la app esté cerrada en segundo plano, y por eso
   el modo No molestar no lo silencia: para iOS esto es reproducción de audio,
   no una notificación. */
function scheduleAlarm(secs){
  const ac = audioCtx; if(!ac) return;
  clearAlarm();
  const t0 = ac.currentTime + secs;
  for(let r=0;r<8;r++){
    const at = t0 + r*0.42;
    try{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "square";
      o.frequency.value = (r%2) ? 1245 : 932;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(0.55, at+0.012);
      g.gain.setValueAtTime(0.55, at+0.17);
      g.gain.exponentialRampToValueAtTime(0.0001, at+0.31);
      o.connect(g); g.connect(ac.destination);
      o.start(at); o.stop(at+0.33);
      alarmNodes.push(o);
    }catch(e){}
  }
}
function clearAlarm(){
  alarmNodes.forEach(o=>{ try{ o.stop(); }catch(e){} try{ o.disconnect(); }catch(e){} });
  alarmNodes = [];
}
function beep(){ /* el aviso ya va programado en el grafo de audio */ }
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){} }
function notify(title, body){
  try{
    if(window.Notification && Notification.permission==="granted") new Notification(title,{body:body,tag:"rest"});
  }catch(e){}
}
function askNotif(){
  try{
    if(window.Notification && Notification.permission==="default") Notification.requestPermission();
  }catch(e){}
}

/* ══════════ push: aviso con la app cerrada ══════════
   Para que el iPhone avise con la app cerrada del todo, alguien de fuera tiene
   que empujar la notificación en el momento justo. Eso solo lo puede hacer un
   servidor. Usamos el backend de FitPals, que ya trae los endpoints hechos:
   /api/push/vapid-public-key, /api/push/subscribe, /api/push/schedule-rest y
   /api/push/cancel-rest.

   Bitácora nunca pide ni guarda tu contraseña: se pega el token de sesión que
   FitPals ya tiene guardado, y con eso se identifica ante tu propio servidor. */
const api = (base,path)=>String(base).replace(/\/+$/,"")+path;

function b64ToU8(b64){
  const padd = "=".repeat((4 - b64.length%4)%4);
  const s = (b64+padd).replace(/-/g,"+").replace(/_/g,"/");
  const raw = atob(s), out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}

async function pushEnable(url, token, say){
  try{
    if(!url || !token){ say("Rellena la dirección del servidor y el token."); return; }
    if(!("serviceWorker" in navigator) || !("PushManager" in window)){
      say("Este navegador no admite avisos en segundo plano. En iOS hace falta añadir la app a la pantalla de inicio primero."); return;
    }
    if(location.protocol!=="https:"){
      say("Hace falta HTTPS. Esto solo funciona en la versión publicada (GitHub Pages), no en la copia local."); return;
    }

    say("Pidiendo permiso de notificaciones…");
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ say("Permiso denegado. Se puede volver a activar en Ajustes del iPhone → Bitácora → Notificaciones."); return; }

    say("Leyendo la clave del servidor…");
    const kr = await fetch(api(url,"/api/push/vapid-public-key"));
    if(!kr.ok){ say("El servidor respondió "+kr.status+" al pedir la clave."); return; }
    const kj = await kr.json();
    const pub = kj.publicKey || kj.key || kj.vapidPublicKey;
    if(!pub){ say("El servidor no devolvió una clave válida."); return; }

    say("Registrando este dispositivo…");
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToU8(pub)});
    const j = sub.toJSON();

    const sr = await fetch(api(url,"/api/push/subscribe"),{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({endpoint:j.endpoint, keys:{p256dh:j.keys.p256dh, auth:j.keys.auth}})
    });
    if(!sr.ok){
      say(sr.status===401 ? "El token no vale o ha caducado. Copia uno nuevo de FitPals." : "El servidor rechazó el registro ("+sr.status+").");
      return;
    }

    S.srv.url = url; S.srv.token = token; S.push.on = true; save();
    say("Activado. El aviso te llegará también con la app cerrada.");
    setTimeout(()=>{ closeSheet(); render(); }, 1500);
  }catch(e){
    say("No pude conectar. Comprueba la dirección y que el servidor permita peticiones desde este dominio (CORS).");
  }
}

function pushScheduleRest(secs){
  if(!S.push.on || !S.srv.url || !S.srv.token) return;
  srvFetch("/api/push/schedule-rest",{

  }).catch(()=>{});
}

}

/* ══════════ sincronización entre dispositivos ══════════
   El servidor no entiende los datos: solo guarda el JSON entero y un número de
   revisión que sube en cada escritura. Con eso basta para saber si el otro
   dispositivo escribió mientras tanto.

   Cada dispositivo recuerda con qué revisión se sincronizó por última vez y con
   qué sello de cambio. De ahí salen los tres casos posibles:
     · el servidor sigue donde lo dejé y yo tengo cambios  → subo
     · el servidor avanzó y yo no he tocado nada           → bajo
     · los dos hemos cambiado                              → pregunto, no piso nada  */

function srvFetch(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({"Authorization":"Bearer "+S.srv.token}, opts.headers||{});
  opts.cache = "no-store";
  return fetch(api(S.srv.url, path), opts);
}

/* Lo que se sube son los datos, nunca la configuración del dispositivo: el
   token y la dirección del servidor se quedan en casa. */
function estadoSinSecretos(){
  const copia = JSON.parse(JSON.stringify(S));
  delete copia.srv; delete copia.sync; delete copia.push;
  if(copia.ia) delete copia.ia.key;
  return copia;
}
function estadoParaSubir(){ return JSON.stringify(estadoSinSecretos()); }

/* Al traer datos de fuera (del servidor o de un archivo), la configuracion de
   ESTE dispositivo se conserva: si no, restaurar una copia te dejaria sin
   claves ni servidor. */
function conservarLocal(n){
  n.srv  = S.srv;
  n.push = S.push;
  n.sync = S.sync;
  n.ia = n.ia || {msgs:[], contexto:true, tokens:{in:0,out:0}};
  n.ia.key = (S.ia && S.ia.key) || "";
  return n;
}

let syncT = null, sincronizando = false;
function syncPendiente(){
  if(!S.sync || !S.sync.on) return;
  clearTimeout(syncT);
  syncT = setTimeout(function(){ syncSubir(true); }, 4000);
}
function syncCaducado(){
  S.sync.on = false; persist(); render();
  toast("La sesi\u00f3n del servidor ha caducado. Pega un token nuevo en Ajustes.");
}

async function syncSubir(silencioso){
  if(!S.sync.on || sincronizando) return null;
  sincronizando = true;
  try{
    const r = await srvFetch("/api/bitacora",{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({data:estadoParaSubir(), changedAt:S.changedAt, baseRev:S.sync.rev})
    });
    if(r.status===401){ syncCaducado(); return null; }
    if(r.status===409){
      const d = await r.json().catch(()=>null);
      const meta = (d && d.detail) ? d.detail : {};
      sheetConflicto(meta);
      return "conflicto";
    }
    if(!r.ok) return null;
    const j = await r.json();
    S.sync.rev = j.rev; S.sync.at = S.changedAt;
    persist();
    if(!silencioso) toast("Datos subidos al servidor.");
    return "subido";
  }catch(e){ return null; }
  finally{ sincronizando = false; }
}

async function syncBajar(silencioso){
  try{
    const r = await srvFetch("/api/bitacora");
    if(r.status===401){ syncCaducado(); return null; }
    if(!r.ok) return null;
    const j = await r.json();
    if(!j.data) return null;
    const n = JSON.parse(j.data);
    if(!n || !n.habits) return null;
    /* La configuración de este dispositivo no se toca. */
    conservarLocal(n);
    n.sync = {on:true, rev:j.rev, at:j.changedAt};
    n.changedAt = j.changedAt;
    S = n;
    persist(); render();
    if(!silencioso) toast("Datos tra\u00eddos del otro dispositivo.");
    return "bajado";
  }catch(e){ return null; }
}

async function syncAhora(silencioso){
  if(!S.sync.on || !S.srv.url || !S.srv.token) return null;
  try{
    const r = await srvFetch("/api/bitacora/meta");
    if(r.status===401){ syncCaducado(); return null; }
    if(!r.ok) return null;
    const meta = await r.json();
    const pendiente = S.changedAt !== S.sync.at;   /* cambios sin subir */

    if(meta.rev === S.sync.rev){
      if(pendiente) return await syncSubir(silencioso);
      if(!silencioso) toast("Todo al d\u00eda.");
      return "al dia";
    }
    if(!pendiente) return await syncBajar(silencioso);
    sheetConflicto(meta);
    return "conflicto";
  }catch(e){
    if(!silencioso) toast("No he podido hablar con el servidor.");
    return null;
  }
}

function restBar(){
  if(!rest) return "";
  const left = Math.max(0, rest.until-Date.now());
  return '<button class="rest" data-act="stopRest">'+
    '<span class="rest-top"><span class="rv" id="restVal">'+fmtClock(left)+'</span>'+
    '<span class="rl">descansando'+(rest.ex?" · "+esc(rest.ex):"")+'<br>toca para saltarlo</span></span>'+
    '<span class="bar"><i id="restBar" style="width:'+(left/(rest.total*1000)*100)+'%"></i></span>'+
  '</button>';
}
function tickRest(){
  if(!rest) return;
  const left = Math.max(0, rest.until-Date.now());
  const v = $("#restVal"), b = $("#restBar");
  if(v) v.textContent = fmtClock(left);
  if(b) b.style.width = (left/(rest.total*1000)*100)+"%";
  if(left<=0){
    const ex = rest.ex;
    rest = null; clearInterval(restInt); restInt = null;
    buzz();
    notify("Descanso terminado", ex ? "Siguiente serie de "+ex : "A por la siguiente serie");
    setTimeout(stopKeepAlive, 4000);
    render();
  }
}
function startRest(secs, exName){
  secs = Number(secs)||0;
  if(secs<=0) return;
  unlockAudio();
  startKeepAlive();
  scheduleAlarm(secs);        /* suena aunque iOS congele el JavaScript */
  askNotif();
  pushScheduleRest(secs);     /* aviso en pantalla si hay servidor configurado */
  rest = {until:Date.now()+secs*1000, total:secs, ex:exName||""};
  clearInterval(restInt);
  restInt = setInterval(tickRest, 250);
}
function stopRest(){
  rest = null;
  clearInterval(restInt); restInt = null;
  clearAlarm(); stopKeepAlive(); pushCancelRest();
  render();
}

/* ─── gimnasio ─── */
function fmtDur(ms){
  const m = Math.floor(ms/60000);
  return m<60 ? m+" min" : Math.floor(m/60)+" h "+pad(m%60);
}
function setChip(s, isPR){
  if(isTodo(s)){
    const r = s.tReps || "—";
    return '<span class="set todo'+(isWarm(s)?" warm":"")+'">'+
      '<b>'+esc(r)+'</b>×'+(s.kg?s.kg+" kg":"pc")+(isWarm(s)?' <span style="font-size:9px">cal</span>':'')+'</span>';
  }
  return '<span class="set'+(isWarm(s)?" warm":(isPR?" pr":""))+'">'+
    '<b>'+s.reps+'</b>×'+(s.kg?s.kg+" kg":"pc")+(isWarm(s)?' <span style="font-size:9px">cal</span>':'')+'</span>';
}
/* Una fila por serie, editable en el sitio: peso, reps, tipo (calentamiento o
   trabajo) y el botón de cronómetro, que marca la serie como hecha y arranca el
   descanso. Tocarlo otra vez la desmarca. */
function setRow(s, i, j){
  const done = !isTodo(s);
  const kg = (s.kg===undefined || s.kg===null) ? "" : s.kg;
  const reps = s.reps || "";
  return '<div class="strow'+(done?" done":"")+'">'+
    '<span class="st-n">'+(j+1)+'</span>'+
    '<input class="field" id="stK'+i+'_'+j+'" inputmode="decimal" value="'+kg+'" placeholder="0" aria-label="Peso de la serie '+(j+1)+'">'+
    '<input class="field" id="stR'+i+'_'+j+'" inputmode="numeric" value="'+reps+'" placeholder="'+esc(s.tReps||"0")+'" aria-label="Repeticiones de la serie '+(j+1)+'">'+
    '<button class="st-tipo" data-t="'+(s.warmup?"C":"T")+'" data-act="stTipo" data-i="'+i+'" data-j="'+j+'" '+
      'title="'+(s.warmup?"Calentamiento":"Trabajo")+'" aria-label="Cambiar tipo de serie">'+(s.warmup?"C":"T")+'</button>'+
    '<button class="st-go" data-act="stMark" data-i="'+i+'" data-j="'+j+'" '+
      'aria-pressed="'+done+'" aria-label="'+(done?"Desmarcar serie":"Marcar hecha y descansar")+'">'+
      (done ? svg(I.check) : svg(I.timer))+'</button>'+
    '<button class="x" data-act="stDel" data-i="'+i+'" data-j="'+j+'" aria-label="Quitar serie">'+svg(I.x)+'</button>'+
  '</div>';
}
/* Guarda lo escrito en las casillas antes de volver a dibujar la pantalla,
   o se perderia al tocar cualquier boton de la fila. */
function leerFilas(i){
  const a = S.gym.active; if(!a) return;
  const idx = (i===undefined||i===null) ? a.entries.map((_,k)=>k) : [i];
  idx.forEach(k=>{
    const en = a.entries[k]; if(!en) return;
    en.sets.forEach((s,j)=>{
      const kIn = $("#stK"+k+"_"+j), rIn = $("#stR"+k+"_"+j);
      if(kIn){
        const v = parseFloat((kIn.value||"").replace(",","."));
        s.kg = isNaN(v) ? 0 : v;
      }
      if(rIn){
        const v = parseInt(rIn.value,10);
        if(!isNaN(v) && v>0) s.reps = v; else if(isTodo(s)) delete s.reps;
      }
    });
  });
}

function sessionHtml(a){
  const ex = (a.entries||[]).map((en,i)=>{
    const t = en.target;
    const done = hechas(en).filter(s=>!isWarm(s)).length;
    const meta = t
      ? (done+"/"+t.sets+" series"+(t.warm?" · "+t.warm+" cal":"")+
         " · descanso "+t.restWarm+"s cal / "+t.rest+"s trabajo")
      : (hechas(en).length+" serie"+(hechas(en).length===1?"":"s"));
    return '<div class="ex">'+
      '<div class="ex-head"><span class="ex-name">'+esc(en.ex)+
        (en.eq?' <span class="eq-tag">'+esc(en.eq)+'</span>':'')+
        (en.bumped?' <span class="ex-up">+'+fmtKg(en.bumped)+' kg</span>':'')+'</span>'+
        '<span class="ex-meta">'+meta+'</span></div>'+
      '<div class="strows">'+
        '<div class="sthead"><span>#</span><span>Peso (kg)</span><span>Reps</span><span>Tipo</span><span></span><span></span></div>'+
        en.sets.map((s,j)=>setRow(s, i, j)).join("")+
      '</div>'+
      '<button class="btn ghost sm" data-act="stAdd" data-i="'+i+'">+ serie</button>'+
    '</div>';
  }).join("");

  return '<div class="sess">'+
    '<div class="sess-head"><span class="nm">'+esc(a.name)+'</span>'+
      '<span class="tm" id="sessTimer">'+fmtDur(Date.now()-a.start)+'</span></div>'+
    restBar()+
    (ex || '<p class="hint">Añade el primer ejercicio de la sesión.</p>')+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn ghost" data-act="addEx" style="flex:1">+ Ejercicio</button>'+
      '<button class="btn" data-act="finishSheet" style="flex:1">Terminar</button>'+
    '</div>'+
  '</div>';
}

function historyHtml(n){
  const sess = S.gym.sessions.slice().sort((x,y)=>y.start-x.start);
  if(!sess.length) return '<div class="empty">Todavía no hay entrenamientos guardados.</div>';
  return '<div class="stack">'+sess.slice(0,n||10).map(s=>{
    const nSets = (s.entries||[]).reduce((t,e)=>t+e.sets.filter(x=>!isWarm(x)).length,0);
    return '<button class="row" data-act="sessDetail" data-id="'+s.id+'"><div class="row-main">'+
      '<span class="row-title">'+esc(s.name)+'</span>'+
      '<span class="row-sub mono">'+relDate(s.date)+' · '+(s.entries||[]).length+' ej · '+nSets+' series · '+money0.format(volumeOf(s))+' kg·rep</span>'+
    '</div><span class="row-val">'+fmtDur((s.end||s.start)-s.start)+'</span></button>';
  }).join("")+'</div>';
}

/* ─── gym · progreso ─── */
function progChart(exName){
  const pts = [];
  S.gym.sessions.slice().sort((a,b)=>a.start-b.start).forEach(s=>{
    (s.entries||[]).forEach(en=>{
      if(en.ex!==exName) return;
      const top = Math.max.apply(null, en.sets.filter(x=>!isWarm(x)).map(x=>x.kg).concat([0]));
      if(top>0) pts.push({d:s.date, kg:top});
    });
  });
  if(pts.length<1) return '<p class="hint">Sin series con peso registradas para este ejercicio.</p>';
  const last = pts.slice(-8);
  const max = Math.max.apply(null, last.map(p=>p.kg));
  return '<div class="prog">'+last.map(p=>{
    const d = parseKey(p.d);
    return '<div class="p"><span class="pv">'+p.kg+'</span>'+
      '<span class="pc" style="height:'+Math.max(4,p.kg/max*72)+'%"></span>'+
      '<span class="pd">'+d.getDate()+"/"+(d.getMonth()+1)+'</span></div>';
  }).join("")+'</div>';
}
function bodyChart(){
  const w = S.gym.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-8);
  if(!w.length) return '<p class="hint">Anota tu peso de vez en cuando para ver la tendencia.</p>';
  const min = Math.min.apply(null,w.map(x=>x.kg)), max = Math.max.apply(null,w.map(x=>x.kg));
  const span = (max-min) || 1;
  return '<div class="prog">'+w.map(p=>{
    const d = parseKey(p.date);
    return '<div class="p"><span class="pv">'+p.kg+'</span>'+
      '<span class="pc" style="height:'+(22+(p.kg-min)/span*56)+'%"></span>'+
      '<span class="pd">'+d.getDate()+"/"+(d.getMonth()+1)+'</span></div>';
  }).join("")+'</div>';
}
let progEx = null;
function gymProgreso(){
  const prs = records();
  const prKeys = Object.keys(prs).filter(k=>prs[k].kg>0).sort((x,y)=>prs[y].kg-prs[x].kg);

  const tiles = '<div class="tiles">'+
    '<div class="tile"><span class="tv">'+S.gym.sessions.length+'</span><span class="tl">entrenamientos</span></div>'+
    '<div class="tile"><span class="tv">'+weekStreak()+'</span><span class="tl">semanas seguidas</span></div>'+
    '<div class="tile"><span class="tv">'+money0.format(Math.round(totalVolume()/1000))+'k</span><span class="tl">kg·rep movidos</span></div>'+
    '<div class="tile"><span class="tv">'+loggedExercises().length+'</span><span class="tl">ejercicios distintos</span></div>'+
  '</div>';

  const goals = S.gym.goals.length
    ? '<div class="panel">'+S.gym.goals.map(g=>{
        const cur = prs[g.exercise] ? prs[g.exercise].kg : 0;
        const ok = g.targetWeight>0 ? cur>=g.targetWeight : false;
        const pct = g.targetWeight>0 ? Math.min(100, cur/g.targetWeight*100) : 0;
        return '<div class="goal'+(ok?" ok":"")+'">'+
          '<span class="gn">'+esc(g.exercise)+(g.note?' <span style="color:var(--text-3);font-weight:400;font-size:12px">· '+esc(g.note)+'</span>':'')+'</span>'+
          '<span class="gv">'+(g.targetWeight>0 ? cur+" / "+g.targetWeight+" kg" : "sin peso")+(ok?" ✓":"")+'</span>'+
          '<span class="bar"><i style="width:'+pct+'%"></i></span>'+
        '</div>';
      }).join("")+'</div>'+
      '<button class="btn ghost sm" data-act="newGoal" style="align-self:flex-start;margin-top:9px">Nuevo objetivo</button>'
    : '<div class="empty">Sin objetivos.<br>Toca <b>+</b> arriba para marcarte uno.</div>';

  if(!progEx || prKeys.indexOf(progEx)<0) progEx = prKeys[0] || (loggedExercises()[0] || "");
  const picker = prKeys.length
    ? '<section><h2 class="sec">Evolución</h2>'+
        '<div class="panel">'+
          '<select class="field" id="progSel" style="margin-bottom:13px">'+
            prKeys.map(k=>'<option value="'+esc(k)+'"'+(k===progEx?" selected":"")+'>'+esc(k)+'</option>').join("")+
          '</select>'+
          '<div id="progBox">'+progChart(progEx)+'</div>'+
        '</div></section>'
    : "";

  const prHtml = prKeys.length
    ? '<div class="stack">'+prKeys.slice(0,10).map(k=>
        '<div class="row"><div class="row-main"><span class="row-title">'+esc(k)+'</span>'+
        '<span class="row-sub mono">'+prs[k].reps+' reps</span></div>'+
        '<span class="row-val">'+prs[k].kg+' kg</span></div>').join("")+'</div>'
    : '<div class="empty">Los récords aparecen cuando registras series con peso.</div>';

  const w = S.gym.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const ult = w.length ? w[w.length-1] : null;
  const h = S.gym.profile.heightCm;
  const imc = (ult && h) ? (ult.kg/Math.pow(h/100,2)) : null;
  const cuerpo = '<section><h2 class="sec">Cuerpo</h2><div class="panel">'+
    '<div class="kv"><span>Peso actual</span><b class="mono">'+(ult? ult.kg+" kg" : "—")+'</b></div>'+
    '<div class="kv"><span>Altura</span><b class="mono">'+(h? h+" cm" : "—")+'</b></div>'+
    '<div class="kv"><span>Índice de masa corporal</span><b class="mono">'+(imc? imc.toFixed(1) : "—")+'</b></div>'+
    '<div style="margin-top:13px">'+bodyChart()+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:13px">'+
      '<button class="btn ghost sm" data-act="addWeight" style="flex:1">Anotar peso</button>'+
      '<button class="btn ghost sm" data-act="editProfile" style="flex:1">Altura y edad</button>'+
    '</div>'+
  '</div></section>';

  let unl = 0, tot = 0;
  const logros = LOGROS.map(g=>{
    const v = g.get(), t = tiersFor(v, g.th);
    unl += t; tot += g.th.length;
    const next = g.th[t];
    return '<div class="ach"><div class="an">'+
      '<div class="at">'+g.label+'</div>'+
      '<div class="av">'+money0.format(v)+(g.unit||"")+(next? " · siguiente nivel a los "+money0.format(next) : " · nivel máximo")+'</div>'+
    '</div><span class="pips">'+g.th.map((x,i)=>'<i data-on="'+(i<t?1:0)+'"></i>').join("")+'</span></div>';
  }).join("");

  return tiles+
    '<section><h2 class="sec">Objetivos</h2>'+goals+'</section>'+
    picker+
    '<section><h2 class="sec">Récords personales</h2>'+prHtml+'</section>'+
    cuerpo+
    '<section><h2 class="sec">Logros · '+unl+' de '+tot+'</h2><div class="panel">'+logros+'</div></section>';
}

/* ══════════ cultura ══════════ */
const culPct = it => (it.pages>0) ? Math.max(0, Math.min(100, Math.round((it.page||0)/it.pages*100))) : 0;
function culDias(it){
  if(!it.done) return "";
  const d = Math.round((parseKey(it.done)-parseKey(it.started))/86400000);
  if(d<=0) return "en el día";
  return "en "+d+" día"+(d===1?"":"s");
}
function culFila(it){
  const pct = culPct(it);
  const sub = it.done
    ? ("terminado "+relDate(it.done)+(culDias(it)?" · "+culDias(it):""))
    : ("empezado "+relDate(it.started)+(it.by?" · "+it.by:""));
  return '<button class="row" data-act="culOpen" data-id="'+it.id+'">'+
    '<div class="row-main">'+
      '<span class="row-title">'+esc(it.title)+'</span>'+
      '<span class="row-sub mono">'+esc(sub)+'</span>'+
      (!it.done && it.pages>0
        ? '<span class="cul-prog"><span class="bar"><i style="width:'+pct+'%"></i></span>'+
          '<span class="pc">'+pct+'%</span>'+
          '<span class="row-sub mono" style="grid-column:1/-1">página '+(it.page||0)+' de '+it.pages+'</span></span>'
        : '')+
    '</div>'+
    (it.score ? '<span class="score">'+it.score+'<small>/10</small></span>' : '<span class="row-val">→</span>')+
  '</button>';
}
function vCultura(){
  const c = culCat(S.culTab);
  const items = S.cultura.filter(x=>x.cat===S.culTab);
  const curso = items.filter(x=>!x.done).sort((a,b)=>b.started.localeCompare(a.started));
  const fin = items.filter(x=>x.done).sort((a,b)=>b.done.localeCompare(a.done));

  const notas = fin.filter(x=>x.score);
  const media = notas.length ? (notas.reduce((t,x)=>t+x.score,0)/notas.length) : 0;
  const esteAno = S.cultura.filter(x=>x.done && x.done.slice(0,4)===String(new Date().getFullYear())).length;

  /* Los terminados se agrupan por año: es la forma natural de mirar atrás. */
  let ultimoAno = null, finHtml = "";
  fin.forEach(it=>{
    const ano = it.done.slice(0,4);
    if(ano!==ultimoAno){
      if(ultimoAno!==null) finHtml += '</div>';
      finHtml += '<div class="cul-year">'+ano+'</div><div class="stack">';
      ultimoAno = ano;
    }
    finHtml += culFila(it);
  });
  if(ultimoAno!==null) finHtml += '</div>';

  return demoBanner()+
    '<div class="hero">'+
      '<span class="eyebrow">'+esteAno+' terminado'+(esteAno===1?"":"s")+' en '+new Date().getFullYear()+'</span>'+
      '<h1 class="title">Cultura</h1>'+
    '</div>'+
    '<div class="seg" role="group">'+
      CULTURA.map(x=>'<button data-act="culTab" data-c="'+x.id+'" aria-pressed="'+(S.culTab===x.id)+'">'+x.label+'</button>').join("")+
    '</div>'+
    '<section><h2 class="sec">'+c.verbo+' ahora</h2>'+
      (curso.length ? '<div class="stack">'+curso.map(culFila).join("")+'</div>'
        : '<div class="empty">Nada empezado.<br>Toca <b>+</b> para añadir un '+c.uno+'.</div>')+
    '</section>'+
    '<section><h2 class="sec">Terminados'+(notas.length?' · nota media '+media.toFixed(1).replace(".",","):'')+'</h2>'+
      (fin.length ? finHtml : '<div class="empty">Todavía no has terminado ningún '+c.uno+'.</div>')+
    '</section>';
}

  const it = S.cultura.filter(x=>x.id===id)[0]; if(!it) return;
  const c = culCat(it.cat);
  const pct = culPct(it);
  const libro = it.cat==="libros";

  const marcador = (libro && !it.done)
    ? '<div><span class="lbl-s">Punto de libro</span>'+
        '<div class="setform" style="grid-template-columns:1fr 1fr">'+

/* ══════════ pestaña IA ══════════
   Habla directamente con la API de Claude desde el navegador. La clave vive
   solo en este dispositivo y queda fuera de la copia de seguridad y de lo que
   se sincroniza (ver estadoSinSecretos).

   Modelo: claude-opus-5. Con pensamiento adaptativo, que en Opus 5 va activo
   por defecto, y esfuerzo medio: es una conversacion de movil, no trabajo de
   ingenieria, y el esfuerzo alto ahi solo alarga la espera y la factura.
   Se pide tambien el rescate automatico (fallbacks) por si un clasificador de
   seguridad declina la peticion. */
const IA_MODELO = "claude-opus-5";
const IA_URL = "https://api.anthropic.com/v1/messages";

/* Render minimo de Markdown: parrafos, negrita, listas, codigo en linea y en
   bloque. Se escapa TODO antes de tocar nada, porque el texto viene de fuera. */
function md(t){
  const bloques = esc(t).split(/```/);
  let out = "";
  bloques.forEach(function(b, i){
    if(i % 2 === 1){                       /* dentro de ``` */
      out += '<pre><code>' + b.replace(/^\w*\n/, "") + '</code></pre>';
      return;
    }
    b.split(/\n{2,}/).forEach(function(par){
      if(!par.trim()) return;
      let x = par
        .replace(/`([^`\n]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      const lineas = x.split("\n");
      if(lineas.every(function(l){ return /^\s*[-*]\s+/.test(l) || !l.trim(); })){
        out += '<ul>' + lineas.filter(function(l){ return l.trim(); })
          .map(function(l){ return '<li>' + l.replace(/^\s*[-*]\s+/, "") + '</li>'; }).join("") + '</ul>';
      }else{
        out += '<p>' + lineas.join("<br>") + '</p>';
      }
    });
  });
  return out;
}

/* Resumen compacto de los datos de la app, para que pueda responder sobre
   ellos. Se manda solo si el interruptor de contexto esta encendido. */
function iaContexto(){
  const hoy = new Date();
  const L = [];
  L.push("Hoy es " + fullDate(hoy) + " de " + hoy.getFullYear() + ".");

  if(S.habits.length){
    L.push("\nHABITOS (racha actual):");
    S.habits.forEach(function(h){
      L.push("- " + h.name + ": " + streak(h) + " dias seguidos" + (h.days[today()] ? ", hecho hoy" : ", hoy aun no"));
    });
  }
  const pend = S.tasks.filter(function(t){ return !t.done; });
  if(pend.length){
    L.push("\nPENDIENTES:");
    pend.forEach(function(t){ L.push("- [" + t.list + "] " + t.text); });
  }
  const mes = monthExpenses(0);
  if(mes.length){
    const porCat = {};
    mes.forEach(function(e){ porCat[e.cat] = (porCat[e.cat]||0) + e.amount; });
    L.push("\nGASTOS DE ESTE MES: " + money.format(sum(mes)) + " en " + mes.length + " apuntes.");
    Object.keys(porCat).sort(function(a,b){ return porCat[b]-porCat[a]; })
      .forEach(function(c){ L.push("- " + c + ": " + money.format(porCat[c])); });
    L.push("Meses anteriores: " + [1,2,3].map(function(i){
      const d = new Date(); d.setMonth(d.getMonth()-i);
      return MESES[d.getMonth()] + " " + money.format(sum(monthExpenses(i)));
    }).join(", ") + ".");
  }
  const prs = records(), claves = Object.keys(prs).filter(function(k){ return prs[k].kg > 0; });
  if(claves.length){
    L.push("\nGIMNASIO. Records personales:");
    claves.sort(function(a,b){ return prs[b].kg - prs[a].kg; }).slice(0,12)
      .forEach(function(k){ L.push("- " + k + ": " + prs[k].kg + " kg x " + prs[k].reps + " reps"); });
  }
  if(S.gym.sessions.length){
    L.push("Entrenos: " + S.gym.sessions.length + " en total, " + weekStreak() + " semanas seguidas, " +
           money0.format(Math.round(totalVolume())) + " kg-rep de volumen acumulado.");
    L.push("Ultimos: " + S.gym.sessions.slice().sort(function(a,b){ return b.start-a.start; }).slice(0,5)
      .map(function(x){ return x.name + " (" + relDate(x.date) + ")"; }).join(", ") + ".");
  }
  if(S.gym.routines.length){
    L.push("\nRUTINAS:");
    S.gym.routines.forEach(function(r){
      L.push("- " + r.name + ": " + r.exercises.map(function(e){
        const ss = routineSets(e), tr = ss.filter(function(x){ return !x.warmup; });
        return e.name + (e.eq ? " (" + e.eq + ")" : "") + " " + tr.length + "x" +
               (tr[0] ? repsRange(tr[0].reps).label + " @ " + tr[0].kg + "kg" : "");
      }).join("; "));
    });
  }
  if(S.gym.goals.length){
    L.push("\nOBJETIVOS: " + S.gym.goals.map(function(g){
      return g.exercise + " a " + g.targetWeight + " kg" + (g.note ? " (" + g.note + ")" : "");
    }).join(", ") + ".");
  }
  const w = S.gym.weights.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(w.length) L.push("Peso corporal actual: " + w[w.length-1].kg + " kg.");

  const enCurso = S.cultura.filter(function(x){ return !x.done; });
  const acabado = S.cultura.filter(function(x){ return x.done; });
  if(enCurso.length){
    L.push("\nCULTURA, en curso: " + enCurso.map(function(x){
      return x.title + (x.pages ? " (pagina " + (x.page||0) + " de " + x.pages + ")" : "");
    }).join(", ") + ".");
  }
  if(acabado.length){
    L.push("Terminado ultimamente: " + acabado.slice()
      .sort(function(a,b){ return b.done.localeCompare(a.done); }).slice(0,10)
      .map(function(x){ return x.title + (x.score ? " " + x.score + "/10" : ""); }).join(", ") + ".");
  }
  if(S.notes.length){
    L.push("\nNOTAS:");
    S.notes.slice(0,6).forEach(function(n){ L.push("- " + n.text.slice(0,300).replace(/\n/g, " / ")); });
  }
  return L.join("\n");
}

function iaBajar(){
  const v = $("#view");

async function iaPreguntar(texto){
  if(iaEnCurso || !texto.trim() || !S.ia.key) return;
  S.ia.msgs.push({role:"user", content:texto.trim()});
  iaEnCurso = true; iaParcial = "";
  save(); render(); iaBajar();

  const cuerpo = {
    model: IA_MODELO,
    max_tokens: 16000,
    stream: true,
    system: iaSistema(),
    output_config: {effort: "medium"},
    fallbacks: "default",
    messages: S.ia.msgs.map(function(m){ return {role:m.role, content:m.content}; })
  };

  let usoIn = 0, usoOut = 0, rechazo = false, error = null;

  try{
    const r = await fetch(IA_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": S.ia.key,
        "anthropic-version": "2023-06-01",
        "anthropic-beta": "server-side-fallback-2026-07-01",
        /* Sin esta cabecera la API rechaza las llamadas hechas desde un
           navegador. Se llama "dangerous" porque expone la clave en el
           dispositivo; aqui es una clave tuya en tu propio telefono. */
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify(cuerpo)
    });

    if(!r.ok){
      let detalle = "";
      try{ const j = await r.json(); detalle = (j.error && j.error.message) || ""; }catch(e){}
      error = r.status === 401 ? "La clave no es valida. Revisala en Ajustes."
            : r.status === 429 ? "Has llegado al limite de peticiones. Prueba en un rato."
            : r.status === 529 ? "La API esta sobrecargada. Prueba otra vez."
            : "La API respondio " + r.status + (detalle ? ": " + detalle : ".");
    }else{
      const lector = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while(true){
        const trozo = await lector.read();
        if(trozo.done) break;
        buf += dec.decode(trozo.value, {stream:true});
        const lineas = buf.split("\n");
        buf = lineas.pop();
        for(const linea of lineas){
          if(linea.indexOf("data:") !== 0) continue;
          let j = null;
          try{ j = JSON.parse(linea.slice(5).trim()); }catch(e){ continue; }
          if(j.type === "message_start" && j.message && j.message.usage){
            usoIn = j.message.usage.input_tokens || 0;
          }else if(j.type === "content_block_delta" && j.delta && j.delta.type === "text_delta"){
            iaParcial += j.delta.text;
            const vivo = $("#iaVivo");
            if(vivo){ vivo.className = "msg claude"; vivo.innerHTML = md(iaParcial); iaBajar(); }
          }else if(j.type === "message_delta"){
            if(j.usage) usoOut = j.usage.output_tokens || usoOut;
            if(j.delta && j.delta.stop_reason === "refusal") rechazo = true;
          }else if(j.type === "error"){
            error = (j.error && j.error.message) || "Error en la transmision.";
          }
        }
      }
    }
  }catch(e){
    error = "No he podido conectar. Comprueba que tienes internet.";
  }

  iaEnCurso = false;
  const texto2 = iaParcial;
  iaParcial = "";

  if(error){
    S.ia.msgs.pop();                       /* la pregunta vuelve al cuadro */
    save(); render();
    const t = $("#iaTexto"); if(t){ t.value = texto; t.focus(); }
    toast(error);
    return;
  }
  if(rechazo && !texto2){
    S.ia.msgs.push({role:"assistant", content:"No puedo responder a eso."});
  }else{
    S.ia.tokens.in += usoIn; S.ia.tokens.out += usoOut;
    S.ia.msgs.push({
      role:"assistant",
      content: texto2 || "(respuesta vacia)",
      uso: usoIn ? (money0.format(usoIn) + " tokens de entrada, " + money0.format(usoOut) + " de salida") : ""
    });
  }
  save(); render(); iaBajar();
}

    function(b){ if(!S.ia.key) $("#iaKey",b).focus(); });

/* ══════════ render ══════════ */
let timer = null, lastTab = null;
function render(){
  /* Apuntar una serie vuelve a dibujar la pantalla entera: si además saltase
     al principio de la lista, sería inusable. Guardamos dónde estaba. */
  const keepScroll = (lastTab === S.tab+"/"+S.gymTab) ? view.scrollTop : 0;
  lastTab = S.tab+"/"+S.gymTab;

  applyTheme();
  app.dataset.mod = S.tab;
  const tab = TABS.filter(t=>t.id===S.tab)[0];
  topTitle.textContent = tab.top;

  $("#tabbar").innerHTML = TABS.map(t=>
    '<button data-act="tab" data-tab="'+t.id+'" aria-current="'+(t.id===S.tab)+'">'+svg(I[t.id])+'<span>'+t.label+'</span></button>'
  ).join("");

  view.innerHTML = S.tab==="habitos" ? vHabitos()
    : S.tab==="tareas" ? vTareas()
    : S.tab==="gastos" ? vGastos()
    : S.tab==="notas"  ? vNotas()
    : S.tab==="cultura" ? vCultura()
    : S.tab==="ia" ? vIA()
    : vGym();
  view.scrollTop = keepScroll;

  const pb = $("#primaryBtn");
  pb.hidden = false;
  pb.setAttribute("aria-label", {habitos:"Nuevo hábito",tareas:"Añadir",gastos:"Nuevo gasto",notas:"Nueva nota",gym:"Añadir ejercicio",cultura:"Añadir a la lista",ia:"Ajustes del chat"}[S.tab]);

  const f = $("#taskForm");
  if(f) f.addEventListener("submit", e=>{
    e.preventDefault();
    const inp = $("#taskInput"), txt = inp.value.trim();
    if(!txt) return;
    S.tasks.unshift({id:uid(),text:txt,done:false,list:S.list,ts:Date.now()});
    save(); render();
    const n = $("#taskInput"); if(n) n.focus();
  });

  const sr = $("#noteSearch");
  if(sr) sr.addEventListener("input", e=>{
    notaQuery = e.target.value;
    $("#notesList").innerHTML = notesHtml();
  });

  const fIA = $("#iaForm");
  if(fIA){
    const caja = $("#iaTexto");
    /* La caja crece con el texto hasta un maximo, como en cualquier chat. */
    const crecer = function(){
      caja.style.height = "auto";
      caja.style.height = Math.min(130, caja.scrollHeight) + "px";
    };
    caja.addEventListener("input", crecer);
    fIA.addEventListener("submit", function(e){
      e.preventDefault();
      const t = caja.value;
      caja.value = ""; crecer();
      iaPreguntar(t);
    });
    caja.addEventListener("keydown", function(e){
      /* Con teclado fisico, Enter envia; Mayus+Enter hace salto de linea. */
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        fIA.dispatchEvent(new Event("submit"));
      }
    });
    if(S.tab === "ia") iaBajar();
  }

  const ps = $("#progSel");
  if(ps) ps.addEventListener("change", e=>{
    progEx = e.target.value;
    $("#progBox").innerHTML = progChart(progEx);
  });

  clearInterval(timer);
  if(S.tab==="gym" && S.gym.active){
    timer = setInterval(()=>{
      const el = $("#sessTimer");
      if(el && S.gym.active) el.textContent = fmtDur(Date.now()-S.gym.active.start);
      else clearInterval(timer);
    },10000);
  }
}

  const txt = $("#nText").value.trim();

  if(id){

    if(n){ n.text = txt; n.ts = Date.now(); }
  }else{
    S.notes.unshift({id:uid(),text:txt,pinned:false,ts:Date.now()});
  }
  save(); closeSheet(); render();
}

/* El selector de ejercicios sirve para dos cosas: añadir a la sesión en curso
   o añadir a la rutina que estás editando. exPickTo dice a cuál de las dos. */
let exPickTo = "session", exPickIdx = null;
function sheetAddEx(to, idx){
  exPickTo = to || "session";
  exPickIdx = (idx===undefined) ? null : idx;
  const prs = records();
  openSheet(exPickIdx===null ? "Añadir ejercicio" : "Cambiar ejercicio",
    '<input class="field" id="exSearch" placeholder="Buscar o escribir uno nuevo…" autocomplete="off">'+
    '<div class="picker" id="exList"></div>'+
    '<button class="btn ghost wide" data-act="newEx">Usar lo que he escrito</button>',
    b=>{
      const inp = $("#exSearch",b), list = $("#exList",b);
      const draw = ()=>{
        const q = inp.value.trim().toLowerCase();
        const items = S.gym.exercises.filter(e=>!q||e.toLowerCase().indexOf(q)>=0).slice(0,60);
        list.innerHTML = items.length
          ? items.map(e=>'<button data-act="pickEx" data-ex="'+esc(e)+'">'+esc(e)+
              (MATERIAL[e]?' <span class="eq-tag">'+esc(MATERIAL[e])+'</span>':'')+
              (prs[e]?' <span class="mono" style="color:var(--text-3);font-size:11px">· '+prs[e].kg+' kg</span>':'')+'</button>').join("")
          : '<button style="color:var(--text-3)" disabled>Ninguno coincide — usa el botón de abajo</button>';
      };
      draw(); inp.addEventListener("input",draw); inp.focus();
    });
}
function addExercise(name){
  if(S.gym.exercises.indexOf(name)<0) S.gym.exercises.push(name);
  if(exPickTo==="routine"){
    readRoutineDOM();
    if(exPickIdx !== null){
      /* Cambiar el ejercicio de una fila conserva sus series: normalmente lo
         que cambias es el movimiento, no el esquema de repeticiones. */
      const e = rtDraft.exercises[exPickIdx];
      e.name = name;
      e.eq = MATERIAL[name] || e.eq || "";
      exPickIdx = null;
    }else{
      rtDraft.exercises.push({
        name:name,
        eq:MATERIAL[name] || "",
        restSeconds:S.gym.restDefault,
        restWarmup:60,
        sets:[{reps:"8-10",kg:0},{reps:"8-10",kg:0},{reps:"8-10",kg:0}]
      });
    }
    save(); renderRoutineSheet();
    return;
  }
  if(!S.gym.active) return;
  /* Un ejercicio suelto arranca con tres series vacias listas para rellenar. */
  const rest = S.gym.restDefault;
  S.gym.active.entries.push({
    ex:name,
    sets:[0,1,2].map(function(){ return {todo:true, warmup:false, kg:0, tReps:"", tRest:rest}; })
  });
  save(); closeSheet(); render();
}

  const a = S.gym.active; if(!a) return;
  const nSets = (a.entries||[]).reduce((t,e)=>t+e.sets.filter(x=>!isWarm(x)).length,0);
  openSheet("Terminar entrenamiento",
    '<div class="panel">'+
      '<div class="kv"><span>Duración</span><b class="mono">'+fmtDur(Date.now()-a.start)+'</b></div>'+

      '<div class="kv"><span>Volumen</span><b class="mono">'+money0.format(volumeOf(a))+' kg·rep</b></div>'+
    '</div>'+

}
